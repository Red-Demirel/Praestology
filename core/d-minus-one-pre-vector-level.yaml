# ─────────────────────────────────────────────
# §3  INTERPRETIVE NOTES (TERTIARY)
# ─────────────────────────────────────────────

interpretive_notes:

  purpose: >
    Interpretive observations that motivate or contextualize the
    derivation in §1–§2. None of these are premises of the derivation;
    they are consequences, contextual notes, or convergent patterns.
    Clearly separated from the algebraic content.

  hurwitz_non_resonance:
    statement: >
      φ is the least-approximable irrational number in the sense of
      Diophantine approximation — its continued fraction [1;1;1,1,...]
      converges more slowly than any other irrational. This is the
      Hurwitz/Lagrange extremal property.
    role: >
      This is *why* the recurrence's growth eigenvalue is the optimal
      non-resonant scaling: a vector chain scaled by φ never returns
      to its starting orientation closely enough to cause destructive
      interference. But this is a consequence of the algebraic
      derivation in §1–§2, not an argument for it. The recurrence is
      derived first; φ emerges; its non-resonance is then recognized
      as the reason the derived scaling is stable.
    removed_lines: >
      The earlier "not a root of unity" argument has been removed. Every
      irrational satisfies "not a root of unity," so the condition
      selects nothing. The Hurwitz/Lagrange statement is the correct
      and non-vacuous form.

  count_three_from_co_naturality:
    statement: >
      The D₀ basis has exactly three independent directions because
      Cl(3,0) is the co-natural algebra for 3-dimensional space. The
      count three is a property of the algebra, not of the non-resonance
      condition.
    correction_from_v0_3: >
      v0.3 implied that φ governs the scaling of all three directions
      in a way that could be read as "φ produces the count three."
      This is a category error. Non-resonance selects a scale; the
      count comes from co-naturality. The two facts are independent:
        - D₀ has three basis directions (from Cl(3,0) ≅ 3D space)
        - The relaxation toward each of those directions proceeds at
          rate φ (from the recurrence in §1)
    what_phi_does_not_produce: >
      φ does not produce the number three. It does not select which
      three directions exist. It characterizes the rate at which the
      trajectory approaches whichever fixed basis the recurrence
      converges to.

  fixed_points_do_not_scale:
    statement: >
      The D₀ basis vectors are the fixed points of Φ₀ — they are
      invariant under the closure map. Fixed points do not scale.
      φ characterizes the *relaxation* of the trajectory toward those
      fixed points, not a property of the fixed points themselves.
    language_correction: >
      The earlier adjective "φ-scaled" applied to the D₀ basis was
      conceptually confused — it attributed to the fixed points what
      belongs to the trajectory. v0.4 uses "relaxation rate φ" for
      the trajectory and does not characterize the fixed points by φ.
      The correction applies to the language of CCR⁰ as well: CCR⁰
      describes the relaxation, not the endpoint.

  biological_phi_convergence:
    statement: >
      φ appears in biological growth patterns (phyllotaxis, shell
      spirals), quasicrystal diffraction, and optimal packing
      configurations. If these are instances of the same non-resonance
      condition applied at higher commitment depths, this would be
      cross-domain convergence.
    status: >
      STRUCTURAL INVESTIGATION — not asserted as derivation. Requires
      the D₋₁ → D₀ chain to be confirmed by SIM-004-v2 first, and the
      higher-depth application of the same non-resonance condition to
      be shown explicitly. Flagged as convergent pattern, not evidence.

