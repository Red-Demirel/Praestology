# /core/d-minus-one-pre-vector-level.yaml
name: "D₋₁: Pre-Vector Level and the Non-Resonant Scaling Eigenvalue"
version: "0.3"
status: "STRUCTURAL CANDIDATE — D₋₁ as the R1/R2 transition restated in
         vector-iteration language; φ as non-resonant scaling eigenvalue
         derived from a physical selection principle, not asserted;
         basis_note establishes φ governs the entire grade-1 basis;
         algebraic→geometric invariant transition flagged at D₀→D₁;
         pending SIM-004-v2 confirmation of the full chain
         D₋₁ → D₀ → D₁ → α⁻¹"
domain: "Core"

description: >
  The depth hierarchy extends one level below D₀. D₋₁ is not a new
  ontological level — it is the R1/R2 transition from specifications.yaml
  (isotropic scalar potential → first distinction) restated in the
  vector-iteration language of the depth recursion. Establishing D₋₁
  formally completes the chain: the same closure map procedure that
  produces D₁ from D₀ produces D₀ from D₋₁, with the non-resonant
  scaling eigenvalue φ as the structural invariant of the D₋₁ → D₀
  transition.

  The D₀ → D₁ transition introduces a qualitative shift in the nature
  of the scaling invariant: φ at D₋₁ → D₀ is an algebraic eigenvalue
  of a recurrence; Wr_eq = 3/2 at D₀ → D₁ is a topological invariant
  of an embedded curve. This transition from algebraic to geometric
  invariant marks the point where the closure mechanism first produces
  topology — not merely directed structure.

dependency_map:
  requires:
    - "core/specifications.yaml (R1 — existence, R2 — distinction)"
    - "core/process-physics/ga-grades-as-process-stages.yaml"
    - "core/process-physics/ccr-iteration-by-depth.yaml"
    - "core/process-physics/bivector-partial-parameters.yaml"
  relationship_to_existing_files: >
    D₋₁ is NOT a new depth below R1. It is the R1/R2 transition
    (indeterminate scalar potential → first directed vector) described
    in the language of the depth recursion rather than the rule language.
    The two descriptions are the same event at different levels of
    mathematical precision. Cross-referencing rather than replacing
    existing files is the correct approach.

---

d_minus_one:
  identity: "D₋₁ — Isotropic Scalar Phase Potential"
  relationship_to_r1_r2: >
    D₋₁ is the R1 ground state: indeterminate scalar potential,
    no preferred direction, no grade structure beyond grade-0.
    In the multivector language: D₋₁ = {α·1 : α ∈ ℝ} — the
    grade-0 subspace of Cl(3,0). Maximum freedom; null space of
    the commitment operator. Identical to what specifications.yaml
    calls "pure potential prior to R2 distinction."
  what_makes_it_a_level: >
    D₋₁ is a level in the depth recursion because it is the domain
    on which Φ₀ acts — the closure map whose fixed points are the
    grade-1 vectors of D₀. The same operator/value split applies:
      Φ₀: grade-0 configurations → grade-0 configurations
      CCR⁰: the value Φ₀ computes at convergence
      D₀ = Fix(Φ₀(D₋₁))
    The fixed points of Φ₀ acting on D₋₁ are stable directed
    grade-1 vectors — the first distinctions of R2.

  closure_map_phi_0:
    statement: >
      Φ₀ is the phase-relaxation map that finds the stable directional
      baseline from isotropic scalar noise. The closure condition is:
      the vector configuration v* is invariant under its own directional
      locking — it does not precess or drift under the phase dynamics.
    stability_requirement: >
      At D₋₁ the phase configuration background is scalar and isotropic.
      The D₋₁ → D₀ transition must produce a stable directed baseline —
      a vector configuration that does not drift or decay under the
      phase dynamics. Stability requires the scaling ratio between
      successive vector states to be maximally non-resonant: no integer
      power of the ratio can approximate 1 closely enough to cause
      destructive interference.
    non_resonance_condition: >
      The optimal scaling ratio for non-resonance is the number with
      the slowest-converging continued fraction — φ = (1+√5)/2.
      This is the "most irrational" number in the sense of Diophantine
      approximation: it is the least approximable by rationals, hence
      the most resistant to periodic resonance.
    fibonacci_as_consequence: >
      The Fibonacci recurrence v_{k+1} = v_k + v_{k-1} is the unique
      linear two-step recurrence whose characteristic equation has φ
      as a root. It is a consequence of the non-resonance condition,
      not an independent assumption. If the stability requirement
      holds, the recurrence follows.
    basis_note: >
      The Fibonacci recurrence establishes φ as the scaling eigenvalue
      for any stable grade-1 direction in Cl(3,0). All three basis
      vectors e₁, e₂, e₃ of D₀ carry this eigenvalue — φ governs
      the scaling of the entire grade-1 basis, not a single preferred
      direction. The three vectors are the three independent applications
      of the same D₋₁ → D₀ closure in three orthogonal directions,
      consistent with R5 isotropy. Φ₀ produces {e₁, e₂, e₃}
      simultaneously precisely because no direction is preferred at D₋₁;
      the non-resonance condition is satisfied in all three orthogonal
      directions by the same eigenvalue φ.

---

phi_as_scaling_eigenvalue:
  statement: >
    The Fibonacci recurrence v_{k+1} = v_k + v_{k-1} has a scaling
    eigenvalue λ satisfying:
      λ·v_k = v_{k+1} = v_k + v_{k-1}  →  λ² - λ - 1 = 0
    The positive root is φ = (1 + √5)/2 ≈ 1.618...
    This is the non-resonant scaling eigenvalue of the D₋₁ → D₀
    transition: the unique ratio at which successive vector states
    scale without destructive periodic resonance.
  why_non_resonant: >
    φ is irrational and not a root of unity — no integer power of
    φ equals 1. This means a vector sequence scaled by φ never
    returns exactly to its starting orientation, preventing the
    phase cancellation (destructive interference) that would
    collapse the vector baseline back to the D₋₁ isotropic state.
    φ is the minimum-friction scaling eigenvalue: it maintains
    directed growth without resonance accumulation.
  why_not_sqrt_2: >
    √2 is also irrational but has a periodic continued fraction
    [1; 2, 2, 2, ...], so it is well-approximable by rationals at
    certain scales — it resonates. φ has the slowest-converging
    continued fraction [1; 1, 1, 1, ...], making it the optimal
    non-resonant scaling. Other recurrences (v_{k+1} = v_k,
    v_{k+1} = 2v_k - v_{k-1}) either do not scale or scale at
    resonant ratios; the non-resonance condition singles out φ.
  connection_to_bivector_folding: >
    The outer product v_k ∧ v_{k+1} of two consecutive φ-scaled
    vectors produces a bivector plane B = v_k ∧ v_{k+1} whose
    area ratio between successive folds is also φ — the bivector
    plane grows at the same non-resonant rate as the vectors that
    generate it. This establishes the stable orientational growth
    that Φ₁ then closes into the Möbius vortex of D₁.
  epistemic_status: >
    STRUCTURAL OBSERVATION — φ emerges from the non-resonance
    condition of the D₋₁ → D₀ transition as a selection principle.
    The Fibonacci recurrence is its algebraic expression. Its
    connection to the golden ratio appearing in biological growth
    patterns, quasicrystals, and optimal packing is noted as
    convergent structure — all are instances of the same
    non-resonance condition applied at different commitment depths.
    This connection is not asserted as a derivation; it is flagged
    as a structural pattern worth investigating once the D₀ → D₁
    chain is confirmed by SIM-004-v2.

---

algebraic_to_geometric_invariant_transition:
  statement: >
    The two depth transitions in the chain carry structurally
    different kinds of scaling invariant:

    D₋₁ → D₀:  φ = (1+√5)/2
      Kind: algebraic eigenvalue of a recurrence relation
      Origin: the non-resonance condition on iterating vectors
      Meaning: minimum-friction, non-resonant directional scaling
      Topology produced: none — grade-1 vectors have direction but
        no enclosed area, no writhe, no linking

    D₀ → D₁:  Wr_eq = 3/2
      Kind: topological invariant of an embedded curve
        (writhe from Calugareanu-White-Fuller applied to the
        equilibrium Möbius centreline)
      Origin: the 720° closure of the Möbius vortex in 3D
      Meaning: the self-linking geometry of the closed curve
      Topology produced: the first genuine topology — enclosed
        area (bivector plane), writhe, chirality, spin-½

  significance: >
    The transition from algebraic to geometric invariant at D₀→D₁
    is not incidental. It marks the point where the closure mechanism
    first produces topology rather than merely directed structure.
    Before D₁: the structures are directed (grade-1 vectors) but not
    closed — no enclosed area, no linking number, no chirality.
    At D₁: the Möbius vortex is a closed curve in 3D with
    well-defined writhe, a topological invariant that cannot be
    removed by smooth deformation. This is the origin of matter's
    topological protection — and it arises at exactly the depth
    where the invariant type changes from algebraic to geometric.

  implication_for_ccr_series: >
    If the pattern continues, D₁ → D₂ may introduce a third kind
    of invariant — combinatorial or index-theoretic (the Connes-Dirac
    spectral index proposed in the session-3 induction). The
    invariant-type sequence algebraic → geometric → combinatorial
    would then be a structural signature of the depth hierarchy,
    not a coincidence. Open: confirm this at D₂.

