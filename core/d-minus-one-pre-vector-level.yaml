# /core/d-minus-one-pre-vector-level.yaml
name: "D₋₁: Pre-Vector Level and the Non-Resonant Scaling Eigenvalue"
version: "0.4"
status: "STRUCTURAL CANDIDATE — geometric origin of the recurrence derived;
         φ and φ⁻¹ as algebraic consequences of the recurrence; CCR⁰ = φ⁻¹
         derived as the transient retention factor; pending SIM-004-v2
         confirmation of the full chain D₋₁ → D₀ → D₁ → α⁻¹"
domain: "Core"

description: >
  The depth hierarchy extends one level below D₀. D₋₁ is not a new
  ontological level — it is the R1/R2 transition from specifications.yaml
  (isotropic scalar potential → first distinction) restated in the
  vector-iteration language of the depth recursion. Establishing D₋₁
  formally completes the chain: the same closure map procedure that
  produces D₁ from D₀ produces D₀ from D₋₁, with the non-resonant
  scaling eigenvalue φ as the structural invariant of the D₋₁ → D₀
  transition.

  v0.4 restructures the derivation in strict direction-of-explanation
  order: the geometric origin of the recurrence is derived first
  (§geometric_origin); the algebraic consequences (φ, φ⁻¹, CCR⁰)
  follow (§algebraic_consequences); interpretive observations are
  clearly marked as tertiary convergence notes (§interpretive_notes).
  The root-of-unity argument has been removed as vacuous; the
  Fibonacci uniqueness claim has been relocated into the derivation
  where it is provable; the "three directions" count is attributed
  to co-naturality of Cl(3,0) with 3D, not to non-resonance;
  φ is characterized as the relaxation rate toward D₀, not a
  property of the fixed point.

dependency_map:
  requires:
    - "core/specifications.yaml (R1 — existence, R2 — distinction)"
    - "core/process-physics/ga-grades-as-process-stages.yaml"
    - "core/process-physics/ccr-iteration-by-depth.yaml"
    - "core/process-physics/bivector-partial-parameters.yaml"
  relationship_to_existing_files: >
    D₋₁ is NOT a new depth below R1. It is the R1/R2 transition
    (indeterminate scalar potential → first directed vector) described
    in the language of the depth recursion rather than the rule language.
    The two descriptions are the same event at different levels of
    mathematical precision. Cross-referencing rather than replacing
    existing files is the correct approach.

---

# ─────────────────────────────────────────────
# §1  GEOMETRIC ORIGIN OF THE RECURRENCE
# ─────────────────────────────────────────────

geometric_origin:

  purpose: >
    Derive the two-step memory relation v_{k+2} = v_{k+1} + v_k from
    the minimal geometric requirements of the D₋₁ → D₀ transition.
    This is the primary derivation; the eigenvalue consequences in §2
    follow from it.

  two_vector_states:
    statement: >
      Two vector states v_k and v_{k+1} in D₀ generate a single bivector
      plane B_k = v_k ∧ v_{k+1}. This is the minimal relational closure
      of two 1D states. It has static geometric orientation — a plane
      in Cl(3,0) — but no process, no memory, no scale.
    role: "Baseline: one bivector plane, no recurrence"

  three_vector_states:
    statement: >
      A third vector state v_{k+2} generates an adjacent bivector closure
      B_{k+1} = v_{k+1} ∧ v_{k+2}. The intermediate state v_{k+1} is the
      shared geometric coupling between B_k and B_{k+1}.
    role: >
      This is the minimal configuration that supports process: two
      bivectors coupled through a shared boundary state. The recurrence
      appears at this level, not at the two-state level.

  non_destructive_phase_conservation:
    statement: >
      Requiring that the coupled bivector chain does not destructively
      cancel phase across adjacent steps binds the three vector states
      through a linear two-step memory relation. The relation must
      express v_{k+2} as a linear combination of v_{k+1} and v_k — the
      two states available at the boundary of B_{k+1}.
    minimality: >
      Among linear two-step recurrences with positive integer coefficients,
      the relation v_{k+2} = v_{k+1} + v_k is the unique one that:
        - carries the phase of the shared boundary state v_{k+1}
        - carries the phase of the prior non-shared state v_k
        - introduces no additional integer weight (no 2v_{k+1} or 2v_k)
      The minimality requirement is what makes this recurrence unique
      in context. It is not unique over all linear recurrences in general.

  derivation_of_uniqueness:
    statement: >
      The phase of B_{k+1} has two contributions: the shared boundary
      v_{k+1} and the newly introduced v_{k+2}. Non-destructive
      conservation requires that the phase of v_{k+2} not cancel the
      phase carried by v_{k+1}. The minimal relation with this property,
      where each integer coefficient is 1 (no multiplicative bias toward
      either contribution), is v_{k+2} = v_{k+1} + v_k.
    provable_over: "ℤ⁺ coefficients of minimal total weight"
    status: >
      DERIVED given the geometric setup. The uniqueness claim is
      legitimate here, in context — not as a general claim about
      recurrences over ℝ.

  what_the_recurrence_produces:
    statement: >
      The recurrence is a two-step memory relation whose iteration
      from an arbitrary initial pair (v_0, v_1) generates the
      trajectory of the D₋₁ → D₀ transition. Fixed points and
      eigenvalues are computed in §2.
    role: "The recurrence is the object; eigenvalues are its algebra"

---

# ─────────────────────────────────────────────
# §2  ALGEBRAIC CONSEQUENCES
# ─────────────────────────────────────────────

algebraic_consequences:

  characteristic_equation:
    statement: >
      The recurrence v_{k+2} = v_{k+1} + v_k has companion matrix
        M = [[1, 1],
             [1, 0]]
      with characteristic polynomial
        λ² - λ - 1 = 0
    derived_from: "§geometric_origin"

  eigenvalues:
    statement: >
      The two roots of the characteristic equation are:
        λ₁ = φ   = (1 + √5)/2 ≈  1.618034
        λ₂ = -1/φ = (1 - √5)/2 ≈ -0.618034
      These are algebraic in ℚ(√5). No new algebraic content is
      introduced beyond what the recurrence already requires.
    reading:
      lambda_1: "Growth mode — the committed direction"
      lambda_2: "Decay mode — the transient/undecided direction"
    band_compatibility: >
      The viable CCR band is 0 < CCR < 1 (closure-configuration-ratio.yaml:
      CCR = 1 is the uncommitted limit, CCR → 0 is forbidden by R1).
      |λ₁| = φ > 1 exceeds the band. |λ₂| = φ⁻¹ ≈ 0.618 lies in the
      band. φ⁻¹ is therefore the unique eigenvalue magnitude compatible
      with the framework's own viability constraint.

  general_solution:
    statement: >
      The general solution of the recurrence is
        v_k = α φᵏ u + β (-1/φ)ᵏ w
      where u and w are the two eigenvectors and α, β are fixed by the
      initial pair (v_0, v_1). As k → ∞ the φᵏ mode dominates; the
      transient mode decays at |λ₂| = φ⁻¹ per step.
    convergence_target: >
      The D₀ basis vectors are the fixed points of Φ₀ — the configuration
      the trajectory converges to. φ characterizes the *relaxation toward*
      those fixed points, not a property of the fixed points themselves.

  ccr_0_derivation:
    symbol: "CCR⁰"
    value: "φ⁻¹ = (√5 - 1)/2 ≈ 0.618034"
    statement: >
      CCR⁰ is the retention factor of the decaying transient mode of
      the D₋₁ → D₀ transition. It is the fraction of open phase space
      carried forward per cycle — the residual openness that the next
      cycle must process.
    role: >
      The φᵏ mode is the committed direction (grows without bound).
      The (-1/φ)ᵏ mode is the undecided/transient direction (decays
      by φ⁻¹ per cycle). After one cycle, φ⁻¹ of the transient survives;
      the complement has been resolved or carried forward.
    reading_precision: >
      CCR⁰ is a property of the relaxation trajectory, not of the fixed
      points. It measures the per-cycle retention of openness during
      the approach to D₀. It is not attributed to the D₀ basis vectors
      themselves — fixed points do not scale.
    uniqueness: >
      φ⁻¹ is the unique eigenvalue magnitude of the recurrence that
      lies in the viable CCR band. The framework's own viability
      constraint selects it without additional assumption.
    epistemic_status: >
      DERIVED from the recurrence in §geometric_origin. The open item
      "CCR⁰ = φ or a simple function of φ" is now closed with a specific
      value, using only the recurrence's own structure.

  alternating_sign_note: >
    The decaying eigenvalue is negative (λ₂ = -1/φ). The transient
    alternates sign each cycle. This is the algebraic signature of a
    conjugate relation between the committed and transient modes
    (see commitment-depletion-duality.yaml). Flagged as a potential
    structural link, not asserted as a derivation.

