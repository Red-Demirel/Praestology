three_level_chain:
  d_minus_1_to_d0:
    closure_map: "Φ₀"
    input: "D₋₁ — isotropic grade-0 scalar potential"
    output: "D₀ — stable grade-1 basis {e₁, e₂, e₃}, all φ-scaled"
    scaling_invariant: "φ = (1+√5)/2 — non-resonant algebraic eigenvalue"
    physical_reading: >
      R1/R2 transition: indeterminate potential develops first
      directed distinctions. φ ensures all three basis directions
      are stable against resonance collapse. R5 isotropy requires
      all three directions simultaneously — no preferred direction
      at D₋₁ means the closure applies uniformly in all three.
    ccr_value: "CCR⁰ — not yet computed; candidate: φ itself or a
                simple function of φ and the Cl(3,0) geometry"

  d0_to_d1:
    closure_map: "Φ₁"
    input: "D₀ — grade-1 basis {e₁, e₂, e₃}, φ-scaled"
    intermediate: "v_k ∧ v_{k+1} = B — bivector planes from φ-scaled vector pairs"
    containment: "B² = -1 → unit bivector periodicity → 2π/4π boundary metrics"
    output: "D₁ — 720° Möbius vortex"
    topological_invariant: "Wr_eq = 3/2 (CWF on equilibrium centreline)"
    invariant_type_shift: >
      Algebraic (φ) → Geometric (Wr_eq): first topology appears here.
      The bivector plane has enclosed area; the Möbius closure has writhe.
    geometric_yield: "f_closure = (1/4π) ∫_{S²} χ(B) dB (GP solve)"
    ccr_value: "CCR¹ = 1 (reference unit — to be confirmed non-circularly
                by SIM-004-v2)"

  complete_formulation: >
    α⁻¹ = 1 / (Wr_eq · f_closure)
         = 1 / (3/2 · f_closure)
    where f_closure is the only quantity requiring numerical computation
    (the GP solve over S²). Wr_eq = 3/2 is topologically fixed.
    The full chain from D₋₁ to α⁻¹:
      φ (non-resonant algebraic eigenvalue of D₋₁ → D₀)
      → stable grade-1 basis {e₁, e₂, e₃}, all φ-scaled
      → bivector planes {B₁, B₂, B₃} via outer products of φ-scaled pairs
      → 720° Möbius vortex (D₁ fixed point under Φ₁)   [topology first appears]
      → Wr_eq = 3/2 (topological invariant of D₁)
      → f_closure (geometric yield of Φ₁ over S²)
      → α⁻¹ = 1/(Wr_eq · f_closure)

geometric_origin_of_the_recurrence:
  statement: >
    The Fibonacci recurrence is not assumed; it is the minimal linear
    two-step memory relation compatible with non-destructive phase
    conservation across adjacent bivectors. Two vector states produce
    one bivector plane (static orientation). Three vector states with
    a shared boundary produce two adjacent bivectors coupled through
    the shared state — and this coupling is what requires the memory
    relation v_{k+2} = v_{k+1} + v_k.
  two_vs_three_states:
    two_states: "v_k, v_{k+1} → single bivector plane (static orientation, no process)"
    three_states: "v_k, v_{k+1}, v_{k+2} with shared boundary → process memory; φ emerges as the scaling eigenvalue"
  placement_in_depth_table: >
    φ operates at both D₋₁ → D₀ (algebraic eigenvalue of vector
    baseline) and D₀ → D₁ (geometric scaling of adjacent bivector
    chain). Same non-resonance principle, two realizations.
  direction_of_explanation: >
    The direction is now: minimal non-destructive coupling of adjacent
    bivectors → two-step memory relation → φ as eigenvalue. Not:
    assumption of Fibonacci → consequence of φ. This is a genuine
    improvement in the epistemic posture — the recurrence is derived
    from a physical requirement, not asserted as a mathematical form.

