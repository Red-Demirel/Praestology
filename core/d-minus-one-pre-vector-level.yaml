# ─────────────────────────────────────────────
# §4  THE THREE-LEVEL CHAIN
# ─────────────────────────────────────────────

three_level_chain:

  d_minus_1_to_d0:
    closure_map: "Φ₀"
    input: "D₋₁ — isotropic grade-0 scalar potential"
    output: "D₀ — stable grade-1 basis; the three directions are co-natural with 3D"
    relaxation_rate: "φ per cycle (from the recurrence in §1)"
    transient_retention: "φ⁻¹ per cycle = CCR⁰"
    physical_reading: >
      R1/R2 transition: indeterminate potential develops first directed
      distinctions. The three directions are the grade-1 subspace of
      Cl(3,0); the count is from co-naturality. The relaxation toward
      each fixed direction proceeds at rate φ; the per-cycle retention
      of openness is φ⁻¹.
    ccr_value: "CCR⁰ = φ⁻¹ (derived §2)"

  d0_to_d1:
    closure_map: "Φ₁"
    input: "D₀ — grade-1 basis; fixed points of Φ₀"
    intermediate: "v_k ∧ v_{k+1} = B — bivector planes from adjacent vector pairs"
    containment: "B² = -1 → unit bivector periodicity → 2π/4π boundary metrics"
    output: "D₁ — 720° Möbius vortex"
    topological_invariant: "Wr_eq = 3/2 (CWF on equilibrium centreline)"
    invariant_type_shift: >
      Algebraic (φ, φ⁻¹) → Geometric (Wr_eq): first topology appears
      at this transition. The bivector plane has enclosed area; the
      Möbius closure has writhe. The invariant type changes from
      eigenvalue-of-recurrence to topological-writhe-of-curve.
    geometric_yield: "f_closure = (1/4π) ∫_{S²} χ(B) dB (GP solve)"
    ccr_value: "CCR¹ = 1 (reference unit — to be confirmed non-circularly
                by SIM-004-v2)"

  complete_formulation: >
    α⁻¹ = 1 / (Wr_eq · f_closure)
         = 1 / (3/2 · f_closure)
    where f_closure is the only quantity requiring numerical computation
    (the GP solve over S²). Wr_eq = 3/2 is topologically fixed.
    The full chain from D₋₁ to α⁻¹:
      recurrence v_{k+2} = v_{k+1} + v_k   (from §1 geometric origin)
      → eigenvalues φ (growth), φ⁻¹ (decay)   (§2)
      → CCR⁰ = φ⁻¹   (transient retention)
      → D₀ fixed basis (three directions, co-natural with 3D)
      → bivector planes {B₁, B₂, B₃} via outer products
      → 720° Möbius vortex (D₁ fixed point under Φ₁)   [topology first appears]
      → Wr_eq = 3/2 (topological invariant of D₁)
      → f_closure (geometric yield of Φ₁ over S²)
      → α⁻¹ = 1/(Wr_eq · f_closure)

