open_questions:
id: "vsa-algebra-explicit"
question: >
What is the explicit VSA algebra of the phase configuration space?
The framework uses Cl(3,0) geometric algebra, but VSA typically uses
high-dimensional vector spaces with specific binding operations
(circular convolution, tensor product, etc.). Are these equivalent?
Can the Cl(3,0) geometric product be interpreted as a VSA binding
operation?
status: "OPEN — requires formal mapping between Cl(3,0) and VSA algebras"

id: "capacity-of-phase-space"
question: >
How many distinct committed structures can the phase configuration
space support? VSA theory gives exponential capacity in high-
dimensional spaces. What is the capacity of Cl(3,0)? Is it finite
or infinite? How does this relate to the number of possible particle
species, atomic configurations, etc.?
status: "OPEN — requires capacity analysis of Cl(3,0) as VSA"

id: "noise-tolerance"
question: >
VSA distributed representations are robust to noise. Is the process
field robust to noise? How does the framework handle substrate
fluctuations (Tik background, quantum fluctuations)? Is this the
same mechanism as VSA noise tolerance?
status: "OPEN — requires analysis of noise tolerance in the process field"

id: "learning-in-vsa"
question: >
Neural networks learn by adjusting the binding operations (synaptic
weights). Does the process field "learn"? Is the R1-R5 cascade a
form of learning? Is the depth hierarchy a form of hierarchical
feature learning?
status: "OPEN — requires mapping between VSA learning and R1-R5 dynamics"

