# ─────────────────────────────────────────────
# §4  CLUSTER ACCUMULATION — THE DEPTH HIERARCHY
# ─────────────────────────────────────────────

cluster_accumulation:
  statement: >
    Particle formation is cluster accumulation in the binding network.
    Each depth level is a new closed cluster formed by adding reference
    bindings to the previous level's structure. No new ontological
    primitives are introduced at any step — only new binding connections.

  rotor_as_first_cluster:
    statement: >
      The Möbius rotor at D₁ is the first closed cluster: the minimal
      configuration of reference bindings that forms a stable loop.
      Three configuration points {v₁, v₂, v₃} with two binding edges
      {B₁₂ = v₁∧v₂, B₂₃ = v₂∧v₃} sharing the boundary node v₂.
      The 720° closure is the condition for loop stability — the cluster
      must return to its own reference state after two traversals.
    binding_count: 2
    grade: "Grade-2 (bivector)"
    stable_configurations: ["Electron (reference-obtaining)", "Photon (reference-free)"]
    distinguishing_feature: >
      Electron: co-oriented rotor pair — internal chirality reference
      established. Unique stable attractor in the variational problem.
      Photon: counter-oriented or unoriented — no internal reference.
      No unique attractor, no rest frame, no mass.

  proton_as_extended_cluster:
    statement: >
      The proton at D₂ extends the D₁ cluster by adding a third binding
      edge, closing all three bivector planes {B₁₂, B₁₃, B₂₃} into a
      joint pseudoscalar lock I = e₁e₂e₃. Three configuration points
      are now bound by three simultaneous hyperedges — a complete
      three-node hypergraph.
    binding_count: 3
    grade: "Grade-3 (pseudoscalar)"
    closure_condition: "F[Q] = Σᵢ<ⱼ ‖BᵢBⱼ + BⱼBᵢ‖² → 0"
    note: >
      The closure condition requires all three bivector planes to be
      mutually orthogonal — this is the algebraic constraint that
      has no HGR equivalent. It is what makes the proton stable
      and why three quarks (not two or four) are required.

  meson_as_incomplete_cluster:
    statement: >
      A meson (qq̄) is a two-node cluster with two binding edges that
      cannot close into a stable pseudoscalar — it lacks the third
      binding edge for full valence saturation. The system oscillates
      between configurations trying to achieve closure, which drives
      rapid decay.
    binding_count: 2
    grade: "Grade-2 attempt at grade-3 closure"
    stability: >
      Unstable — topological binding insufficiency, not force-based
      confinement. The third binding edge is absent, not suppressed.
    decay_mechanism: >
      The two-edge cluster cannot maintain stable reference — it
      dissociates into configurations that individually satisfy their
      own closure conditions (pions, photons, leptons).

  nuclear_clusters:
    statement: >
      Nuclei are multi-cluster binding at D₃: several D₂ pseudoscalar
      clusters connected via S⁷ Hopf structure. The magic numbers
      (2, 8, 20, 28, 50, 82, 126) are the stable multi-cluster
      configurations under Steiner enumeration on S⁷ — the binding
      network's own stability criterion.
    binding_count: "Multiple D₂ clusters"
    open: "Explicit Steiner enumeration on S⁷ — SIM-006-v1"

---

# ─────────────────────────────────────────────
# §5  CONSEQUENCES FOR SIMULATION
# ─────────────────────────────────────────────

simulation_consequences:
  primary_variable: >
    The primary variable in the binding network is binding depth d —
    how many reference connections are active simultaneously in a
    cluster. This is discrete and dimensionless. The radial coordinate r
    used in SIM-004's GP solver is a secondary projection: r ≈ d · ξ
    where ξ is the healing length (the scale at which one binding depth
    corresponds to one unit of effective-space length).

  f_eq_restatement: >
    f_eq = ξ / R_core in the metric formulation.
    In the binding network formulation:
      f_eq = (active bindings in committed cluster) /
             (maximum bindings available at this depth)
           = d_committed / d_max
    For the electron at D₁: d_committed = 2 (two bivector edges),
    d_max = 3 (three possible bivector planes in Cl(3,0)).
    f_eq = 2/3 — dimensionless, geometry-free, directly from the
    Cl(3,0) structure.

  k_kappa_resolution: >
    The heuristic k↔κ coupling in SIM-004-v3 fails because it attempts
    to connect two metric quantities across a categorical boundary.
    In the binding network formulation, k (elliptic modulus of the
    Dzhanibekov trajectory) is a property of the operative aspect
    (binding dynamics), and κ (saturation sharpness) is a property
    of the envelope aspect (maximum binding valence). Their connection
    is through the binding valence ratio d_committed/d_max — not
    through a metric heuristic.

  gp_solver_reframing: >
    The GP equation is not a differential equation in metric space r.
    It is a fixed-point condition on the binding valence distribution
    across the cluster. The "radial profile" ψ(r) is the projection of
    this distribution onto a continuous coordinate. For the purposes
    of computing f_eq, the binding valence ratio is sufficient and
    the full GP solve may be replaceable by a combinatorial fixed-point
    computation on the Cl(3,0) binding structure.

  open_for_sim004_v4: >
    SIM-004-v4 should reformulate the envelope aspect as a binding
    valence fixed-point problem rather than a GP radial ODE.
    The operative aspect (Jacobi-elliptic trajectory, f_geom) remains
    valid — it already operates in the bivector parameter space.
    The connection between the two aspects is through the binding
    valence ratio, not through a metric coupling.

