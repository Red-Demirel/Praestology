# ─────────────────────────────────────────────
# §3  COMPARISON TO HYPERGRAPH ARCHITECTURE
# ─────────────────────────────────────────────

hypergraph_comparison:
  overview: >
    Wolfram's Hypergraph Rewriting (HGR) and the vector-multispace share
    a relational, non-metric foundation. Both treat structure as emerging
    from discrete connection rules rather than from a pre-existing
    geometric background. The comparison is productive but the
    differences are significant.

  structural_parallels:
    nodes: >
      HGR: abstract nodes without intrinsic properties.
      Multispace: configuration points in C_Φ — grade-0 scalar activations.
      Correspondence: both are contentless until connected.

    hyperedges: >
      HGR: hyperedges connect arbitrary numbers of nodes simultaneously.
      Multispace: outer products (wedge products) connect grade-1 vectors
      into bivectors and trivectors simultaneously.
      Correspondence: both allow multi-node binding in a single operation.

    rewriting_rules: >
      HGR: local rewriting rules transform hypergraph topology.
      Multispace: R1–R5 viability rules transform configuration topology
      via the viability operator R(ψ).
      Correspondence: both generate structure through iterative rule application.

    emergent_geometry: >
      HGR: spatial geometry emerges from the statistical structure of
      large hypergraphs.
      Multispace: 3D effective space emerges as the derivative-level
      projection of the Cl(3,0) binding network (derivative-reality-clarification).
      Correspondence: neither takes geometry as primitive.

    causal_structure: >
      HGR: causal graphs track which rewriting events depend on which.
      Multispace: the depth cascade D₋₁ → D₃ tracks which binding events
      depend on prior bindings (dependency_map in each domain file).
      Correspondence: both have explicit causal/dependency structure.

  key_differences:
    grade_structure: >
      HGR has no intrinsic grade structure — all hyperedges are equivalent
      in type. The multispace has grade as a fundamental distinction:
      grade-1, grade-2, grade-3 bindings are categorially different,
      not just quantitatively different. This grade structure is what
      produces distinct particle types (electron vs proton vs photon)
      rather than an undifferentiated network.

    chirality: >
      HGR does not natively encode chirality — left and right are
      equivalent in an abstract hypergraph. The multispace has native
      chirality from the oriented outer product: B = v₁ ∧ v₂ ≠ v₂ ∧ v₁.
      This is why the electron has definite handedness and why parity
      violation is structural rather than added by hand.

    algebraic_closure: >
      HGR rewriting rules are discrete and combinatorial. The multispace
      has a full algebraic structure (Clifford algebra) that constrains
      which binding configurations are self-consistent. The closure
      condition ⟨G⟩₂|_closure = 0 is an algebraic constraint with no
      direct HGR equivalent.

    saturation: >
      HGR has no intrinsic saturation mechanism — nodes can accumulate
      arbitrary numbers of hyperedges. The multispace has intrinsic
      saturation from Λ·ln(1 + κ|ψ|²) — the maximum binding valence
      is set by the equilibrium cluster shape. This is what prevents
      singularities and produces finite particle masses.

    continuous_limit: >
      HGR recovers continuous physics only in large-n statistical limits.
      The multispace has both discrete (D₋₁ → D₃ cluster formation) and
      continuous (master equation, GP dynamics) descriptions that are
      complementary aspects of the same process — not a limit.

  synthesis: >
    The vector-multispace can be read as a structured hypergraph:
    nodes are configuration points, hyperedges are grade-specific
    outer products, rewriting rules are R1–R5 viability selection,
    and the grade structure provides the type system that plain HGR
    lacks. The multispace is a typed, chirality-aware, algebraically
    closed hypergraph with intrinsic saturation.

    Conversely, HGR provides a useful intuition for the discrete
    aspects of the depth cascade and for visualising cluster
    accumulation — particularly for the D₂ → D₃ transition where
    the Steiner enumeration on S⁷ has a natural hypergraph reading.

  vsa_comparison_and_guardrail:
    statement: >
      The phase configuration space C_Φ also shares structural
      features with Vector Symbolic Architectures (VSA) — high-
      dimensional binding systems used in cognitive science and
      neural network research. The VSA operations (binding, unbinding,
      similarity, hierarchical composition) map onto R4, R_diss,
      resonance/dissonance, and the depth hierarchy respectively.
      This is a useful comparative lens.
    guardrail: >
      The framework must not be interpreted as claiming "reality is
      a hyperdimensional vector database." The mechanism is
      fundamentally different:
        VSA achieves capacity via statistical near-orthogonality in
        a fixed high-dimensional space — a computational trick within
        a pre-existing container.
        C_Φ achieves capacity via grade-structured topological closure
        emerging from dimensionally indifferent R1 potential — there
        is no pre-existing container; boundaries are created by the
        R4/R5 commitment process itself.
      VSA is a descriptive mirror of the rule-set, not the substrate.
      The comparison is heuristic; this file is the canonical definition.
    canonical_note: >
      phase-configuration-space-as-vsa.yaml is formally deprecated in
      favour of this file. The VSA framing belongs as a comparative
      reading, not a co-equal definition. See deprecation notice in
      that file.
    vsa_references:
      - "Plate, T.A. (2003). Holographic Reduced Representations. IEEE Trans. Neural Networks."
      - "Gayler, R.W. (2003). Vector Symbolic Architectures: A New Framework for Connectionist Models of Cognition."
      - "Schlegel, K. et al. (2021). A Comparison of Vector Symbolic Architectures."

