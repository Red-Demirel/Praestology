# /core/vector-multispace-character.yaml
name: "Vector-Multispace: Relational Binding Architecture"
version: "0.2"
status: "CANONICAL DEFINITION — the authoritative foundational definition
         of the phase configuration space C_Φ = Cl(3,0) as a relational
         binding network. Supersedes phase-configuration-space-as-vsa.yaml
         (formally deprecated). Establishes non-geometric character, resolves
         metric projection error in SIM-004, positions relative to Hypergraph
         and VSA architectures."
domain: "Core"
updated: "2026-10-13"

description: >
  The phase configuration space C_Φ = Cl(3,0) is not a geometric container
  in which particles move. It is a relational binding network — a structure
  of reference connections whose topology determines what configurations
  are viable and at what commitment depth. This file establishes that
  character explicitly, draws the analogy and distinction to Hypergraph
  architectures, and identifies the consequences for simulation
  (specifically SIM-004) and for the depth cascade.

dependency_map:
  requires:
    - "core/d-minus-one-pre-vector-level.yaml"
    - "core/process-physics/reference-and-expression.yaml"
    - "core/closure-configuration-ratio.yaml"
    - "core/process-physics/parameter-cascade.yaml"
  provides_to:
    - target: "issues/foundational/test-spec-electron-ccr-gp-equilibrium-v2.yaml"
      via: "Replaces metric r with binding-depth as the primary variable in GP solve"
    - target: "core/process-physics/operator-expansion-and-qm-equivalence.yaml"
      via: "Cluster accumulation as the correct reading of operator expansion sequence"

---

# ─────────────────────────────────────────────
# §1  WHAT THE VECTOR-MULTISPACE IS NOT
# ─────────────────────────────────────────────

what_it_is_not:
  not_a_geometric_space: >
    C_Φ = Cl(3,0) is not a metric space. It has no distances, no
    coordinates, no background geometry. Projecting a radial coordinate r
    onto it — as in the GP radial solver — is a category error: r is a
    derivative-level construct, a projection of binding depth onto a
    continuous coordinate, not a fundamental variable of the multispace.

  not_a_container: >
    The multispace does not contain particles the way a box contains gas.
    Configurations do not sit at positions within C_Φ. They ARE
    configurations of C_Φ — specific activation patterns of its
    grade structure.

  not_static: >
    C_Φ does not pre-exist as a fixed arena. It is constituted by the
    reference bindings that form within it. The D₋₁ → D₀ transition is
    not "vectors appearing in a space" — it is the first reference
    bindings establishing the structure that will be called space.

  correction_for_simulation: >
    SIM-004's use of radial coordinate r as the primary variable mixes
    the vector-multispace (operative aspect) with effective space
    (envelope aspect). This produces the divergence observed in v3:
    the k↔κ heuristic attempts to bridge two categorially distinct
    descriptions. The correct approach treats binding depth as the
    primary variable and derives r as a secondary projection where needed.

---

# ─────────────────────────────────────────────
# §2  WHAT THE VECTOR-MULTISPACE IS
# ─────────────────────────────────────────────

what_it_is:
  relational_binding_network: >
    C_Φ is a network of potential reference bindings. A binding is the
    establishment of a reference connection between two or more
    configuration points — expressed as an outer product (wedge product)
    in Cl(3,0). The grade of a multivector element encodes how many
    reference bindings it involves:

      Grade 0 (scalar):    No binding — uncommitted potential.
                           Pre-reference, isotropic.
      Grade 1 (vector):    First binding — a single directed reference.
                           Establishes "this direction" without yet
                           defining a plane or volume.
      Grade 2 (bivector):  Two-binding cluster — a reference plane.
                           Defines orientation, rotation, chirality.
      Grade 3 (pseudoscalar): Three-binding cluster — a reference volume.
                           Full spatial commitment, locked orientation.

  grade_as_binding_depth: >
    Grade is binding depth, not spatial dimension. A grade-2 bivector
    is not "two-dimensional" — it has two reference bindings active
    simultaneously, defining a relational plane in the binding network.
    This is why the D₀ → D₁ transition (vector → bivector) is the
    appearance of the first closed cluster, not movement in space.

  cluster_accumulation: >
    Configurations accumulate by adding reference bindings — each new
    binding adds a grade component and deepens the cluster. The depth
    cascade D₋₁ → D₀ → D₁ → D₂ → D₃ is the sequence of cluster
    formations as bindings accumulate:

      D₋₁:  No bindings — isotropic scalar potential.
      D₀:   First bindings — grade-1 vector basis established.
             Three independent reference directions available.
      D₁:   First closed cluster — grade-2 bivector (electron/photon).
             Two bindings form a closed loop: the 720° Möbius rotor.
             Chirality, spin, first mass appear here.
      D₂:   Extended cluster — grade-3 pseudoscalar (proton/neutron).
             Three bindings close into a volume lock.
             Strong coupling, colour neutrality here.
      D₃+:  Multi-cluster binding — several D₂ clusters connected
             via S⁷ Hopf structure (nuclei, magic numbers).

  binding_valence: >
    Each configuration point has a binding valence — how many reference
    connections it participates in simultaneously. The saturation term
    Λ·ln(1 + κ|ψ|²) in the master equation encodes the maximum binding
    valence: the substrate cannot support more than a finite number of
    simultaneous reference connections at any configuration point.
    This is not a free parameter — it is a shape-functional of the
    equilibrium cluster (saturation-parameters-as-shape-functionals.yaml).

