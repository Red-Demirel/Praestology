  depth_0_to_1:
    transition: "Vector Basis → 1-Plane Closures (Electron / Photon)"
    primary_operation: "Cross-basis pairing eᵢ ∧ eⱼ under B² = -1 boundary condition"
    quantities:
      equilibrium_writhe: { symbol: "Wr_eq", kind: "Ratio", value: "3/2", status: "DERIVED" }
      closure_yield: { symbol: "f_closure", kind: "Ratio", status: "OPEN (SIM-004-v2)" }
      fine_structure_inv: { symbol: "α⁻¹", kind: "Ratio", formula: "1 / (Wr_eq · f_closure)", status: "DERIVED-CANDIDATE" }
      trapped_rotational_inertia: { symbol: "I_rot", kind: "Dimensional", formula: "2m(ħ/mc)²", status: "STRUCTURAL" }
      phase_rate: { symbol: "ω_Φ", kind: "Dimensional", role: "Closure-indexed (type-dependent)", status: "CANDIDATE" }
      phase_energy_capacity: { symbol: "E_Φ", kind: "Dimensional", formula: "½ I_rot ω_Φ² = mc²", status: "DEFINITIONAL" }
      coupling_strength: { symbol: "χ_Φ", kind: "Dimensional", units: "J·s", formula: "I_rot · ω_Φ", status: "DEFINITIONAL" }
      equilibrium_state:
        ratio_symbol: "CCR⁽¹⁾"
        condition: "CCR⁽¹⁾ = α (band cost) / CCR_crit = 1 (saturation)"
        observables_locked: ["Spin ħ/2", "Electron rest mass m_e", "Gravitational response χ_Φ"]

  depth_1_to_2:
