        condition: "F⁽²⁾[Q] = Σᵢ<ⱼ ‖BᵢBⱼ + BⱼBᵢ‖² → 0"
        observables_locked: ["Color neutrality", "Nucleon mass gap", "Intrinsic angular momentum"]

  depth_2_to_3:
    transition: "S⁷ Embedding → Heavy Nuclei"
    primary_operation: "Absorbing F = 8/3 residual via S⁷ Hopf octonionic linking"
    quantities:
      environmental_threshold_shift: { symbol: "V̂_c", kind: "Dimensional (reduced)", formula: "V_c · V_ref / E_scale(2)", status: "STRUCTURAL" }
      magic_numbers: { symbol: "N_magic", kind: "Count", role: "Steiner enumeration on S⁷", status: "OPEN (SIM-006-v1)" }
      equilibrium_state:
        ratio_symbol: "CCR⁽³⁾"
        condition: "Steiner enumeration gap minimization in S⁷"
        observables_locked: ["Nuclear shell stability", "Total spin J", "Binding energy"]

  depth_3_to_4:
    status: "CONJECTURAL"
    transition: "Atomic Shells (Steiner enumeration at depth 4)"
    equilibrium_state:
