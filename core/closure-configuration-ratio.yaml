boundary_conditions: |
  The CCR defines the viable band for committed topology. 
  The framework explicitly adopts the Saturation Reading, superseding 
  the prior Uncommitted Reading.
  
  Saturation Reading (ADOPTED v2.2):
  0 < CCR < 1   →  Under-committed: partial occupancy of viable phase space. 
                   Stable, realized topology maintained against full phase space.
  CCR = 1       →  SATURATION / CLOSURE THRESHOLD: full occupancy of the 
                   viable phase space. The topology is maximally locked. 
                   (e.g., the electron's equilibrium CCR¹ = 1).
  CCR > 1       →  OVER-COMMITTED: the configuration's writhe-weighted phase-
                   space volume exceeds the locally available embedding capacity.
                   This is not a stable topological lock; it is an excess state.

  Uncommitted Reading (SUPERSEDED):
  The prior v2.0 statement "CCR = 1 → topology occupies full phase space = 
  uncommitted field" is retired. It incorrectly conflated the saturation 
  limit with the uncommitted limit, preventing the evaluation of over-
  commitment dynamics.

