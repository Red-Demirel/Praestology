ccr_family_reading_of_alpha:
  status: "STRUCTURAL HYPOTHESIS — preferred reading over the simpler
           environmental-only account; the aggregate is a coupling
           between the electron's own closure (CCR¹) and the 3rd
           body's closure contributions (CCR², CCR³, ...). The
           environmental Π_eff distortion is a separate, noise-level
           effect on the measurement. Not yet quantified; stated here
           as the framework's preferred interpretation."

  statement: >
    The measured value of α is not the electron's isolated CCR¹. It is
    the committed aggregate of the electron's own closure plus the
    coupling contributions of any 3rd bodies involved in the measurement.
    The isolated CCR¹ is the leading term. The 3rd-body contributions
    are higher-depth coupling terms that enter through the electron's
    interaction with the measurement configuration. The environmental
    Π_eff distortion is a separate effect — it acts as noise on the
    boundary condition of the committed aggregate, not as a term in
    the aggregate itself.

  structure: |
    α_measured = CCR¹ + Σ (3rd-body coupling contributions)
                 + environmental distortion (noise level)

    Leading term:  CCR¹ — the electron's isolated closure ratio
                   (4π³ + π² + π in the void limit)

    3rd-body terms: coupling contributions from the measurement
                    configuration — the proton's CCR², the
                    apparatus's higher-depth closures, and the
                    mutual closure structure between the electron
                    and the 3rd body

    Environmental:  Π_eff compression at the measurement site —
                    acts on the boundary condition (V_c) that the
                    committed aggregate must satisfy; shifts the
                    value by ~2.2 ppm

  why_not_reading_1: >
    Reading 1 treats α_measured as CCR¹ evaluated in a different
    environment. This is cleaner but overlooks the structural fact
    that the electron is never measured in isolation — the 3rd body
    is always part of the configuration being committed. Reading 2
    accounts for the 3rd body as a structural element rather than
    attributing the entire deviation to environmental conditions.

  why_this_is_consistent_with_standard_physics: >
    Standard physics treats α as a universal constant because the
    3rd-body and environmental contributions are extremely small in
    ordinary conditions. The electron's leading CCR¹ dominates the
    aggregate, and the higher-depth couplings are suppressed by
    powers of α (each depth transition contributes at the next order
    in coupling strength). This is why physics has been able to
    treat α as a constant to high precision without noticing the
    aggregate structure: the corrections are below the resolution
    of standard measurements.

  testable_consequences:
    - >
      Precision measurements of α in different 3rd-body configurations
      (electron-proton vs. electron-electron vs. electron-muon) could
      reveal differences in the aggregate beyond what the environmental
      Π_eff shift predicts. The 3rd body's contribution is proportional
      to its own CCR value (CCR² for a proton), which is much smaller
      than CCR¹ but nonzero.
    - >
      The Lamb shift, g−2, and similar precision QED effects might
      carry an aggregate-level residual not accounted for by standard
      QED. Whether current precision reaches the aggregate contribution
      is an open question.
    - >
      If the 3rd-body contribution is at the level of α² (≈ 5×10⁻⁵),
      it would be below current CODATA precision by ~20x. If it is at
      the level of α (≈ 7×10⁻³), it would already have been noticed.
      The aggregate structure predicts the correction is at a specific
      order in α determined by the depth of the 3rd body's coupling.

  epistemic_notes:
    - >
      This reading is stated as the framework's preferred interpretation,
      not as a derived result. It is consistent with the framework's
      structural commitments but has not been computationally validated.
    - >
      It does not render standard physics false. It renders standard
      physics a derivative-level approximation of a process-level
      aggregate — the same status the framework assigns to other
      "constants" (G, ħ, m_p/m_e).
    - >
      The reading's strength is that it explains why α appears constant
      in ordinary measurements while allowing for principled deviations
      in specific configurations.

