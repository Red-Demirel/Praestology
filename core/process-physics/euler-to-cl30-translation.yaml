# ─────────────────────────────────────────────
# §6  CORRECTIONS REQUIRED FOR SIM-004-v3
# ─────────────────────────────────────────────

sim_004_v3_corrections:

  correction_1_jacobi_elliptic_level:
    issue: >
      The v3 file parameterizes the trajectory with sn/cn/dn Jacobi
      elliptic solutions, which are derivative-level.
    correction: >
      Either (a) compute the trajectory at the process level from §3
      and use the projected component ratios only for verification, or
      (b) restate RCR as derivative-level and acknowledge that the
      Jacobi solutions are the correct parameterization.
    priority: "Prerequisite — the choice determines what RCR means"

  correction_2_rcr_ccr_relationship:
    issue: >
      The v3 file transitions from CCR to RCR without stating the
      level relationship between them.
    correction: >
      State whether RCR is intended to replace CCR numerically (implying
      they are equal), to reformulate CCR at the process level (implying
      the current CCR was derivative-level all along), or to introduce
      a new quantity that enters the α formula alongside CCR.
    priority: "Prerequisite — determines the form of the α formula"

  correction_3_omega_flip_term:
    issue: >
      The GP radial solver in v3 includes a term −Ω_flip² ψ in the
      effective potential, where Ω_flip is the commutator intensity.
      If Ω_flip is derivative-level (computed from Jacobi elliptic
      solutions), then the term is derivative-level; if process-level,
      it must be computed from §3.
    correction: >
      State the level of Ω_flip and its relationship to the process-
      level bivector dynamics.
    priority: "Dependent on correction 1"

  correction_4_boundary_conditions:
    issue: >
      The v3 GP solver uses the classical boundary conditions
      ψ(0) = 0, ψ(r→∞) = 1. These are derivative-level conditions
      (r is a Euclidean radial coordinate).
    correction: >
      If the GP solve is at the process level, the radial coordinate
      is the bivector norm deviation, and the boundary conditions
      should reflect the process-level geometry. Alternatively, if
      the GP solve is derivative-level (as in SIM-004-v2), the
      boundary conditions are correct as stated — but then the
      trajectory is derivative-level too.
    priority: "Consistency check"

  recommendation: >
    Pause SIM-004-v3 before running. Resolve corrections 1 and 2
    first. They determine what the simulation is computing. The
    remaining corrections follow from the answers.

