# ─────────────────────────────────────────────
# §7  OPEN DERIVATIONS
# ─────────────────────────────────────────────

open_derivations:

  priority_1:
    - id: "process-level-bivector-dynamics"
      description: >
        Derive the process-level equation of motion for the bivector Ω
        in Cl(3,0) with the coupling functional C[·]. The equation
        dL/dτ + Ω × L = 0 with L = C[Ω] is the starting point; the
        content is in the specific form of C[·].
      depends_on: ["mixed-order-perturbation-scaffold.yaml",
                   "mass-as-plane-independence.yaml"]
      priority: 1

    - id: "linearity-of-coupling-functional"
      description: >
        Determine whether C[·] is linear in bivector activation. If
        linear, the classical Jacobi elliptic solutions apply and RCR
        can be computed from them. If nonlinear, the trajectory must
        be computed numerically from the process-level equation.
      depends_on: ["process-level-bivector-dynamics"]
      priority: 1

    - id: "level-conversion-factor"
      description: >
        Derive the conversion factor between RCR (process-level) and
        CCR (as currently written). Show whether it is trivially 1,
        approximately 1 at the electron equilibrium, or non-trivial.
      depends_on: ["process-level-bivector-dynamics",
                   "ccr-electron-explicit"]
      priority: 1

  priority_2:
    - id: "projection-from-process-to-euclidean"
      description: >
        Explicitly carry out the projection from C_Φ to Euclidean space.
        Show that the process-level bivector equation reduces to the
        classical Euler equations in the uniform-transition limit.
        Quantify the corrections from non-uniform transition rates.
      depends_on: ["process-level-bivector-dynamics"]
      priority: 2

    - id: "rcr-from-process-trajectory"
      description: >
        Compute RCR directly from the process-level bivector trajectory
        (from §3). Compare with RCR computed from the derivative-level
        Jacobi elliptic solutions. The difference quantifies the level
        effect.
      depends_on: ["process-level-bivector-dynamics",
                   "linearity-of-coupling-functional"]
      priority: 2

  priority_3:
    - id: "sim-004-v3-revision"
      description: >
        Revise SIM-004-v3 with the level distinction explicit. Either
        commit to process-level computation or commit to derivative-
        level with the level conversion stated.
      depends_on: ["level-conversion-factor",
                   "rcr-from-process-trajectory"]
      priority: 3

