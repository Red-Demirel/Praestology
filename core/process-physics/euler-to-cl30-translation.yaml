# ─────────────────────────────────────────────
# §4  FRAMEWORK-SPECIFIC REPLACEMENTS
# ─────────────────────────────────────────────

framework_replacements:

  inertia_tensor_replacement:
    classical: "I: ⋀²V → ⋀²V — symmetric linear map, fixed for a rigid body"
    framework: "I_CCR: bivector plane ↦ CCR cost of activating that plane"
    what_changes:
      - "The classical inertia tensor is fixed; the CCR cost functional may vary with configuration."
      - "The classical map is linear by construction; whether I_CCR is linear in bivector activation is open."
      - "The classical eigenvalues are the principal moments; the framework's eigenvalues (if linear) would be the principal CCR costs."
    what_stays: >
      If I_CCR is linear (or if its linearization around the equilibrium
      is well-defined), the classical analysis applies: eigenvectors give
      the principal planes, eigenvalues give the CCR costs, and the
      intermediate-axis theorem follows from the eigenvalue ordering.
    status: "OPEN — linearity of I_CCR not yet established"

  time_replacement:
    classical: "t — the independent time parameter"
    framework: "τ — the configuration-transition index"
    what_changes:
      - "Classical time is fundamental; framework τ is derivative (ga-dynamic-theory.yaml)."
      - "The rate d/dτ is a rate per transition, not per unit of coordinate time."
      - "Frequency, period, and rate are all derivative-level readings of the underlying transition index."
    what_stays: >
      The equation of motion dL/dτ + Ω × L = 0 has the same form.
      The interpretation of τ changes; the algebra does not.

  frame_replacement:
    classical: "Principal-axis frame ê₁, ê₂, ê₃ — pre-existing, chosen by the analyst"
    framework: "Bivector eigenstructure B₁, B₂, B₃ of I_CCR — emergent from the inertia map"
    what_changes:
      - "The classical frame is chosen; the framework's eigenstructure is intrinsic to the map."
      - "The 'intermediate axis' is not chosen by the analyst; it is the middle eigenvalue of I_CCR."
      - "The three bivector planes are structurally distinguished (B₁ = e₂e₃, etc.) but the analysis does not depend on the labels — only on the eigenvalue ordering."

  angular_velocity_replacement:
    classical: "ωᵢ — components of angular velocity vector"
    framework: "Ωᵢ — bivector phase-rate components of the rotor"
    note: >
      The bivector phase rate is the rate at which the committed
      configuration traverses its Möbius path. It is measured in
      transitions per cycle rather than radians per unit time. In the
      void limit, the two coincide; in commitment-dense environments,
      the framework's rate differs from the classical rate by the
      Π_eff factor.

