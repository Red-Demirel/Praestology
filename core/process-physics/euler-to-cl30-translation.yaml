# /core/process-physics/euler-to-cl30-translation.yaml
name: "Euler → Cl(3,0): Rigid-Body Dynamics with Explicit Level Distinction"
version: "0.2"  # with additions: depth-0 RCR, reference-state connection
status: "TECHNICAL TRANSLATION — v0.2 states the process/derivative level
         distinction explicitly and identifies the level-mixing in the
         current CCR formula. The classical Euler equations are the
         derivative-level projection of the process-level Cl(3,0)
         dynamics. The Jacobi elliptic solutions live at the derivative
         level. RCR is process-level; CCR as currently written mixes
         levels and needs restatement."
domain: "Core / Process-Physics"

description: >
  The classical Euler equations describe rigid-body rotation in three-
  dimensional Euclidean space with a linear inertia tensor. This is a
  derivative-level description: Euclidean space is the integral of
  process-level transitions, and the inertia tensor is the projected
  form of the process-level coupling functional. The translation to
  Cl(3,0) must respect this level distinction — the process-level
  dynamics lives in the phase configuration space C_Φ; the Euler
  equations are what remains after projection to the integrated space.

  v0.2 corrects a level-mixing that had crept into the framework's
  handling of the CCR formula. The CCR as written combines Wr (a
  derivative-level invariant, defined in projected Euclidean space)
  with Ω_rotor and Ω_embed (process-level volumes in C_Φ). The mixing
  has worked numerically but doesn't state which level the CCR belongs
  to. This file states the levels, gives the process-level dynamics
  directly in Cl(3,0), and identifies the projection that recovers
  the classical Euler form.

dependency_map:
  requires:
    - "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
    - "core/process-physics/ga-dynamic-theory.yaml"
    - "core/process-physics/geometric-algebra-bridge.yaml"
    - "core/process-physics/mass-as-plane-independence.yaml"
    - "core/process-physics/bivector-partial-parameters.yaml"
    - "core/process-physics/mixed-order-perturbation-scaffold.yaml"
    - "core/process-physics/gravitational-adjustment-in-vector-multispace.yaml"
  provides_to:
    - target: "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
      via: "The level-distinguished translation that the perturbation scaffold presupposes"
    - target: "core/closure-configuration-ratio.yaml"
      via: "Restatement of CCR with explicit level identification"

---

# ─────────────────────────────────────────────
# §1  THE LEVEL DISTINCTION
# ─────────────────────────────────────────────

level_distinction:

  statement: >
    Two levels are distinguished throughout the framework. Confusing
    them produces formulas that work numerically while being
    structurally under-specified. The levels must be stated explicitly
    whenever a quantity is defined.

  process_level:
    domain: "Phase configuration space C_Φ = Cl(3,0)"
    primitive_objects:
      - "The multivector field ψ (grades 0 through 3)"
      - "The local process rate Π_eff"
      - "The bivector activation B in the bivector parameter space"
      - "The coupling functional C[·] between gradient-axes"
    time_parameter: "τ — the configuration-transition index (not spatial time)"
    what_lives_here:
      - "The closure condition ⟨G⟩₂ = 0"
      - "The process-level trajectory of the closure"
      - "RCR — the process-level reference configuration ratio"

  derivative_level:
    domain: "Integrated (projected) space — Euclidean 3D + coordinate time"
    primitive_objects:
      - "Position x ∈ ℝ³"
      - "Velocity v, angular velocity ω ∈ ℝ³"
      - "The inertia tensor I as a 3×3 matrix"
    time_parameter: "t — coordinate time (derivative reading of τ)"
    what_lives_here:
      - "The classical Euler equations"
      - "The Jacobi elliptic solutions (sn, cn, dn)"
      - "Writhe Wr of the projected centreline"
      - "Observable quantities: mass, spin, energy in coordinate form"

  integration_statement: >
    Euclidean space is the integral of process-level transitions.
    Coordinate time is the integral of configuration transitions.
    The classical Euler equations are what the process-level Cl(3,0)
    dynamics looks like after this integration.

  consequence_for_formulas: >
    A formula that mixes quantities from both levels without stating
    the conversion is derivative-level in effect but process-level in
    intent. The CCR formula as currently written is such a formula.
    This file restates the dynamics with the levels separated.

---

# ─────────────────────────────────────────────
# §2  CLASSICAL EULER IN EUCLIDEAN SPACE (DERIVATIVE LEVEL)
# ─────────────────────────────────────────────

classical_euler:

  statement: >
    In the body frame (rotating with the rigid body), with principal
    axes ê₁, ê₂, ê₃ and principal moments of inertia I₁, I₂, I₃, the
    classical Euler equations for the components ω₁, ω₂, ω₃ of angular
    velocity are:

      I₁ dω₁/dt = (I₂ − I₃) ω₂ ω₃
      I₂ dω₂/dt = (I₃ − I₁) ω₃ ω₁
      I₃ dω₃/dt = (I₁ − I₂) ω₁ ω₂

  level_identification: >
    DERIVATIVE LEVEL. Each symbol is a projected quantity:
      ω_i     — the components of angular velocity in the integrated frame
      I_i     — the principal moments, projections of the coupling functional
      t       — coordinate time, the integral of configuration transitions
    The equations describe how the projected components evolve. They do
    not describe the process-level bivector dynamics directly.

  what_this_equations_presuppose:
    - "A three-dimensional Euclidean frame with a fixed origin"
    - "An orthonormal triad ê₁, ê₂, ê₃ that rotates with the body"
    - "A linear inertia tensor diag(I₁, I₂, I₃)"
    - "Coordinate time t as the independent variable"
    - "The integration from process-level to Euclidean has already been performed"

  intermediate_axis_theorem:
    statement: >
      If I₁ < I₂ < I₃, rotation about ê₂ (the intermediate axis) is
      unstable. Perturbations grow exponentially and the body tumbles.
    level_identification: >
      DERIVATIVE LEVEL. The theorem is about the projected motion. It
      reflects the process-level structure but is not the same statement.

  jacobi_elliptic_solutions:
    statement: >
      The exact solutions of the Euler equations for rotation near the
      intermediate axis are Jacobi elliptic functions:
        ω₁(t) ∝ sn(u, k) cn(u, k)
        ω₂(t) ∝ dn(u, k)
        ω₃(t) ∝ sn(u, k)
      with elliptic modulus k determined by the ratio of principal
      moments and the initial conditions.
    level_identification: >
      DERIVATIVE LEVEL. These are solutions of the projected equations.
      They describe how the projected components evolve in coordinate
      time. They do NOT describe the process-level bivector dynamics;
      they are what that dynamics looks like after integration and
      projection.

  why_this_matters_for_sim_004_v3: >
    SIM-004-v3 parameterizes the trajectory with sn/cn/dn directly and
    computes RCR from that trajectory. If RCR is process-level (as
    stated in the v3 file), then it cannot be computed from the
    derivative-level Jacobi elliptic solutions without an explicit
    conversion. Either RCR is actually derivative-level (and should be
    renamed), or the trajectory must be computed at the process level
    (from the Cl(3,0) equation, not from the classical solutions).

---

# ─────────────────────────────────────────────
# §3  PROCESS-LEVEL DYNAMICS IN Cl(3,0)
# ─────────────────────────────────────────────

process_level_dynamics:

  statement: >
    The process-level dynamics of a rotating closure is expressed
    directly in Cl(3,0) without projecting to Euclidean space. The
    angular velocity is a bivector; the coupling is a functional;
    the equation of motion is a bivector commutator relation. All
    quantities live in C_Φ.

  angular_velocity_bivector:
    expression: "Ω = Ω₁ e₂₃ + Ω₂ e₃₁ + Ω₃ e₁₂"
    domain: "Λ²(Cl(3,0)) — the bivector subspace"
    parameter_note: >
      Ω is a single geometric object, not three independent scalars.
      Its components (Ω₁, Ω₂, Ω₃) are coordinates in a chosen bivector
      basis, but the object itself is basis-independent.

  coupling_functional:
    expression: "L = C[Ω]"
    domain: "A functional from bivectors to bivectors"
    parameter_note: >
      C[·] is the framework's replacement for the classical inertia
      tensor. Whether C[·] is linear in Ω is an open question
      (euler-to-cl30-translation v0.1, open item). If linear, its
      matrix representation gives the projected inertia tensor. If
      nonlinear, the classical Euler form is recovered only
      approximately, and the exact dynamics is different.

  equation_of_motion:
    body_frame: "dL/dτ + Ω × L = 0"
    commutator_form: "dL/dτ = L × Ω = ½(LΩ − ΩL)"
    time_parameter: "τ — the configuration-transition index"
    level_identification: >
      PROCESS LEVEL. The equation lives in C_Φ. The time parameter τ
      is the transition index, not coordinate time. The angular
      velocity and momentum are bivectors, not vectors.

  bivector_commutator:
    statement: >
      For bivectors in Cl(3,0), the commutator product satisfies the
      same algebraic relations as the vector cross product:
        e₂₃ × e₂₃ = 0
        e₂₃ × e₃₁ = e₁₂     (cyclic)
        e₃₁ × e₁₂ = e₂₃
        e₁₂ × e₂₃ = e₃₁
    consequence: >
      When Ω and L are expanded in the bivector basis, the bivector
      commutator equation produces component equations that have the
      same structure as the classical Euler equations. But this is a
      consequence of the bivector algebra, not of importing the
      classical equations.

  projection_to_euclidean:
    statement: >
      The projection to Euclidean space consists of two steps:
      (a) Fix a bivector basis (e₂₃, e₃₁, e₁₂) — this is the choice of
          Euclidean triad, related by duality
      (b) Replace the transition-index rate d/dτ with the coordinate-
          time rate d/dt — this is the integration from configuration
          transitions to coordinate time
      After these steps, the process-level equation becomes the classical
      Euler equations.

    step_a_basis_choice: >
      The choice of bivector basis is a gauge-like freedom. Different
      choices give different projected component equations, all related
      by the corresponding change of frame. The physical content is
      the bivector equation, not any particular coordinate representation.

    step_b_time_integration: >
      The transition index τ is not coordinate time t. The relationship
      is d/dτ = (dτ/dt)^(-1) d/dt. In uniform-rate conditions (constant
      dτ/dt), the two are proportional and the classical form follows
      directly. In non-uniform conditions (varying transition rate),
      the projected dynamics acquires additional terms. This is where
      the process-level description differs from the classical one.

  what_this_demonstrates: >
    The classical Euler equations are not fundamental. They are what
    the process-level bivector dynamics looks like after (a) choosing
    a bivector basis and (b) integrating configuration transitions to
    coordinate time. The integration step is where the level
    distinction has real content — non-uniform transition rates
    produce corrections that the classical form does not capture.

---

# ─────────────────────────────────────────────
# §4  THE JACOBI ELLIPTIC SOLUTIONS AT THE DERIVATIVE LEVEL
# ─────────────────────────────────────────────

jacobi_elliptic_at_derivative_level:

  statement: >
    The Jacobi elliptic solutions to the Euler equations are derivative-
    level. They solve the projected equations under the assumption of
    linear inertia and uniform transition rate. They are exact at that
    level and only at that level.

  derivation_chain:
    - step: "Start with the classical Euler equations (derivative level)"
    - step: "Apply the standard reduction to the intermediate-axis case"
    - step: "Solve the resulting first-order system"
    - step: "Result: ω_i(t) in terms of Jacobi elliptic functions sn, cn, dn"
    - step: "Modulus k determined by principal moment ratios"

  what_they_capture:
    - "The dwell-and-flip structure of intermediate-axis rotation"
    - "The exponential-instability growth near the flip"
    - "The periodicity of the tumbling"

  what_they_do_not_capture:
    - "The process-level bivector trajectory in C_Φ"
    - "Corrections from non-linear coupling functional C[·]"
    - "Corrections from non-uniform transition rate"
    - "Multi-plane coupling effects (the cross-derivative terms)"

  consequence_for_sim_004_v3: >
    SIM-004-v3's use of sn/cn/dn to parameterize the trajectory is
    derivative-level. If RCR is meant to be process-level, it cannot
    be computed from these solutions without an explicit conversion
    factor. Either the trajectory must be computed at the process
    level (from §3), or RCR must be redefined as derivative-level.

---

# ─────────────────────────────────────────────
# §5  RCR VS CCR — LEVEL IDENTIFICATION
# ─────────────────────────────────────────────

rcr_vs_ccr:

  statement: >
    RCR (Reference Configuration Ratio) and CCR (Closure Configuration
    Ratio) are distinct quantities, and the distinction is precisely
    that they live at different levels. This has not been stated
    explicitly, which is the source of the current trouble.

  rcr_definition:
    expression: "RCR = ⟨‖dB/dτ‖_flip⟩ / ⟨‖dB/dτ‖_dwell⟩"
    level: "PROCESS LEVEL"
    meaning: >
      The ratio of the peak rate of bivector change (during the flip
      phase) to the mean rate during the dwell phase. Both rates are
      computed in the bivector parameter space, using the configuration-
      transition index τ. No projection to Euclidean space is involved.
    connection_to_reference_state_model: >
      In the three-state model (reference-and-expression.yaml §8):
        dwell phase: the configuration is in the enabled state —
          the coupling is active but the reference is not yet established.
          R4 is running; B is exploring but not committed.
        flip phase: the transition between dwell orientations —
          this is the R4→R5 boundary where the commitment cost is highest.
          ‖dB/dτ‖ peaks here because the bivector rate is maximal at the
          moment of potential R5 firing.
        RCR: the ratio of the R5-boundary rate to the R4-dwell rate.
          This is a purely process-level measure of how sharply the
          reference-establishing event (R5) is distinguished from the
          pre-established exploration (R4).
    why_reference_not_closure: >
      The term "Reference Configuration Ratio" is preferred over
      "Closure Configuration Ratio" for exactly the reason the
      reference-and-expression.yaml taxonomy identifies: "closure"
      imports a topological assumption (something closes in Euclidean
      space) while "reference" stays at the process level (a reference
      is established in C_Φ). The flip event is the reference-
      establishing event, not a topological closure in projected space.

  rcr_depth_zero_note:
    statement: >
      The flip/dwell definition of RCR applies from depth-1 (D₀→D₁)
      upward — it requires at least two bivector planes to produce the
      Dzhanibekov flip/dwell structure. At depth-0 (D₋₁→D₀), there is
      no flip/dwell cycle; only the scalar-to-vector transition governed
      by the φ⁻¹ retention eigenvalue. The process-level invariant at
      depth-0 is therefore CCR⁰ = φ⁻¹ (from d-minus-one-pre-vector-level.yaml),
      not a flip/dwell ratio.
    consequence: >
      The RCR definition must be stated depth-specifically:
        depth-0:  RCR⁰ = φ⁻¹   (retention eigenvalue of scalar→vector transition)
        depth-1+: RCR_n = ⟨‖dB/dτ‖_flip⟩ / ⟨‖dB/dτ‖_dwell⟩   (flip/dwell ratio)
      The depth-0 case is already established in d-minus-one-pre-vector-level.yaml.
      The depth-1+ case is the new process-level definition introduced here.
      Whether CCR⁰ = RCR⁰ = φ⁻¹ confirms the level conversion is trivially 1
      at depth-0, or whether it is a coincidence, is an open question.

  ccr_definition_current:
    expression: "CCR = (Wr · Ω_rotor) / Ω_embed"
    level: "MIXED — the diagnosis"
    terms_analysis:
      Wr: >
        DERIVATIVE LEVEL. Writhe is defined for a curve in projected
        Euclidean space. It is a topological invariant of the projected
        centreline.
      Ω_rotor: >
        PROCESS LEVEL. Phase-space volume traversed per closure cycle,
        living in the bivector parameter space.
      Ω_embed: >
        PROCESS LEVEL. Full orientational phase space of the embedding
        field, again in C_Φ.
    diagnosis: >
      The CCR formula combines one derivative-level invariant (Wr) with
      two process-level volumes (Ω_rotor, Ω_embed). It works numerically
      because the electron's equilibrium is a case where the level
      conversion happens to be ≈ 1. But the formula does not state
      which level the CCR belongs to, and at other depths the level
      conversion may not be trivial.

  level_conversion_question:
    question: >
      Is there a level-conversion factor between RCR (process-level) and
      CCR (as currently written)? If yes, what is it? If it is ≈ 1 at
      the electron equilibrium, why?
    potential_answers:
      answer_a_trivial: >
        The conversion is exactly 1 at all depths. Then RCR = CCR
        numerically and the level mixing is benign. This would need
        proof.
      answer_b_electron_specific: >
        The conversion is ≈ 1 at the electron equilibrium specifically,
        because the single-plane configuration minimizes the level
        difference. At higher depths (proton, nucleus), the conversion
        becomes non-trivial. Testable once the depth-2 computation is
        possible.
      answer_c_nontrivial: >
        The conversion is non-trivial even at the electron. Then the
        current CCR formula has been absorbing a hidden factor, and
        the correct formula for α involves RCR with an explicit
        conversion.
    status: "OPEN — cannot be resolved without the process-level dynamics (§3)"

  consequence_for_alpha:
    candidate_restatements:
      - form: "α = derivative-level readout of RCR"
        meaning: >
          α is what RCR looks like after projecting to Euclidean space
          at the equilibrium. The projection factor is the conversion.
      - form: "α = RCR · (level conversion)"
        meaning: >
          Explicit statement of the conversion factor. Recoverable
          from the process-level dynamics once it's derived.
      - form: "α = CCR (unchanged)"
        meaning: >
          The current formula is correct; the level-mixing is
          superficial and the conversion is trivially 1. This is
          what the framework has implicitly assumed.
    which_one_is_correct: "OPEN — depends on the process-level dynamics derivation"

