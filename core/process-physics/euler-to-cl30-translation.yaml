# ─────────────────────────────────────────────
# §5  INTERMEDIATE-AXIS THEOREM IN GA FORM
# ─────────────────────────────────────────────

intermediate_axis_theorem:

  classical_statement: >
    A rigid body rotating about its intermediate principal axis is
    unstable: perturbations grow exponentially, and the body tumbles.

  ga_statement: >
    Consider I: ⋀²V → ⋀²V with principal eigenvalues I₁ < I₂ < I₃.
    Perturb the equilibrium Ω = Ω₂ B₂ by δΩ. The linearized equation of
    motion has a neutral (oscillatory) linear term and a quadratic term
    whose sign determines stability. For I₂ intermediate between I₁ and
    I₃, the quadratic term is destabilizing.

  ga_derivation_sketch:
    linearization: >
      Write Ω = Ω₂ B₂ + δΩ. Substitute into dL/dτ = L × Ω (with L = I(Ω)).
      The linearization of the right-hand side around the equilibrium
      gives a linear map on δΩ whose eigenvalues determine the linear
      stability.
    neutral_linear_term: >
      For the intermediate axis (I₂ between I₁ and I₃), the linear map
      has purely imaginary eigenvalues — the linear term oscillates.
      This is the intermediate-axis theorem's linear part.
    quadratic_term: >
      The second-order term in δΩ is where the instability lives. Its
      coefficient is proportional to (I₁ − I₃) and has a sign that
      reinforces the perturbation rather than opposing it.

  framework_specific_form:
    statement: >
      Under the replacement I → I_CCR, the intermediate-axis theorem
      becomes: a configuration whose equilibrium bivector plane has
      intermediate CCR cost is unstable to merge toward the plane of
      lower cost. The classical instability is the derivative-level
      shadow of the merge tendency (mass-as-plane-independence.yaml
      #structural_principle).

    which_plane_is_intermediate:
      numerical_reading: >
        The middle of the three CCR costs. Faithful to the classical
        problem (which is genuinely about numerical ordering).
      structural_reading: >
        The plane e₂e₃ by grade-position (the middle of the three
        bivector planes in the canonical basis ordering). Faithful to
        the framework's grade commitments.
      status: "OPEN — the framework may adopt either; the choice determines
               which plane is the unstable one."

---

# ─────────────────────────────────────────────
# §6  WHAT THE GA FORM IMPROVES
# ─────────────────────────────────────────────

improvements:

  - improvement: "No principal-axis frame is imported"
    what_it_replaces: "The analyst's arbitrary choice of body frame"
    consequence: >
      The principal axes emerge as eigenvectors of I (or I_CCR). No
      arbitrary frame choice enters the derivation. This matters when
      the inertia tensor is not fixed — for configurations that
      reconfigure, the eigenstructure evolves, and the GA form handles
      this naturally.

  - improvement: "Inertia tensor can be nonlinear"
    what_it_replaces: "The classical assumption of a fixed linear map"
    consequence: >
      If I_CCR is nonlinear (which the framework's CCR cost functional
      may be), the classical derivation must be replaced by the
      perturbative expansion of the nonlinear map. The GA form is
      the right starting point for this extension.

  - improvement: "Time is not fundamental"
    what_it_replaces: "The classical dt parameter"
    consequence: >
      The equation is a relation between configuration-transition rates,
      not between coordinate-time rates. This is consistent with the
      framework's reading of time as an index. The classical form is
      recovered in the limit where transitions are uniform.

  - improvement: "Rotors compose multiplicatively"
    what_it_replaces: "The additive vector form of angular velocity"
    consequence: >
      Multiple rotations compose as rotor products, not as vector
      additions. This avoids the non-commutativity artefacts that
      appear in vector-based treatments of the classical problem. It
      is also the natural language for the Möbius closure structure,
      where the 720° double-cover is a property of rotors rather than
      vectors.

  - improvement: "Bivector commutator unifies with the framework's other algebras"
    what_it_replaces: "The vector cross product as an isolated structure"
    consequence: >
      The commutator L × Ω = ½(LΩ − ΩL) is the same algebraic
      structure that appears in the framework's other bivector
      dynamics — the electromagnetic field tensor, the spin bivector,
      the phase-gradient coupling. The framework's translation is not
      a foreign structure imported from classical mechanics; it is the
      same algebraic form as its other process-level dynamics.

---

# ─────────────────────────────────────────────
# §7  THE TARGET: ELECTRON STABILITY CALCULATION
# ─────────────────────────────────────────────

target:

  statement: >
    With the translation in place, the electron's stability calculation
    from dzhanibekov-as-moebius-integration.yaml becomes well-posed:
    identify the equilibrium bivector configuration of the electron
    (co-oriented pair in a single plane), perturb it by a bivector
    perturbation δB, expand the closure condition to second order, and
    check whether the quadratic coefficient corresponds to the half-
    twist Tw = 1/2.

  prerequisites:
    - "The CCR cost functional I_CCR must be defined (at least locally, near the equilibrium)."
    - "The electron's equilibrium bivector B* must be identified (from the GP solve at ccr-electron-explicit)."
    - "The closure condition (from vortex-stability.yaml) must be expressible as a constraint on the perturbed rotor."

  calculation_steps:
    - "Write Ω = Ω* + δΩ where Ω* is the equilibrium bivector phase rate."
    - "Write L = I_CCR(Ω) — nonlinear if I_CCR is nonlinear."
    - "Substitute into dL/dτ + Ω × L = 0 and expand to second order in δΩ."
    - "Extract the quadratic coefficient."
    - "Express the coefficient in the CWF decomposition Lk = Wr + Tw."
    - "Check whether the coefficient corresponds to Tw = 1/2."

  what_the_calculation_would_show:
    if_matches:
      - "Tw = 1/2 is derived from the intermediate-axis instability."
      - "The Möbius closure is the integrated form of the tumbling."
      - "The reading in dzhanibekov-as-moebius-integration.yaml §1 is confirmed."
    if_does_not_match:
      - "Either the reading is wrong, or Tw = 1/2 is derived at higher order."
      - "The three-plane extension (proton) may have a different structure."
      - "The classical analogy is directional but not exact."

---

# ─────────────────────────────────────────────
# §8  OPEN QUESTIONS
# ─────────────────────────────────────────────

open_questions:

  - id: "linearity-of-ccr-inertia"
    question: >
      Is the CCR cost functional linear in bivector activation? If yes,
      the classical derivation applies directly. If no, the perturbative
      expansion must be re-derived for the nonlinear case.
    status: "OPEN — prerequisite for the target calculation."

  - id: "ccr-inertia-from-gp"
    question: >
      Can the CCR cost functional be derived from the GP equation's
      second variation around the equilibrium? The classical inertia
      tensor comes from an integral over the body (∫ ρ r² dV); the
      CCR cost functional should have an analogous derivation.
    status: "OPEN — connects to ccr-electron-explicit."

  - id: "which-plane-is-intermediate"
    question: >
      Numerical reading (middle CCR cost) or structural reading
      (middle bivector by grade-position)?
    status: "OPEN — affects the choice of equilibrium configuration."

  - id: "role-of-the-viability-condition"
    question: >
      Does the R5 viability condition enter the second-order expansion
      as a constraint (limiting admissible perturbations), or does it
      only select which configurations are physically realized?
    status: "OPEN — connects to vortex-stability.yaml Part III."

  - id: "extension-to-three-plane-proton"
    question: >
      The proton has three orthogonal planes; the classical rigid body
      has three axes. Does the intermediate-axis analysis extend
      naturally, or does the grade-3 closure impose additional structure?
    status: "OPEN — connects to mass-as-plane-independence.yaml
               §proton_forced_independence."

