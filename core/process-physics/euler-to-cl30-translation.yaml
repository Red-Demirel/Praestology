# /core/process-physics/euler-to-cl30-translation.yaml
name: "Euler → Cl(3,0): Rigid-Body Rotation as Bivector Dynamics"
version: "0.1"
status: "TECHNICAL TRANSLATION — the classical Euler equations for rigid-body
         rotation are expressed in Cl(3,0) form, with framework-specific
         replacements for the inertia tensor (CCR cost functional),
         time (configuration-transition index), and the principal-axis
         structure (bivector planes). GA rigid-body mechanics is
         well-established (Hestenes, Lasenby, Doran, Gull); the
         framework-specific replacements are not yet derived. The
         intermediate-axis theorem is stated in GA form; the electron's
         stability calculation is deferred to the target file."
domain: "Core / Process-Physics"

description: >
  Classical rigid-body mechanics is the derived-reality description of
  a process-level phenomenon: the dynamics of an orientational configu-
  ration in three-dimensional space. The Euler equations state that
  dynamics in a particular coordinate frame (the principal-axis frame),
  with an inertia tensor summarizing the body's resistance to angular
  acceleration. They work, but they take the coordinate frame, the
  inertia tensor, and time as given.

  Geometric algebra formulates the same dynamics without these imports:
  angular velocity is a bivector, angular momentum is a bivector, the
  inertia tensor is a symmetric linear map on bivectors, and the
  equation of motion is a single commutator relation. The principal
  axes emerge as eigenvectors of the inertia map, not as a pre-existing
  frame. The framework extends this further: replacing the classical
  inertia tensor with the CCR cost functional, and time with the
  configuration-transition index, produces a version of the same
  dynamics that lives entirely within the process-level commitments.

dependency_map:
  requires:
    - "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
    - "core/process-physics/ga-dynamic-theory.yaml"
    - "core/process-physics/geometric-algebra-bridge.yaml"
    - "core/process-physics/mass-as-plane-independence.yaml"
    - "core/process-physics/bivector-partial-parameters.yaml"
  provides_to:
    - target: "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
      via: "The Euler → Cl(3,0) translation prerequisite"
    - target: "core/process-physics/mass-as-plane-independence.yaml"
      via: "CCR cost functional as the inertia tensor analogue"

---

# ─────────────────────────────────────────────
# §1  SCOPE AND STANCE
# ─────────────────────────────────────────────

scope:

  statement: >
    The classical Euler equations are a correct description of rigid-body
    rotation at the derivative level. The GA reformulation is not a
    correction of that description — it is the same dynamics expressed
    without the derivative-level imports (principal-axis frame, scalar
    inertia tensor, time parameter). The framework-specific replacements
    go further: they substitute process-level quantities for the
    derivative-level ones, producing a version of the dynamics that is
    consistent with the framework's other commitments.

  what_this_file_does:
    - "States the classical Euler equations."
    - "Translates them into Cl(3,0) form using standard GA rigid-body mechanics."
    - "Replaces the inertia tensor with the CCR cost functional, time with the configuration-transition index, and the principal-axis frame with bivector eigenstructure."
    - "States the intermediate-axis theorem in GA form."
    - "Identifies the target: the electron's second-order stability calculation."

  what_this_file_does_not_do:
    - "Derive the CCR cost functional's linearity or nonlinearity."
    - "Carry out the electron's stability calculation (deferred to the target file)."
    - "Prove the correspondence between the classical and framework-specific forms — only state it."

  stance: >
    The GA form is more foundational than the Euler form because it does
    not import a coordinate frame or an inertia tensor as primitives.
    Improvements to the derived reality — corrections, refinements,
    new predictions — follow from the more foundational form. The
    framework claims that the classical Euler equations are recovered
    as a limit of the GA form; the framework-specific replacements
    give the corrected version in regimes where the classical
    assumptions (linear inertia, fixed frame) do not hold.

---

# ─────────────────────────────────────────────
# §2  CLASSICAL EULER IN COMPONENT FORM
# ─────────────────────────────────────────────

classical_euler:

  statement: >
    In the body frame (rotating with the rigid body), with principal
    axes ê₁, ê₂, ê₃ and principal moments of inertia I₁, I₂, I₃, the
    classical Euler equations for the components ω₁, ω₂, ω₃ of angular
    velocity are:

      I₁ dω₁/dt = (I₂ − I₃) ω₂ ω₃
      I₂ dω₂/dt = (I₃ − I₁) ω₃ ω₁
      I₃ dω₃/dt = (I₁ − I₂) ω₁ ω₂

  structure:
    - "Three coupled first-order ODEs — nonlinear (quadratic) in ω."
    - "The nonlinear terms are the origin of the intermediate-axis instability."
    - "Principal-axis frame is assumed to pre-exist; the inertia tensor is diagonal in this frame."

  what_is_imported:
    - "The principal-axis frame ê₁, ê₂, ê₃."
    - "The inertia tensor as a diagonal matrix I = diag(I₁, I₂, I₃)."
    - "Time as the independent variable t."
    - "The three-dimensional spatial container in which the body rotates."

---

# ─────────────────────────────────────────────
# §3  GA FORM OF THE SAME DYNAMICS
# ─────────────────────────────────────────────

ga_form:

  statement: >
    In Cl(3,0), a rotor R describes the body's orientation. The angular
    velocity is a bivector Ω, defined by the kinematic relation between
    R and its rate of change. The angular momentum is a bivector L. The
    inertia tensor is a symmetric linear map I: ⋀²V → ⋀²V. The equation
    of motion is a single commutator relation.

  kinematic_relation:
    body_frame: "Ṙ = ½ Ω R  (Ω is the body-frame angular velocity bivector)"
    inertial_frame: "Ṙ = −½ R Ω_inertial  (relation between frames)"
    note: >
      The two forms differ by how Ω is attached to R. For the classical
      Euler problem, the body-frame form is standard.

  angular_velocity_bivector:
    expression: "Ω = Ω₁ B₁ + Ω₂ B₂ + Ω₃ B₃"
    basis: "B₁ = e₂e₃, B₂ = e₃e₁, B₃ = e₁e₂ — the bivector basis of Cl(3,0)"
    components: "Ωᵢ are the body-frame components of angular velocity"
    note: >
      The bivector Ω is the GA representation of the classical angular
      velocity vector. It differs from the vector by a duality
      transformation (multiplication by the pseudoscalar I or its inverse,
      depending on convention). The bivector form is more natural for
      rigid-body mechanics because it composes multiplicatively (rotors)
      rather than additively (vectors).

  inertia_tensor:
    definition: >
      A symmetric linear map I: ⋀²V → ⋀²V taking angular velocity
      bivectors to angular momentum bivectors. In a principal-axis
      frame, it acts as:
        I(Bᵢ) = Iᵢ Bᵢ
      for the principal bivectors Bᵢ, where Iᵢ are the principal moments.
    symmetric: "I(A)·B = A·I(B) for all bivectors A, B (the defining property of a symmetric map)"
    positive_definite: "I(B)·B > 0 for B ≠ 0 (any real inertia tensor)"
    eigenstructure: >
      The principal axes are the eigenvectors of I. The principal moments
      are the corresponding eigenvalues. There are generically three
      (since ⋀²V is 3-dimensional in Cl(3,0)), and the intermediate-axis
      theorem is a statement about the eigenvalue ordering.

  angular_momentum:
    expression: "L = I(Ω)"
    components: "L = L₁ B₁ + L₂ B₂ + L₃ B₃ with Lᵢ = Iᵢ Ωᵢ in the principal frame"

  equation_of_motion:
    body_frame: "dL/dτ + Ω × L = 0"
    commutator_form: "dL/dτ = L × Ω = ½(LΩ − ΩL)"
    note: >
      The symbol × denotes the commutator product on bivectors:
      A × B = ½(AB − BA). For bivectors in Cl(3,0), the commutator
      product is itself a bivector, and it satisfies the same
      antisymmetry and Jacobi identity as the vector cross product.
      The classical cross-product structure emerges as the bivector
      commutator in GA.

  derivation_of_classical_from_ga:
    statement: >
      In the principal-axis frame, if L = Σ Lᵢ Bᵢ and Ω = Σ Ωᵢ Bᵢ,
      the commutator L × Ω = Σᵢⱼ Lᵢ Ωⱼ (Bᵢ × Bⱼ). Using Bᵢ × Bⱼ = εᵢⱼₖ Bₖ
      (the standard bivector commutator structure in Cl(3,0)), the
      equation becomes:
        dLₖ/dτ = −Σᵢⱼ εᵢⱼₖ Lᵢ Ωⱼ
      With Lᵢ = Iᵢ Ωᵢ and the identification of the spatial components,
      this recovers the classical Euler equations exactly. The GA form
      is not a new dynamics — it is the classical dynamics without the
      derivative-level imports.

