# ─────────────────────────────────────────────
# §6b Quark as indermediary strain
# ─────────────────────────────────────────────


  quark_as_intermediary_strain:
    statement: >
      The 360° truncation (quark) and the 360° instability share the same
      third-order phase mismatch: both accumulate π of geometric phase over
      their cycle rather than 2π. The quark is therefore structurally
      prevented from closing alone — not by an energy barrier but by a
      topological obstruction of the same kind that prevents the 360° path
      from satisfying R(2π) = +R₀.
    phase_structure: >
      360° path geometric phase = π
        → R(2π) = −R₀  (sign flip, not self-identity)
        → closure condition ⟨G⟩₂ = 0 cannot be satisfied independently
        → third-order term drives the configuration toward completion
        → but completing one 360° traversal returns −R₀, not +R₀
        → the configuration is constitutively open
      The quark is stable as a local attractor (a partial closure minimum
      of the merge-tension functional) but constitutively incomplete:
      regardless of how the CCR parameters are tuned, the phase mismatch
      cannot be resolved within a single 360° path.
    confinement_as_phase_obstruction: >
      Confinement is the topological consequence of the phase mismatch.
      The quark cannot close alone because π ≠ 2π. It is under constant
      merge tension toward a configuration that can close — but the only
      configuration that resolves the mismatch is one that accumulates 2π
      jointly. This is the Praestology derivation of confinement: not a
      force between quarks, but a shared phase-closure requirement that
      cannot be satisfied by any individual quark configuration.

# ─────────────────────────────────────────────
# §6c Proton coupled phase
# ─────────────────────────────────────────────

  proton_coupled_geometric_phase:
    statement: >
      The proton's closure condition is NOT the sum of three individual quark
      geometric phases. The coupled three-rotor system has a joint geometric
      phase computed over the product configuration space, with inter-rotor
      coupling terms that modify each rotor's individual phase contribution.
      The naive sum π + π + π = 3π ≠ 2π fails — and yet the proton closes.
      The resolution is in the coupling structure, not the individual phases.
    naive_sum_failure: >
      Three quarks each contributing π of geometric phase:
        Φ_naive = π + π + π = 3π  (not 2π — closure not achieved)
      The naive sum fails because it treats the three rotors as independent.
      In the coupled system, the phase accumulated by R₁ depends on the
      orientation of R₂ and R₃. The joint path in configuration space is
      not a product of three independent paths — it is a correlated path
      in the three-fold product space with inter-rotor coupling at each step.

  pseudoscalar_resolution: >
    The three orthogonal bivector planes generate the even subalgebra
    Cl⁺(3,0), which is isomorphic to the quaternions ℍ. In this
    subalgebra:
      B_i² = -1  for each i
      B_i B_j = -B_j B_i  for i ≠ j
      B₁B₂B₃ = ±1  (the quaternionic central element)
    The product B₁B₂B₃ is not the pseudoscalar I = e₁e₂e₃ — it is a
    scalar. But it is the "2π element" of the quaternion subalgebra:
    multiplying any rotor by ±1 corresponds to a full 2π winding in the
    quaternionic sense. This ±1 is what forces the double cover.
    The joint closure of the three rotors is governed by this
    quaternionic structure, not by the grade-3 pseudoscalar directly.
    The pseudoscalar I = e₁e₂e₃ enters the proton story elsewhere — as
    the volume element of the three-plane configuration, as the grade-3
    content that distinguishes a proton closure from a meson. But the
    closure condition on the three-rotor product is a condition on the
    even subalgebra's central element.
    This is is one
    2π phase produced by the quaternionic product of three mutually
    orthogonal bivectors. The coupling IS the closure: the orthogonality
    of the three planes enforces the quaternionic product structure,
    which produces the 2π joint phase that individual quarks cannot
    each supply.
  
    orthogonality_requirement: >
      The joint geometric phase equals 2π if and only if the three bivector
      planes are mutually orthogonal. This is not imposed — it is the
      geometric condition for I² = −1 to hold. Two non-orthogonal planes
      give I² ≠ −1, and the joint phase deviates from 2π. Three orthogonal
      planes are the unique configuration achieving joint closure.
      This is why the proton requires exactly three quarks in mutually
      orthogonal planes — not as an SU(3) colour postulate but as the
      geometric condition for joint 2π phase closure in Cl(3,0).
    two_vs_four_quark_exclusion: >
      Two quarks: product lives in grade-0 + grade-2 sector. No grade-3
        pseudoscalar is formed; no joint 2π phase in the closed grade-3
        sector. Two quarks cannot achieve joint closure.
        (Mesons require quark-antiquark — chirality cancellation, a
        distinct mechanism.)
      Four quarks: a fourth bivector plane in Cl(3,0) is linearly dependent
        on the three basis bivectors. Adding it introduces redundancy.
        The joint phase remains 2π (already achieved at three) but the
        configuration has excess degrees of freedom that dissolve under R5.
        Four independent quarks cannot form a stable closure beyond three.
    coupled_calculation_requirement: >
      The proton closure calculation is a distinct computation from the
      single-rotor Dzhanibekov calculation. It requires:
        1. The coupled three-rotor equation of motion with CCR_binding
           coupling terms in the bivector phase rates
        2. The joint geometric phase integral over the correlated path
           in the three-fold product configuration space
        3. Verification that the pseudoscalar coupling gives exactly 2π
           joint phase for the mutually orthogonal configuration
      Summing individual quark phases is not a valid approximation —
      the coupling IS what produces the closure, not an additive correction.
    open_derivation: >
      OPEN: coupled-three-rotor-geometric-phase (priority 2, after the
      single-rotor Tw = 1/2 calculation). Depends on:
        euler-to-cl30-translation.yaml,
        dirac-as-grade-chain-closure.yaml (proton product solution),
        mass-as-plane-independence.yaml (CCR_binding as coupling term),
        SIM-005-v2 (proton product GP solve).

