# /core/process-physics/quarks-as-transitional-strains.yaml
name: "Quarks as Transitional Single-Rotor Strains — Grounding Feynman's Partons"
version: "1.1"
status: "STRUCTURAL HYPOTHESIS — recovers Feynman parton model; unifies QCD with
         GA rotor physics. Fractional charge values (1/3, 2/3) are the TARGET
         of the open derivation, not established results. Structural argument
         for fractional writhe from truncated S³ path is sound; specific
         fractions require single-rotor-s3-geodesic-volume computation."
domain: "Core / Process-Physics"
changes_from_v1.0: >
  Downgraded fractional charge values from established results to target values
  of the open derivation — the specific fractions 2/3 and 1/3 follow from the
  S³ geodesic computation (open), not from the structural argument alone. The
  structural argument (single rotor stops at 2π sign-flip, fractional writhe
  results) is sound. Added explicit connection to forces-as-vector-iterations
  .yaml: gluons as grade-1 phase-drag around partial closures (second-iteration
  vector interaction), not as a separate force mechanism. Replaced "charge is
  not a coupling constant" with more precise statement.

