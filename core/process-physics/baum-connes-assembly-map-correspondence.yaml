zero_energy_universe_reframing:
  standard_picture: >
    Tryon (1973), Hawking, Vilenkin: positive energy of matter exactly
    cancels negative gravitational potential energy, giving E=0.
    Problem: gravitational potential energy being "negative" is
    coordinate-dependent in GR; exact cancellation has no derivation
    from first principles.
  framework_reframing: >
    E=0 is the K₀/K₁ balance maintained by the assembly map:
      K₀ (positive): committed lock structures — CCR transaction
                     costs of all R5 closures, stored in committed topology
      K₁ (counterweight): open-vector gradient propagation — the
                     first-order ∇s field maintaining explorative-regime
                     potential from which closures draw
  why_more_precise: >
    The K₀/K₁ balance is:
      — Not coordinate-dependent (topological invariants are
        coordinate-free by construction)
      — Not a static cancellation (the assembly map actively
        maintains the isomorphism through the R1–R5 loop)
      — Not dependent on matter/antimatter symmetry (K₀ includes both)
      — Derivable from μ being an isomorphism — if the assembly map
        is an isomorphism, K₀ and K₁ content are balanced by structural
        necessity, not empirical coincidence
  consequence: >
    The universe has zero net topological charge (K₀ closures balanced
    by K₁ field effects) maintained dynamically by the R1–R5 assembly
    process. The gravitational potential energy being "negative" in the
    standard picture is the derivative-level description of K₁ field
    effects being the counterweight to K₀ closures — correctly signed
    from outside the committed regime but misleadingly framed as
    matter vs gravity rather than closure vs propagation.

