---

baum_connes_in_brief:
  statement: >
    The Baum-Connes conjecture asserts that the assembly map
      μᵢ: Kᵢ^top(G) → Kᵢ(C*_r(G))  (i = 0, 1)
    is an isomorphism. It bridges:
      Left side:  equivariant K-homology K^top(G) — the geometric side,
                  classifying proper group actions and elliptic operators.
                  Well-understood; geometric cycles are tractable.
      Right side: K-theory of the reduced group C*-algebra K(C*_r(G)) —
                  the analytic side, encoding committed spectral data.
                  Historically opaque; hard to compute directly.
    The assembly map μ is defined by taking the index of the
    Connes-Dirac operator on each geometric cycle — mapping
    geometric potential to analytic committed structure.
  status_note: >
    Injectivity of μ established for all connected groups and groups
    acting properly on CAT(0) spaces. Surjectivity remains open for
    many groups. The conjecture without coefficients is the form used
    here; the with-coefficients version has known counterexamples
    (Higson, Lafforgue, Skandalis 2002) and is excluded throughout.

---

framework_correspondence:

  geometric_side_as_explorative_regime:
    bc_object: "K^top(G) — equivariant K-homology"
    framework_object: "Explorative regime (R3/R4) — open potential,
                       phase configuration space"
    mapping: >
      Equivariant K-homology classes are represented by geometric
      cycles — generalisations of the Connes-Dirac operator on proper
      G-manifolds. In the framework: explorative-regime rotor
      configurations are the geometric cycles, each a specific
      grade-1/grade-2 potential state in the phase configuration space.
      The classifying space EG of proper G-actions corresponds to the
      full open multivector space of Cl(3,0) before closure — all
      proper (viability-satisfying) configurations available for R5.
    confidence: "STRUCTURAL — the well-understood geometric side maps
                 cleanly to the tractable explorative regime"

  analytic_side_as_committed_regime:
    bc_object: "K(C*_r(G)) — K-theory of reduced group C*-algebra"
    framework_object: "Committed regime (η) — accumulated R5 closures,
                       locked topological structures"
    mapping: >
      The reduced C*-algebra C*_r(G) encodes the actual spectral
      properties of the group's action — the committed analytic reality.
      Its K-theory classifies stable isomorphism classes of projections
      (K₀) and unitaries (K₁). In the framework: η encodes the
      committed record of R5 closures whose spectral properties (mass,
      charge, spin) are exactly what C*-algebra K-theory classifies.
      The historically opaque character of C*-algebra K-theory maps
      precisely to the framework's claim that the derivative level
      cannot derive its own constants — they are encoded at the process
      level, inaccessible from within η.
    confidence: "STRUCTURAL — the historically opaque analytic side maps
                 to the derivative-level η whose opacity the framework explains"

  assembly_map_as_r5_commitment:
    bc_object: "μ: K^top(G) → K(C*_r(G)) — the assembly map"
    framework_object: "R5 commitment event — threshold crossing mapping
                       explorative-regime configurations to committed η"
    mapping: >
      The assembly map μ takes a geometric cycle (explorative-regime
      configuration) and maps it to its analytic index (committed
      spectral datum) by computing the index of the Connes-Dirac
      operator. In the framework: R5 takes an open-potential rotor
      configuration and commits it to η by crossing V_c. The
      Connes-Dirac index is the CCR — the specific numerical invariant
      that each committed configuration carries.
      μ being an isomorphism means:
        Surjectivity: every committed structure has a geometric origin
          in the explorative regime — no η structure without a
          process-level source
        Injectivity: no two distinct explorative configurations
          produce the same committed structure — no information loss
          in R5 commitment
    active_maintenance: >
      μ is not a one-time mapping but the active maintenance engine:
      the continuous R1–R5 loop keeps the geometric side generating
      new cycles that μ maps to committed structures, while R_diss
      releases committed structures back to the geometric side.
      The isomorphism is dynamically maintained — an active equilibrium.
    confidence: "STRONG STRUCTURAL — CCR as Connes-Dirac index is the
                 most precise alignment in this correspondence"

  ccr_as_connes_dirac_index:
    statement: >
      The CCR (Wr · Ω_rotor / Ω_embed) is the specific numerical
      invariant that the assembly map computes at each committed
      configuration. This provides independent mathematical support
      for the CCR as a well-defined topological invariant of committed
      configurations — the assembly map has to produce a topological
      invariant of the geometric cycle, and the CCR is that invariant
      for the Möbius rotor configuration. This existence argument
      comes from outside the framework.
    confidence: "STRUCTURAL SUPPORT — formal identification requires
                 explicit computation of Connes-Dirac index for Möbius
                 rotor configuration; tracked as issue_5 in
                 open-reconciliation-notes.yaml"
    independent_support: >
      The assembly map independently motivates the CCR as a topological
      invariant without requiring the framework's own structural argument.
      If the Connes-Dirac index of the Möbius rotor geometric cycle
      equals the CCR value, this constitutes external mathematical
      confirmation that the CCR is the right quantity — not just
      consistent with the framework but required by the geometry.

  k0_k1_as_closure_field_balance:
    statement: >
      The assembly map has two components, indexed by i = 0, 1:
        K₀: classifies projections — even-dimensional cycles,
             even-grade GA configurations (scalar, bivector, rotor).
             Topological closures: committed lock structures.
        K₁: classifies unitaries — odd-dimensional cycles,
             odd-grade GA configurations (vector, pseudoscalar).
             Field propagation effects: open-vector gradient structures,
             first-order scalar overlap gradient ∇s, gravity.
    mapping: >
      K₀ ↔ topological closures (committed grade-0/2/rotor — matter)
      K₁ ↔ field effects / gravity (open-vector grade-1/3 propagation)
      μ₀ and μ₁ ↔ R5 commitment acting on even and odd grade
                   configurations respectively
    connection_to_equivalence_principle: >
      Gravity as K₁ (first-order ∇s propagation) vs inertia as K₀
      (topological closure rank) gives the equivalence principle an
      independent mathematical grounding: K₀ and K₁ are balanced by
      the assembly map isomorphism — the same μ that maps geometric
      cycles to committed indices enforces that the even-grade (matter)
      and odd-grade (field/gravity) sectors are commensurate. The
      equivalence principle is the physical expression of the K₀/K₁
      balance maintained by μ.

