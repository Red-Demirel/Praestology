matter_antimatter_reframing:
  standard_picture: >
    Matter and antimatter created in equal amounts; observed matter
    excess requires CP violation beyond Standard Model predictions;
    mechanism unknown — major unsolved cosmological problem.
  framework_reframing: >
    The apparent dichotomy misidentifies the balance. Matter and
    antimatter are both K₀ (even-grade committed closures,
    distinguished only by rotor orientation sign — chirality).
    The actual balance is:
      K₀ (weight): topological closures — matter AND antimatter
                   together, all even-grade committed configurations
      K₁ (counterweight): field effects and gravity — open-vector
                   gradient propagation, first-order ∇s field
  matter_excess_consequence: >
    The observed matter excess over antimatter is not a
    symmetry-breaking problem. It is a consequence of the local
    rotor orientation history of the explorative regime — whichever
    chirality the first distinction broke toward propagated
    consistently through subsequent R5 closures in the local
    neighbourhood. No initially symmetric state that then broke;
    always a specific orientation in the geometric cycle, preserved
    through μ into the committed regime. The asymmetry is encoded
    in K₀ class structure.
  what_antimatter_is: >
    Antimatter is K₀ classes with opposite rotor orientation sign —
    same geometric cycle with B → -B (bivector sign flip). Both
    matter and antimatter are K₀ — complement pairs within the
    even-grade sector, not opposites of the full K₀/K₁ balance.
    Annihilation (matter + antimatter → photons) is K₀ complement
    pairs cancelling grade-2 character and releasing grade-1
    propagating gradients — exactly the counter-oriented rotor pair
    producing the photon (ga-grade-chain-to-particles.yaml #photon).
    Not destruction of matter by antimatter but even-grade closure
    pairs converting to odd-grade propagation.

