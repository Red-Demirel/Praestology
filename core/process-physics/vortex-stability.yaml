# ─────────────────────────────────────────────────────────────
# PART VI: CHIRALITY STABILITY AND PARTIAL CLOSURES
# ─────────────────────────────────────────────────────────────
chirality_stability:
  statement: >
    The stability of a committed rotor configuration depends on whether
    its chirality is topologically protected. The 720° Möbius closure
    has topological protection; the 360° closure does not. This distinction
    is the algebraic origin of particle stability and the mechanism behind
    partial closures (neutrinos).

  the_360_instability:
    statement: >
      A 360° rotor closure (R(2π) = -1) is chirally unstable. The rotor
      does not return to itself after one full cycle — it returns to -R.
      The chirality (the projection of the bivector onto the pseudoscalar,
      χ = B·I) is not topologically protected.
    
    mechanism: >
      In a 360° loop, the bivector field B(s) can vary along the centerline
      parameter s. The effective chirality χ(s) can pass through zero when
      the loop becomes planar in a different orientation (B·I = 0). At this
      point, the chirality can flip (χ → -χ) under continuous deformation.
      There is no topological invariant preventing this flip.
    
    consequence: >
      A 360° loop is "wobbly" — it cannot maintain a stable handedness.
      It will either dissolve back into open potential (Regress) or
      reconfigure into a topologically protected closure (720° Möbius).
      The 360° closure is not a stable particle; it is a transitional
      configuration that must either commit fully or dissolve.

  the_720_protection:
    statement: >
      The 720° Möbius closure (R(4π) = +1) is chirally stable. The rotor
      returns to itself after two full cycles. The Möbius topology is
      non-orientable — it has only one side. The half-integer twist
      (Tw = 1/2) cannot be continuously removed.
    
    mechanism: >
      The Möbius band requires a third dimension to twist through. In 3D,
      the Möbius topology is stable because you cannot continuously deform
      it to flip its chirality without passing through a singularity
      (where the amplitude goes to zero, breaking the closure). The
      topological invariants (Lk = 2, Tw = 1/2, Wr = 3/2) are protected
      by the closure condition.
    
    consequence: >
      The 720° Möbius closure is a stable particle (electron). The
      chirality is locked by the topology. The configuration cannot
      spontaneously flip its handedness without dissolving.

  partial_closures_and_neutrinos:
    statement: >
      Neutrinos are hypothesized to be partial inward closures —
      configurations with some degree of self-referential topology,
      but less than the full 720° Möbius closure of the electron.
      The three neutrino generations correspond to three different
      degrees of partial inward closure.
    
    mechanism: >
      A partial closure has incomplete grade-2 structure. It has some
      inward Praegress closure (nonzero rest mass), but the closure
      is not topologically protected to the same degree as the full
      Möbius. The chirality is partially protected — stable enough
      to persist, but not as rigidly locked as the electron.
    
    three_generations: >
      The three neutrino mass eigenstates (ν₁, ν₂, ν₃) correspond to
      three different degrees of partial inward closure:
      - ν₁ (lightest): minimal inward closure, closest to photon-like
      - ν₂ (intermediate): moderate inward closure
      - ν₃ (heaviest): maximal inward closure short of full Möbius
      
      The mass hierarchy reflects the degree of topological protection:
      more inward closure → more trapped rotational energy → higher mass.
    
    connection_to_360_instability: >
      The 360° loop's chirality instability is the mechanism that
      prevents partial closures from being fully stable. A partial
      closure exists in a regime where the topology is not fully
      locked — it has some inward closure, but the chirality can
      still fluctuate. This is why neutrinos oscillate between
      flavours: the partial closure allows the flavour state to
      evolve as the topology slowly reconfigures.
    
    status: >
      STRUCTURAL HYPOTHESIS — the neutrino-as-partial-closure reading
      is consistent with the framework's existing claim that neutrinos
      have small but nonzero rest mass (photon-mass-and-proton-excess.yaml
      #neutrino_comparison). The specific fractional writhe values for
      each generation require the SIM-001-v3 computation.

  open_derivations:
    - id: "fractional-writhe-for-partial-closures"
      description: >
        Compute the fractional writhe values for partial closures
        corresponding to the three neutrino generations. Should
        recover the mass ratios m₁ : m₂ : m₃ from the degree of
