neutrino_precision_note:
  statement: >
    Neutrinos are NOT committed particles.
    They are partial inward closure configurations that exist in the R3
    exploratory regime (pre-R5) until a 3rd body interaction triggers
    R5 commitment. What we observe as "neutrino properties" (elusiveness,
    oscillations, small mass) are consequences of this pre-R5 status.
  
  pre_r5_status: >
    Neutrinos are vector-expressions (partial bivector activations) in
    the R3 regime. They are not committed to η until a 3rd body interaction
    forces R5 commitment. This is why they are so hard to detect — they
    spend most of their existence in the pre-R5 state.
  
  oscillation_mechanism: >
    Neutrino flavour oscillations are the reconfiguration of the partial
    closure in the R3 regime before R5 fires. The partial closure can
    shift its bivector parameter distribution as long as commitment has
    not occurred. Detection (3rd body interaction) forces R5 commitment
    and locks the flavour.
    The oscillation is periodic because the phase difference between two
    partial closure CCR costs accumulates at a rate set by their mass
    splitting. The oscillation length L_osc = 4πE/Δm² is the distance
    over which this phase difference reaches 2π — one full cycle of
    interconversion between partial closure configurations. In framework
    terms: the CCR cost difference Δ(CCR) between two mass eigenstates
    sets the spatial frequency of the R3 attractor reconfiguration.
  
  mass_origin: >
    The small but nonzero rest mass of neutrinos is the CCR cost of the
    partial inward closure — more than zero (photon) but less than the
    full Möbius 720° lock (electron). The mass hierarchy (ν₁ < ν₂ < ν₃)
    reflects the degree of partial closure.
  
  three_generations: >
    The three neutrino mass eigenstates are not three different committed
    particles. They are three different partial closure configurations —
    three different modes or degrees of partial inward closure in the
    bivector parameter space.
  
  status: >
    STRUCTURAL HYPOTHESIS — consistent with the framework's pre-R5/post-R5
    distinction and the partial parameter activation framework. Requires
    explicit derivation of the partial closure configurations and their
    CCR costs.

