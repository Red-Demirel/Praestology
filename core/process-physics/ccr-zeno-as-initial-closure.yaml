# ─────────────────────────────────────────────
# §5  OPEN DERIVATIONS
# ─────────────────────────────────────────────

open_derivations:

  priority_1:
    - id: "r5-firing-rate-from-master-equation"
      description: >
        Derive the R5 firing rate as an explicit functional of local
        𝓥(ψ) and V_c from the master equation's ℛ(ψ). Currently the
        commitment-gain term is μ·σ(𝓥 − Vc)·ψ; the firing *rate* is
        implicit. Needed as the base case for the Zeno rate-matching
        condition at D₋₁ → D₀.
      depends_on: ["core/core-dynamical-equation.yaml#resolution_operator"]
      priority: 1

    - id: "retention-factor-from-firing-dynamics"
      description: >
        Derive the per-firing retention factor from the discrete R5
        dynamics, and check whether it evaluates to φ⁻¹. If it does,
        the identification is derived, not assumed. If it evaluates
        to a different algebraic number, the Zeno reading survives
        but the φ⁻¹ identification is falsified.
      depends_on: ["r5-firing-rate-from-master-equation",
                   "core/d-minus-one-pre-vector-level.yaml §1"]
      priority: 1

    - id: "rate-matching-condition-at-D0"
      description: >
        Derive the rate-matching condition f_R5 = f_rotor for the
        D₋₁ → D₀ transition. Show that the equilibrium basis vectors
        emerge at the rate-matching radius, and that the equilibrium
        shape carries the accumulated retention imprint.
      depends_on: ["retention-factor-from-firing-dynamics"]
      priority: 1

  priority_2:
    - id: "sqrt5-in-f-closure"
      description: >
        Test the √5 prediction: after SIM-004-v2 is run with the full
        coupled master equation (not the simplified GP ODE), check
        whether f_closure carries a factor in ℚ(√5). If yes, the
        Zeno-as-initial-closure reading is confirmed. If no, it is
        falsified.
      depends_on: ["rate-matching-condition-at-D0",
                   "issues/foundational/test-spec-electron-ccr-gp-equilibrium-v2.yaml"]
      priority: 2

    - id: "ccr0-environmental-shift"
      description: >
        CCR⁰ = φ⁻¹ is the unperturbed retention factor. Under
        environmental Π_eff compression, does CCR⁰ shift by the same
        2.2 ppm as α? If yes, the environmental mechanism is the same
        for both quantities — the compression acts on the shared
        substrate capacity. If no, the two are environmentally
        independent, and the "+−" in the user's note reflects a
        different source of deviation.
      depends_on: ["rate-matching-condition-at-D0"]
      priority: 2

  priority_3:
    - id: "zeno-as-universal-base-case"
      description: >
        Show that the D₋₁ → D₀ Zeno mechanism is the base case of the
        universal Zeno mechanism that operates at every depth. Verify
        that the rate-matching condition at D₋₁ → D₀ reduces to the
        higher-depth rate-matching under appropriate coarse-graining.
      depends_on: ["rate-matching-condition-at-D0",
                   "core/process-physics/ccr-zeno-core-reframing.yaml"]
      priority: 3

