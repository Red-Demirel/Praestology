# ─────────────────────────────────────────────
# §3  DIRECTION CORRECTION: RATE MATCHING, NOT COMPRESSION
# ─────────────────────────────────────────────

direction_correction:

  prior_language_error:
    statement: >
      The earlier drafts (both SIM-004-v2's diagnostic text and the
      ccr-zeno-core-reframing draft) used directional language —
      "compression" of R_core, "expansion" of the core — to describe
      what the discrete dynamics must do to reach the target. This
      language was misleading.
    why_wrong: >
      R_core in the Zeno picture is not a fluid healing boundary that
      "compresses" or "expands" under different equation forms. It is
      the radial position where the local R5 firing frequency matches
      the intrinsic R3 rotation frequency. It is a *rate-matching
      condition*, not a spatial extent determined by competition
      between fluid terms.

  correct_formulation:
    statement: >
      The core boundary is the surface r = R_core where:
        f_R5(r) = f_rotor(r)
      Below this radius, R5 fires more frequently than R3 can rotate
      (Zeno-locked). Above it, R3 rotates freely (unlocked). The
      boundary is a resonance condition, not a geometric compression.
    consequence: >
      R_core is determined by the local Π_eff and η profile through
      the rate-matching equation. Whether it comes out large or small
      depends on the actual functional forms — it is a numerical
      outcome, not a direction to be prescribed.
    neither_compress_nor_expand: >
      The correct language is: the Zeno boundary *locates itself* at
      the rate-matching radius. If the coupling terms shift the local
      firing rate, the boundary moves. But it moves to satisfy the
      rate-matching condition — it is not "compressed" or "expanded"
      by external pressure.

  what_this_changes:
    sim004_v2_diagnostic_text: >
      Replace "must compress R_core to yield f_eq ≈ 65.41" with
      "must locate the rate-matching boundary at a radius that yields
      the required f_eq." The direction question is dissolved; only
      the magnitude question remains.
    ccr_zeno_core_reframing: >
      The "emergent_core_boundary" section's "compression toward the
      required target" language should be revised to rate-matching
      language. The reframing's structural content is correct; the
      directional language is not.

