# ─────────────────────────────────────────────
# §4  THE √5 FINGERPRINT PREDICTION
# ─────────────────────────────────────────────

sqrt5_prediction:

  statement: >
    Under the revised pivotal reading, the √5 fingerprint in f_closure
    is no longer a speculative fingerprint — it is a *positive
    prediction* of the Zeno-as-initial-closure hypothesis. If CCR⁰ = φ⁻¹
    enters the D₀ → D₁ closure through the equilibrium core boundary
    condition, then f_closure (or its components) should carry a factor
    in ℚ(√5).

  why_specific:
    - "φ = (1+√5)/2 and φ⁻¹ = (√5−1)/2 are both in ℚ(√5)."
    - "If the core-boundary rate-matching condition is set by φ⁻¹ (the Zeno retention factor), the equilibrium shape equation inherits that algebraic structure."
    - "f_eq = ξ/R_core, evaluated on the φ⁻¹-constrained equilibrium, should therefore carry a √5-dependent factor."
    - "f_closure = f_geom · f_eq; if f_eq carries √5, f_closure carries √5."

  what_f_geom_lacks: >
    The currently-cited f_geom = 1/π has no √5 content. If the Zeno
    reading is right, the √5 must appear in f_eq (or in a corrected
    f_geom, if the factor-of-2 issue we flagged earlier resolves in a
    way that introduces √5 — unlikely, but not excluded).

  testable_form:
    general: "f_closure = (rational/π) × (√5-dependent factor)"
    specific_candidates:
      - "f_eq ∝ 1/φ = (√5 − 1)/2 ≈ 0.618"
      - "f_eq ∝ 1/φ² = (3 − √5)/2 ≈ 0.382"
      - "f_eq ∝ 1/φⁿ for some integer n"
      - "f_eq ∝ (φ^N − (−φ⁻¹)^N)/√5 (Binet-type combination)"
      - "f_eq ∝ some other ℚ(√5) expression"
    what_the_prediction_commits_to: >
      Some non-rational factor in ℚ(√5) appears in f_closure.
      The specific exponent N, or the specific Binet combination,
      is an open numerical question to be answered by the equilibrium
      solve.

  falsification:
    statement: >
      If a full discrete Zeno simulation at D₋₁ → D₀ produces f_closure
      with NO ℚ(√5) content — e.g., f_eq is a rational multiple of
      1/π — then the Zeno-as-initial-closure reading is falsified. The
      link would be absent after all, and the prior default reading
      would be reinstated on different grounds.
    what_remains_open: >
      Even if the Zeno reading is falsified, the discrete-firing
      picture of the D₋₁ → D₀ transition might still be correct — the
      retention factor would simply be a rational number rather than
      φ⁻¹. The specific identification of φ⁻¹ with Zeno retention is
      what is tested by the √5 prediction.

