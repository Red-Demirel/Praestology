issue_4_ccr_well_width_uniformity:
  status: "OPEN — CCR potential-well structure identified; uniformity unestablished"
  question: >
    Whether CCR-derived well widths are Π_eff-uniform or vary with local
    Π_eff and η. Non-uniformity implies: narrower wells in dense matter
    (in-medium hadron mass shifts), wider wells in voids (faster R_diss).
  significance: >
    su3-from-triality-hadron-spectrum depends on knowing the well structure.
    Friedmann void-dominant R_diss rate depends on void well widths.
  connection: >
    closure-types-nesting.yaml#non_additivity_formal provides the algebraic
    form CCR_total = CCR(M₁) + CCR(M₂) + CCR_binding(d₁,d₂) — the binding
    term CCR_binding is the per-depth contribution that would vary with Π_eff
    if well widths are non-uniform.
  recommendation: >
    Add ccr-well-width-uniformity as priority-2 open derivation in
    vortex-stability.yaml, dependent on ccr-electron-explicit.

