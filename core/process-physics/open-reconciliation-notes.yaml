issue_10_ccr_threshold_partial_closure:
  status: "PARTIAL CLOSURE — threshold condition established; writhe calculation open"
  summary: >
    rotor-to-ccr-transition.yaml establishes CCR_crit = 1 as the threshold
    condition, identifying the closure radius r₀ = ħ/mc as the reduced
    Compton wavelength. This partially closes ccr-electron-explicit (priority
    1 in vortex-stability.yaml): the THRESHOLD CONDITION is now derived
    (CCR = 1 at r₀ = ħ/mc), but the WRITHE VALUE Wr that determines what
    the CCR evaluates to at that threshold remains uncalculated.
  what_is_closed: >
    The CCR threshold value (CCR_crit = 1) and the capacity scale (r₀ = ħ/mc)
    are derived from the 720° boundary condition Q* = R_k[Q*] — not fitted.
    This is the structural closure of the threshold: we know where the
    transition happens and why.
  what_remains_open: >
    The writhe Wr of the equilibrium Möbius configuration from the GP equation
    via Calugareanu-White-Fuller — this determines the actual CCR value at
    threshold and connects to α. The threshold tells us CCR = 1 there; the
    writhe calculation tells us what specific topology achieves CCR = 1.
  update_to_priority_items: >
    ccr-electron-explicit should be split into two sub-derivations:
      (a) ccr-threshold-from-720-boundary: PARTIALLY CLOSED by
          rotor-to-ccr-transition.yaml — threshold condition r₀ = ħ/mc derived
      (b) ccr-writhe-from-cwf: OPEN — Wr computation from equilibrium GP shape
    The priority-1 status should remain on (b); (a) is structurally resolved.

