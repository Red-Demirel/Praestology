    Stress (Praegress/intrinsic) and tension (Regress/extrinsic) are related,
    not independent: stress corresponds to inertia (local reconfiguration
    resistance); tension corresponds to gravitational field effect (outward
    propagation). Two readings of the same coupling at opposite sides of R5.
  what_remains: >
    No explicit mathematical relation written showing inertia (local stress)
    and gravitational effect (field tension) as two projections of one
    coupling term in the GA master equation. Named but not derived.
  recommendation: >
    inertia-planck-relation.yaml and emergent-classical-fields.yaml should
    cross-reference this framing once praegress-regress-formal-ga-expression
    is attempted.

