# ─────────────────────────────────────────────
# §2  MIXED CROSS-DERIVATIVES AS OFF-DIAGONAL INERTIA
# ─────────────────────────────────────────────

gradient_axis_coupling:
  correction_note: >
    The prior draft used "off-diagonal inertia" and "Hessian matrix" language,
    importing classical optimization assumptions that don't belong in the
    framework. The coupling structure is between gradient-axes — first-order
    objects in the potential space — not second partial derivatives of a scalar
    potential. The system resolves disbalances between gradient-axes; it does
    not minimize a potential.

  what_gradient_axes_are: >
    A gradient-axis is a direction in bivector activation space along which
    the process exerts R3 tension — an unresolved directional pull. It is a
    first-order object. Two gradient-axes are coupled when the R3 tension
    along one constrains the available R4 resolutions along the other.
    The coupling is not a second derivative; it is a mutual constraint
    between two first-order tensions.

  formal_identification: |
    G_i  — gradient-axis i: direction of R3 tension in bivector space
    C_ij — coupling strength between gradient-axes i and j:
            how much tension along G_i constrains resolution along G_j
    C_ii — intrinsic resolution cost of axis i alone
    C_ij (i ≠ j) — mutual constraint between axes i and j

    The coupling structure C[·] is a functional on gradient-axis pairs,
    not a matrix of second derivatives. Its diagonal entries are intrinsic
    resolution costs; its off-diagonal entries are mutual constraints.

  dynamics: >
    The system is not minimizing a potential. It is resolving disbalances
    between gradient-axes. The process runs from tension (R3) through
    commitment (R4) toward resolution. The "equilibrium" is not where
    gradients vanish but where disbalances are mutually resolved — where
    neither axis can drive further change without re-engaging the other.
    Resonance: disbalances resolved, mutual restraint achieved.
    Dissonance: disbalances unresolved, instability or incomplete closure.

  what_this_replaces:
    prior_hessian_language: >
      H_ij = ∂²I_CCR/(∂B_i∂B_j) — literal second partial derivatives at
      an equilibrium point. This imports: (a) a background coordinate space
      in which B_i are independent, (b) a potential-minimization picture,
      (c) the equilibrium as a gradient-vanishing point. None of these hold.
    corrected_language: >
      C_ij — coupling strength between gradient-axes, derived from the
      topology of the closure path and the R3 tension structure. Not a
      matrix entry but a relational quantity between two process directions.

  uncoupled_case: >
    C_ij = 0 for i ≠ j. No mutual constraint. Each gradient-axis resolves
    independently; no shared reference. Photon-like: phase rate present,
    chirality sense reference-free. Single-axis tension has no second axis
    to constrain it — it propagates rather than closes.

  coupled_case: >
    C_ij ≠ 0. Gradient-axes are mutually constraining. A joint reference
    is established by the coupling structure. Electron-like: phase rate and
    chirality sense both internally referenced. The mutual constraint is
    what makes closure possible — neither axis can deviate without the
    other compensating.

  dzhanibekov_connection: >
    The intermediate-axis instability is not a second derivative going
    negative. It is a disbalance between two gradient-axes that cannot
    mutually resolve: the intermediate axis cannot settle because any small
    perturbation toward either neighboring axis is not opposed by the other.
    The instability is the absence of mutual restraint — C_ij fails to
    stabilise. The Möbius closure is the configuration where C_ij IS
    mutually stabilising: the two gradient-axes constrain each other such
    that neither can deviate without the other compensating.

  mutual_reference_connection: >
    An initial impulse (one gradient-axis alone) is unstable — it needs
    a second axis to achieve stability. This is the algebraic form of
    the mutual-reference structure in intrinsic-reference-spin-momentum.yaml:
    neither grade-1 nor grade-2 can be stable alone; they need each other
    as reciprocal references. The coupling functional C[·] is that structure
    made explicit.

