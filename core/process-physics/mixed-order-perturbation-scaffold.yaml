# ─────────────────────────────────────────────
# §3  THE CCR AS HESSIAN CONSEQUENCE
# ─────────────────────────────────────────────


# ─────────────────────────────────────────────
# §3b  FREDHOLM vs K-THEORY/ASSEMBLY MAP
# ─────────────────────────────────────────────

fredholm_vs_assembly_map:
  statement: >
    The CCR-as-functional-consequence reading operates at two distinct
    levels. Conflating them produces confusion about what is being computed
    and what has been established. The Fredholm level is more significant
    within the vector-multispace for specific closure computations; the
    K-theory/assembly level is more powerful for general depth-n classification.
    Both are needed; neither replaces the other.

  terminology_bridge:
    statement: >
      Two distinct uses of "Hessian" appear in this file. They are NOT
      the same object and the distinction matters:
    hessian_matrix_point_local: >
      H_ij = ∂²I_CCR/(∂B_i∂B_j) at a specific equilibrium point.
      This is what §2 (gradient_axis_coupling) CORRECTS: it imports a
      background coordinate space, a potential-minimization picture, and
      the equilibrium as a gradient-vanishing point. REPLACED by the
      coupling functional C[·] in §2.
    hessian_functional_operator_theoretic: >
      The second variation δ²S[ψ] of the action functional S — a
      self-adjoint operator on the function space of configurations.
      This is the object used in §3b/3c. It is intrinsically defined
      without a coordinate background: the second variation is a
      coordinate-free object determined by the action functional's
      geometry. The gradient-axis correction in §2 does NOT apply here
      because this object makes no reference to a coordinate matrix.
      It IS the mathematically rigorous form of what §2 is pointing at:
      the coupling structure as an operator, not a matrix.
    why_both_appear: >
      §2 corrects the naive (matrix, point-local) reading.
      §3b/3c uses the rigorous (operator, functional) reading.
      The Hessian functional H[·] in §3b IS the operator-theoretic form
      of the coupling functional C[·] in §2 — they are the same physical
      object at different levels of mathematical precision. C[·] and H[·] are the same physical structure at two levels
      of mathematical precision. Whether they are literally the same operator is the derivation target: show that the
      gradient-axis coupling functional equals the second variation of the action functional.

  fredholm_level:
    what_it_is: >
      The Fredholm index of the specific closure operator T acting directly
      in the Cl(3,0) multivector space. Concrete, computable from the closure
      condition. Lives at the level of the individual closure computation.
    operator: >
      T = ∇(·)Ie₃ − μ(·)  (dirac-as-grade-chain-closure.yaml)
      T acts on multivector-valued functions over bivector parameter space.
    index_definition: >
      Index(T) = dim(ker T) − dim(coker T)
      ker T: configurations where all gradient-axis tensions are resolved
             (Tψ = 0 with the appropriate boundary condition)
      coker T: zero modes of the adjoint T† — over-determined cases
    electron_computation:
      preconditions:
        status: "OPEN — must be verified before Index(T) claims are valid"
        items:
          - id: "fredholm-at-equilibrium"
            statement: >
              T is Fredholm at B* (the electron equilibrium configuration):
              compact resolvent, spectral gap opened by the logarithmic
              saturation term Λln(1+κ|ψ|²), finite-dimensional kernel.
              Requires the GP equilibrium shape from SIM-004-v2.
          - id: "ker-dimension-720"
            statement: >
              ker T restricted to the 720° boundary condition is exactly
              one-dimensional — the Möbius fixed point is unique, not one
              of a family of solutions. This must be shown, not assumed.
          - id: "coker-dimension-zero"
            statement: >
              ker T† (the adjoint) is zero-dimensional — no zero modes
              of the adjoint at the equilibrium. Equivalently, the equation
              T†φ = 0 has no non-trivial solution at B*.
          - id: "coupling-symmetry-at-equilibrium"
            statement: >
              Whether the gradient-axis coupling C_ij is symmetric at
              equilibrium (C_ij = C_ji). Symmetry would imply T is
              self-adjoint at B*, which simplifies the cokernel calculation
              (coker T = ker T for self-adjoint Fredholm operators).
              Physical argument for symmetry: the equilibrium is a mutual
              resolution, so the constraint should be symmetric by
              construction. But this should be derived. See open_derivations.
      720_closure:
        derived_consequence: >
          IF preconditions (a)(b)(c) are verified THEN:
            Index(T) = dim(ker T) − dim(coker T) = 1 − 0 = 1
          Interpretation (when derived): the closure is non-degenerate
          and unique. The Fredholm index = 1 is then the concrete
          expression of CCR¹ = 1 — the reference unit condition —
          and connects to Tw = 1/2 via the CWF decomposition.
        derivation_chain: >
          Preconditions verified → Index(T) = 1
              → CCR¹ = 1 (reference unit condition confirmed)
              → Tw = 1/2 (from CWF: Lk = Wr + Tw, Lk=2, Wr=3/2)
              → Wr_eq = 3/2 and Tw = 1/2 both derived from operator theory
        current_status: "EXPECTED but not yet derived"
      360_truncation:
        derived_consequence: >
          IF T restricted to [0,2π] is verified to have no self-consistent
          solution (the phase mismatch π ≠ 2π) THEN:
            Index(T)|_{[0,2π]} = 0 or undefined
          Interpretation (when derived): incomplete closure, no stable
          resolution alone. Fredholm-level expression of confinement.
        current_status: "STRUCTURALLY PREDICTED from phase mismatch argument;
                         operator-level verification open"
    why_more_significant_in_vector_multispace: >
      The Fredholm index is the concrete level — it is what the closure
      condition IS, expressed as an operator on the multivector space.
      The gradient-axis coupling structure C[·] is the data that
      determines whether T is Fredholm (finite-dimensional kernel) and
      what its index is. Computing Index(T) for the electron closure
      directly gives Tw = 1/2 as a consequence (via the CWF decomposition)
      without requiring the abstract K-theory machinery.
    fredholm_condition: >
      T must be Fredholm: compact resolvent, finite-dimensional kernel and
      cokernel, spectral gap at the closure configuration. The logarithmic
      saturation term Λln(1+κ|ψ|²) is expected to open the spectral gap
      by bounding the operator norm — but this must be verified from the
      GP equilibrium (open: fredholm-condition-verification).

  k_theory_assembly_level:
    what_it_is: >
      The Baum-Connes assembly map µ applied to a family of Fredholm
      operators parameterized by configuration space. Abstract, classifies
      all closures at a given depth in terms of K-theory classes. Lives
      at the level of configuration space as a whole.
    operator_family: >
      {T_B : B ∈ configuration space} — a family of closure operators
      parameterized by the bivector configuration B. The K-theory class
      of this family in K₀(C*(configuration space)) is what µ maps to
      an analytic index.
    what_it_gives: >
      The assembly map µ gives the general CCR_n at depth n as a
      K-theory invariant. It classifies all possible closures at depth n
      and their CCR costs without computing each individually. More
      powerful for proving the depth recursion D_{n+1} = Fix(Φ_n(D_n))
      holds at all depths simultaneously.
    why_less_immediate: >
      The K-theory class requires the operator family to be well-behaved
      across all of configuration space, not just at the equilibrium.
      This is a stronger condition than Fredholm at a single point.
      For the specific computation of Tw = 1/2 and f_eq, the Fredholm
      level is sufficient and more tractable.

  relationship: >
    The Fredholm index of T at the equilibrium configuration is the
    evaluation of the K-theory class at that configuration. The assembly
    map is the machinery that gives the class; the Fredholm index is
    what you read off when you evaluate it. For the electron:

      K-theory class of {T_B} under µ → analytic index = CCR¹ = 1
      Evaluation at B = B* (electron equilibrium) → Index(T_{B*}) = 1

    Both give the same number. The Fredholm computation is the local
    version of what the assembly map computes globally.

  source: "fredholm-mapping-to-quantum-observables.md (additive integration block)"

ccr_as_hessian_functional_consequence:
  status: "STRUCTURAL HYPOTHESIS — the CCR at each depth is proposed as a
           functional invariant of the second-variation operator of the
           potential, not a point-local function of Hessian eigenvalues.
           This reading is more consistent with the framework's process-
           first pattern and connects to the Baum-Connes assembly map.
           The derivation from the existing ratio form (Wr·Ω_rotor)/Ω_embed
           is open."

  statement: >
    The CCR at depth n is not a function of eigenvalues evaluated at a
    single equilibrium configuration. It is a functional invariant of the
    Hessian as a functional — the second-variation operator of the
    potential, whose spectrum and index are intrinsic to the potential's
    second-order structure across configuration space.

  point_vs_functional:
    point_reading:
      object: "H[B*] — a matrix at the equilibrium"
      output: "Eigenvalues λ_1, ..., λ_n at B*"
      ccr: "f(λ_1, ..., λ_n) — some function of the point values"
      problem: >
        The function f is not determined. It becomes a fitting choice
        (pick f to match CCR). The reading is derivative-level — it
        treats a snapshot as if it were the structure.
    functional_reading:
      object: "H[·] — an operator-valued functional over configuration space"
      output: "Spectrum, index, and spectral flow of H across the configuration space"
      ccr: "A specific functional invariant of H[·], evaluated at depth n"
      advantage: >
        The invariant is intrinsic. It does not need f to be chosen; it
        is what the second-variation operator's structure supplies when
        projected through the assembly map.

  which_invariant:
    statement: >
      The natural candidates for the CCR invariant of a self-adjoint
      operator functional are:
        - Index of H[·] (for operators with positive and negative spectra)
        - Spectral flow across configuration space
        - Determinant line bundle and its holonomy
        - Resolvent trace evaluated along the closure path
      The framework's Baum-Connes assembly-map reading suggests the
      index is the correct one: the assembly map takes the K-theory
      class of an operator family to the analytic side, and the CCR
      is what that index evaluates to at depth n.

  connection_to_assembly_map:
    statement: >
      The coupling functional C[·] is a family of self-adjoint operators
      parameterized by configuration space. Its K-theory class is well-
      defined under standard Fredholm conditions (bounded, compact resolvent,
      spectral gap). The Baum-Connes assembly map μ takes this class to
      the analytic side, where its index is an integer or a rational.

      For the specific electron closure computation, the Fredholm index of
      T = ∇(·)Ie₃ − μ(·) at B* is more tractable than the full assembly
      map — see §3b (fredholm_vs_assembly_map). The assembly map is the
      general framework; the Fredholm index is its concrete evaluation.

      The CCR at depth n is the index of C[·] under μ, evaluated on the
      depth-n configuration space:

        CCR^n = μ([H[·]|_{D_n}])

      Under this reading, the CCR is not a ratio of geometric quantities
      imposed on configurations. It is the index of the second-variation
      operator's K-theory class — which is why it is depth-indexed, and
      why it emerges from the potential's second-order structure.

  relationship_to_prior_form:
    statement: >
      The existing ratio form (Wr·Ω_rotor)/Ω_embed is not being replaced.
      It is being identified. The claim is that the ratio, evaluated at
      the depth-n equilibrium, equals the index of the Hessian functional
      at that depth. The ratio is what CCR has been computing numerically;
      the index is what it has been computing structurally. The derivation
      target is to show the equality.
    derivation_target: >
      Show that (Wr·Ω_rotor)/Ω_embed at depth n equals μ([H[·]|_{D_n}]).
      For the electron: show that 1 (or α) equals the index of the
      second-variation operator on the single-plane configuration.
      For the proton: show that CCR_binding equals the index on the
      three-plane configuration.

  why_this_resolves_the_f_choice:
    statement: >
      Under the point reading, the function f was a free choice. Under
      the functional reading, f is determined: it is the index map. There
      is no "which f" question — there is only "is the index reading
      correct?" which is a binary structural claim.

  what_would_confirm:
    - "The index of H[·] on the single-plane configuration equals the
       existing CCR¹ (electron's value)."
    - "The index on the three-plane configuration equals CCR² (proton's
       CCR_binding)."
    - "The depth-indexing of the CCR follows from the depth-indexing of
       the configuration spaces on which H[·] is evaluated."

  what_would_falsify:
    - "The index is identically 0 or trivial on the relevant configuration
       spaces — no CCR-like invariant emerges from the assembly map."
    - "The index is the same at every depth — no depth-indexing follows
       from the functional structure."
    - "The index depends on the specific basis choice rather than on the
       intrinsic K-theory class — no basis-independent invariant exists."

  open:
    - "Explicit construction of H[·] as an operator functional from the
       potential I_CCR."
    - "Verification of the Fredholm and gap conditions required for
       K-theory classification."
    - "Computation of the index at depth 1 (electron) and comparison
       with CCR¹ = 1."
    - "Computation of the index at depth 2 (proton) and comparison
       with CCR² = CCR_binding."

  cross_references:
    - file: "core/process-physics/baum-connes-assembly-map-correspondence.yaml"
      note: "The assembly map μ is the tool that takes the K-theory class
             of H[·] to the analytic side; the CCR is the index under μ."
    - file: "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
      note: "The second-order term is the Hessian functional's quadratic
             form; the intermediate-axis instability is a spectral
             property of H[·]."
    - file: "core/process-physics/euler-to-cl30-translation.yaml"
      note: "Off-diagonal inertia is the matrix representation of H[·]
             in a specific basis; the functional reading generalizes."

