# ─────────────────────────────────────────────
# §6  EPISTEMIC STATUS
# ─────────────────────────────────────────────

epistemic_status:

  established:
    - "The closure condition ⟨G⟩₂ = 0 can be expanded in multivector derivatives."
    - "Order 2 (quadratic) and order 3 (cubic) carry the Dzhanibekov instability and geometric phase, as in dzhanibekov-as-moebius-integration.yaml."
    - "Mixed cross-derivatives of the potential functional are the framework's off-diagonal inertia."
    - "The classical inertia tensor has the same structure: diagonal entries (moments) and off-diagonal entries (products)."

  structural_hypothesis:
    - "Coupling between bivector planes is the source of the mutual-reference structure (algebraic form of intrinsic-reference-spin-momentum.yaml)."
    - "The CCR at each depth is a function of the Hessian eigenvalues at that depth."
    - "The intermediate-axis instability follows from the ordering of eigenvalues."

  derivation_target:
    - "Show that (Wr·Ω_rotor)/Ω_embed equals a specific function of the Hessian eigenvalues."
    - "Extend the identification to the three-plane proton case and to higher depths."

  open:
    - id: "gradient-axis-coupling-symmetry-at-equilibrium"
      description: >
        Determine whether the gradient-axis coupling C_ij is symmetric at
        the equilibrium configuration B*: does C_ij = C_ji hold?
        Symmetry would imply the closure operator T is self-adjoint at B*,
        which simplifies the Fredholm index calculation (coker T = ker T
        for self-adjoint Fredholm operators, so Index(T) = 0 always for
        self-adjoint T — meaning T must be non-self-adjoint for Index(T)=1).
        Asymmetry (C_ij ≠ C_ji) means T is not self-adjoint at B*, which
        is required for the index to be non-zero. Physical argument: the
        equilibrium is a mutual resolution of gradient-axis tensions; the
        constraint that axis i places on axis j should equal the constraint
        j places on i by the symmetry of mutual resolution. But if this
        implies self-adjointness and hence Index(T) = 0, the argument
        breaks the Fredholm derivation. Resolution: either (a) the coupling
        is asymmetric at equilibrium (breaking the naive symmetry argument),
        or (b) the correct operator is not T but a non-self-adjoint
        modification, or (c) the index is computed differently.
        This must be resolved before the Fredholm derivation is complete.
      depends_on: ["GP equilibrium shape B*", "gradient_axis_coupling §2"]
      priority: 1
      note: >
        This open item may be the most important one: if T is self-adjoint,
        Index(T) = 0 and the Fredholm derivation of CCR¹ = 1 fails. The
        non-self-adjoint character of T (from the R(ψ) term in the master
        equation — already flagged in dirac-as-grade-chain-closure.yaml
        as "non-Hermitian") may be exactly what resolves this. The
        closure operator T = ∇(·)Ie₃ − μ(·) is non-self-adjoint because
        Ie₃ is not Hermitian in the standard sense — it is a chiral
        projection. The coupling C_ij is then generically asymmetric, and
        the Fredholm index is well-defined and non-zero.

    - id: "fredholm-condition-verification"
      description: >
        Verify that the closure operator T = ∇(·)Ie₃ − μ(·) is Fredholm
        at the electron equilibrium configuration B*. Requires: compact
        resolvent (no continuous spectrum at zero), finite-dimensional kernel
        (unique stable solution), spectral gap (logarithmic saturation term
        Λln(1+κ|ψ|²) opens the gap). The Fredholm index = 1 for the 720°
        closure must be confirmed before it can be used as the concrete
        derivation of Index(T) = CCR¹ = 1.
      depends_on: ["SIM-004-v2", "GP equilibrium shape"]
      priority: 1
    - "Fredholm condition for the coupling functional C[·]: the Baum-Connes assembly
