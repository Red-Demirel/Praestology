# /core/process-physics/mixed-order-perturbation-scaffold.yaml
name: "Mixed-Order Perturbation Scaffold: Multi-Rotor Coupling, Off-Diagonal
       Inertia, and CCR as Hessian Consequence"
version: "0.2"
status: "STRUCTURAL SPECIFICATION — expands the closure condition in mixed
         multivector derivatives; identifies off-diagonal inertia as the
         mutual-reference source; proposes CCR-n as a function of the
         Hessian eigenvalues at each depth. The CCR-as-consequence claim is
         a structural hypothesis with a specific derivation target."
domain: "Core / Process-Physics"

dependency_map:
  requires:
    - "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
    - "core/process-physics/bivector-partial-parameters.yaml"
    - "core/process-physics/relational-effects-extra-dof.yaml"
    - "core/process-physics/intrinsic-reference-spin-momentum.yaml"
    - "core/process-physics/euler-to-cl30-translation.yaml"
  provides_to:
    - target: "core/process-physics/iterative-depth-hierarchy.yaml"
      via: "Hessian eigenvalue structure as the CCR-n determinant at each depth"
    - target: "core/closure-configuration-ratio.yaml"
      via: "CCR as a consequence of the mixed-derivative potential structure"

---

# ─────────────────────────────────────────────
# §1  OPERATOR EXPANSION OF THE CLOSURE CONDITION
# ─────────────────────────────────────────────

operator_expansion:
  statement: >
    The closure condition ⟨G⟩₂|_closure = 0 is expanded around an equilibrium
    bivector configuration B* using the multivector differential operator
    ∂_B. The total configuration response is a mixed-order accumulative
    where each order governs a distinct physical behavior.

  multivector_series: |
    ⟨G⟩₂ (B* + δB) = ⟨G⟩₂|_B*
                      + (δB · ∂_B) ⟨G⟩₂|_B*
                      + ½! (δB · ∂_B)² ⟨G⟩₂|_B*
                      + ⅙! (δB · ∂_B)³ ⟨G⟩₂|_B*
                      + ... + 1/n! (δB · ∂_B)ⁿ ⟨G⟩₂|_B* = 0

  order_role_mapping:
    n_1_linear:
      order: 1
      operator: "(δB · ∂_B)"
      physics: "Neutral linear oscillation around the intermediate-plane equilibrium."
    n_2_quadratic:
      order: 2
      operator: "½! (δB · ∂_B)²"
      physics: "Intermediate-axis Dzhanibekov instability; supplies the c₂ coefficient (shape-functional of the equilibrium) driving Tw = 1/2 integration."
    n_3_cubic:
      order: 3
      operator: "⅙! (δB · ∂_B)³"
      physics: "Geometric phase accumulation; distinguishes π (single-plane unclosed) from 2π (720° Möbius closure)."
    n_cross_mixed:
      order: "n ≥ 2 (mixed cross-partials)"
      operator: "∂² / (∂B_i ∂B_j) and higher cross-derivatives"
      physics: "Inter-plane coupling. Off-diagonal inertia. Source of the relational reference structure."

---

# ─────────────────────────────────────────────
# §2  MIXED CROSS-DERIVATIVES AS OFF-DIAGONAL INERTIA
# ─────────────────────────────────────────────

off_diagonal_inertia:
  statement: >
    The mixed cross-derivatives of the potential functional are the
    framework's off-diagonal inertia. In classical rigid-body mechanics,
    the inertia tensor I_ij has diagonal entries (intrinsic moments) and
    off-diagonal entries (products of inertia) measuring how rotation
    about one axis drags another along. The framework's CCR cost functional
    I_CCR plays the same role on bivector activation space; its mixed
    second derivatives are the off-diagonal coupling elements.

  formal_identification: |
    I_CCR[B] — potential functional on bivector activation configurations
    H_ij = ∂² I_CCR / (∂B_i ∂B_j) |_B*  — Hessian at equilibrium

    Diagonal H_ii  — intrinsic cost of activating plane i alone
    Off-diagonal H_ij (i ≠ j) — coupling cost between planes i and j
    Eigenvalues λ_1, ..., λ_n — principal coupling strengths along eigenvectors

  what_this_replaces:
    prior_sketch: >
      The earlier draft proposed a new object "S_rel = Grade_2(∂²⟨G⟩₂/(∂B₁∂B₂))"
      called an "anchor tensor." This was underspecified — the grade-2
      projection was not derived.
    corrected_identification: >
      The mixed cross-derivative is the off-diagonal inertia element of
      the potential functional. It is a familiar object with an established
      interpretation, not a new tensor. The "reference" it provides is the
      classical mechanical coupling effect: rotation about one plane
      imposes a constraint on the other, and this constraint is what
      supplies the mutual reference that neither plane alone can define.

  coupling_as_phase_space_restriction:
    statement: >
      Coupling between bivector planes does not "break a symmetry." It
      restricts the phase space available to each plane individually.
      The restriction is what allows an internal reference to be defined:
      neither plane can rotate independently of the other, and the
      constraint provides a "which way" that neither plane alone could
      provide.
    uncoupled_case: >
      Off-diagonal H_ij = 0. No mutual constraint. Each plane rotates
      independently; no shared reference. Photon-like: phase rate
      present, chirality sense reference-free.
    coupled_case: >
      Off-diagonal H_ij ≠ 0. Planes are mutually constrained. A
      joint reference is established by the coupling eigenstructure.
      Electron-like: phase rate and chirality sense both internally
      referenced.

  connection_to_intrinsic_reference:
    statement: >
      This is the algebraic form of the mutual-reference reading in
      intrinsic-reference-spin-momentum.yaml. The off-diagonal inertia
      is what provides the reciprocal reference between directional
      (grade-1) and orientational (grade-2) character. The coupled
      eigenstructure of the Hessian is the shared frame.

