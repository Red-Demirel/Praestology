# ─────────────────────────────────────────────
# §4  DEPTH INDEXING — NOTATION CLARIFICATION
# ─────────────────────────────────────────────

depth_indexing:
  statement: >
    The earlier draft used "depth_1_single_plane", "depth_2_two_plane",
    "depth_3_three_plane_proton" — a numbering by plane count, which
    collides with the cascade document's NCH depth indexing (D₁ = rotor,
    D₂ = pseudoscalar/proton). The collision was confusing.

  cascade_document_indexing:
    d_1: "Rotor level — electron / photon — one bivector plane"
    d_2: "Pseudoscalar level — proton / neutron — three orthogonal bivector planes"
    d_3: "S⁷ embedding — nuclei — higher-dimensional configurations"

  hessian_dimension_indexing:
    hessian_1: "One active plane. Corresponds to cascade D₁ (electron)."
    hessian_2: "Two active planes. A configuration that the cascade does not
                name as a separate depth — could be the electron's internal
                rotor-pair coupling, or a meson-like configuration, or an
                intermediate S⁷ state. Needs clarification."
    hessian_3: "Three active planes. Corresponds to cascade D₂ (proton)."

  recommendation: >
    Use "hessian_dim = k" for the plane-count indexing to avoid collision
    with "D_n" (cascade depth). Two-plane configurations need to be
    identified as either the electron's internal coupling (hessian_dim = 2
    inside the electron's structure) or a distinct configuration the
    cascade has not yet named.

---

# ─────────────────────────────────────────────
# §5  OPEN DERIVATIONS
# ─────────────────────────────────────────────

open_derivations:

  priority_1:
    - id: "hessian-of-ccr-at-equilibrium"
      description: >
        Compute the Hessian of I_CCR at the electron equilibrium (B*) from
        the GP solve or equivalent. Extract the eigenvalue λ₁^electron.
      depends_on: ["SIM-004-v2", "ccr-electron-explicit"]
      priority: 1

    - id: "ccr-form-from-eigenvalues-electron"
      description: >
        Identify which function f₁ of λ₁^electron recovers the existing
        CCR form (Wr·Ω_rotor)/Ω_embed at the electron. If a natural
        function exists, the CCR-as-consequence hypothesis is supported
        at the electron level.
      depends_on: ["hessian-of-ccr-at-equilibrium"]
      priority: 1

    - id: "three-plane-hessian-structure"
      description: >
        Compute the 3×3 Hessian for the proton's three orthogonal planes.
        Determine the ordering of eigenvalues (which is intermediate) and
        whether the off-diagonal structure matches the mutual-reference
        predictions.
      depends_on: ["SIM-005-v2", "mass-as-plane-independence.yaml"]
      priority: 1

  priority_2:
    - id: "ccr-binding-from-three-plane-eigenvalues"
      description: >
        Show that CCR² (the proton's binding CCR) equals a specific function
        of the three-plane Hessian eigenvalues. Recovers the CCR_binding
        from closure-types-nesting.yaml as a derived quantity.
      depends_on: ["three-plane-hessian-structure"]
      priority: 2

    - id: "intermediate-axis-as-middle-eigenvalue"
      description: >
        Show that the Dzhanibekov intermediate axis is the middle eigenvalue
        of the Hessian, and that the second-order instability follows from
        the eigenvalue ordering.
      depends_on: ["three-plane-hessian-structure"]
      priority: 2

    - id: "two-plane-configuration-identification"
      description: >
        Clarify what hessian_dim = 2 corresponds to. Options: the electron's
        internal rotor-pair coupling, a meson-like configuration, or an
        intermediate S⁷ state. The identification affects the higher-depth
        predictions.
      priority: 2

  priority_3:
    - id: "ccr-family-from-hessian-eigenvalue-functions"
      description: >
        Extend the CCR-as-consequence reading across the full depth
        hierarchy: CCR⁰ = φ⁻¹, CCR¹ = α, CCR² = CCR_binding. Determine
        whether all three are eigenvalue functions of the depth-appropriate
        Hessian, and whether φ⁻¹ arises as the 0-dimensional case (the
        scalar-potential Hessian at D₋₁ → D₀).
      depends_on: ["ccr-form-from-eigenvalues-electron",
                   "ccr-binding-from-three-plane-eigenvalues",
                   "core/d-minus-one-pre-vector-level.yaml"]
      priority: 3

---

# ─────────────────────────────────────────────
# §6  EPISTEMIC STATUS
# ─────────────────────────────────────────────

epistemic_status:

  established:
    - "The closure condition ⟨G⟩₂ = 0 can be expanded in multivector derivatives."
    - "Order 2 (quadratic) and order 3 (cubic) carry the Dzhanibekov instability and geometric phase, as in dzhanibekov-as-moebius-integration.yaml."
    - "Mixed cross-derivatives of the potential functional are the framework's off-diagonal inertia."
    - "The classical inertia tensor has the same structure: diagonal entries (moments) and off-diagonal entries (products)."

  structural_hypothesis:
    - "Coupling between bivector planes is the source of the mutual-reference structure (algebraic form of intrinsic-reference-spin-momentum.yaml)."
    - "The CCR at each depth is a function of the Hessian eigenvalues at that depth."
    - "The intermediate-axis instability follows from the ordering of eigenvalues."

  derivation_target:
    - "Show that (Wr·Ω_rotor)/Ω_embed equals a specific function of the Hessian eigenvalues."
    - "Extend the identification to the three-plane proton case and to higher depths."

  open:
    - "Fredholm condition for the Hessian functional: the Baum-Connes assembly
       map requires H[·] to be Fredholm (compact resolvent, spectral gap at the
       closure configuration). The logarithmic saturation term Λln(1+κ|ψ|²)
       softens the spectrum but whether it opens a sufficient spectral gap is
       unverified. Must be checked before the index reading is valid."
    - "Explicit Hessian at the electron equilibrium." 
    - "Correct eigenvalue function f₁ (or f_n at higher depths)."
    - "Identification of the two-plane configuration."
    - "Whether CCR⁰ = φ⁻¹ emerges as the 0-dimensional (scalar) case of the same structure."

