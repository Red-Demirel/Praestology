open_derivations:

  priority_1:
    - id: "hessian-of-ccr-at-equilibrium"
      description: >
        Compute the Hessian of I_CCR at the electron equilibrium (B*) from
        the GP solve or equivalent. Extract the eigenvalue λ₁^electron.
      depends_on: ["SIM-004-v2", "ccr-electron-explicit"]
      priority: 1

    - id: "ccr-form-from-eigenvalues-electron"
      description: >
        Identify which function f₁ of λ₁^electron recovers the existing
        CCR form (Wr·Ω_rotor)/Ω_embed at the electron. If a natural
        function exists, the CCR-as-consequence hypothesis is supported
        at the electron level.
      depends_on: ["hessian-of-ccr-at-equilibrium"]
      priority: 1

    - id: "three-plane-hessian-structure"
      description: >
        Compute the 3×3 Hessian for the proton's three orthogonal planes.
        Determine the ordering of eigenvalues (which is intermediate) and
        whether the off-diagonal structure matches the mutual-reference
        predictions.
      depends_on: ["SIM-005-v2", "mass-as-plane-independence.yaml"]
      priority: 1

  priority_2:
    - id: "ccr-binding-from-three-plane-eigenvalues"
      description: >
        Show that CCR² (the proton's binding CCR) equals a specific function
        of the three-plane Hessian eigenvalues. Recovers the CCR_binding
        from closure-types-nesting.yaml as a derived quantity.
      depends_on: ["three-plane-hessian-structure"]
      priority: 2

    - id: "intermediate-axis-as-middle-eigenvalue"
      description: >
        Show that the Dzhanibekov intermediate axis is the middle eigenvalue
        of the Hessian, and that the second-order instability follows from
        the eigenvalue ordering.
      depends_on: ["three-plane-hessian-structure"]
      priority: 2

    - id: "two-plane-configuration-identification"
      description: >
        Clarify what hessian_dim = 2 corresponds to. Options: the electron's
        internal rotor-pair coupling, a meson-like configuration, or an
        intermediate S⁷ state. The identification affects the higher-depth
        predictions.
      priority: 2

  priority_3:
    - id: "ccr-family-from-hessian-eigenvalue-functions"
      description: >
        Extend the CCR-as-consequence reading across the full depth
        hierarchy: CCR⁰ = φ⁻¹, CCR¹ = α, CCR² = CCR_binding. Determine
        whether all three are eigenvalue functions of the depth-appropriate
        Hessian, and whether φ⁻¹ arises as the 0-dimensional case (the
        scalar-potential Hessian at D₋₁ → D₀).
      depends_on: ["ccr-form-from-eigenvalues-electron",
                   "ccr-binding-from-three-plane-eigenvalues",
                   "core/d-minus-one-pre-vector-level.yaml"]
      priority: 3

