level_4_mass_lock:
  description: "CCR = 1: 720° spinorial mass-lock, R5 committed"
  rotor_equation: >
    ψ(t) = √ρ · R_locked(t) · exp(Iβ/2)
    where I = e₁e₂e₃ (Cl(3,0) pseudoscalar), β is the
    Yvon-Takabayashi angle (closure progress indicator,
    vector-stress-mapping.yaml #beta_angle_significance),
    and R_locked(θ) = exp(-θ/2 · B̂_spin) with θ(t) = ∫₀ᵗ ω_z dt'
  boundary_conditions:
    at_2pi: >
      R_locked(2π) = exp(-π B̂_spin) = -1  →  ψ(2π) = -ψ(0)
      State is phase-flipped. Spatial loop complete but internal
      spinor carries negative topological sign — prevents spatial decay.
      This is why the electron does not spontaneously collapse:
      the 360° sign flip creates a topological barrier requiring
      a full 720° traversal for self-identity.
    at_4pi: >
      R_locked(4π) = exp(-2π B̂_spin) = +1  →  ψ(4π) = +ψ(0)
      → Q* = R_k[Q*]: exact self-identity achieved.
      The 720° Möbius loop closes completely. R5 lock fires —
      this is the commitment event. The configuration has found
      a fixed point of its own reconfiguration operator and
      commits permanently to η.
  significance: >
    The 2π sign flip is not a postulate — it is what exp(-π B̂_spin)
    computes in Cl(3,0). The 720° requirement for self-identity is the
    double-cover property of rotors in Cl(3,0), derived from the algebra.
    Spin-½ falls out of the closure condition.

