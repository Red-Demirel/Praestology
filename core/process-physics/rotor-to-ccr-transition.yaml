    threshold condition. Not a fitted parameter — derived from the
    720° boundary condition Q* = R_k[Q*] (see level_4_mass_lock below).
  partial_closure_of_ccr_electron_explicit: >
    This establishes the threshold value CCR_crit = 1 and the capacity
    scale r₀ = ħ/mc from first principles. This partially closes the
    ccr-electron-explicit open derivation (issue_10,
