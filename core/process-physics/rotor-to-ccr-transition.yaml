    CCR_crit = 1.  Transition occurs when the Compton wavelength equals
    2π times the closure radius: λ_Compton = 2πr₀, i.e. r₀ = ħ/mc
    (the reduced Compton wavelength).
  key_prediction: >
    The closure radius r₀ = ħ/mc is the reduced Compton wavelength —
    the scale at which QFT becomes non-perturbative and classical
    mechanics breaks down. This identification connects the quantum scale
