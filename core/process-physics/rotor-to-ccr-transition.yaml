level_2_open_wave:
  description: "Open, propagating bivector wave — CCR < CCR_crit"
  rotor_equation: >
    R_open(x,t) = exp(-½ B(ωt - kx))
                = cos((ωt-kx)/2) - B̂·sin((ωt-kx)/2)
    where B = e₁∧e₂ is the propagation bivector plane in Cl(3,0)
  phase_trajectory: >
    Continuous phase advance along spatial path x. The wave does not
    loop back on itself; topological self-interaction is zero:
    ∮_space R_open dx = 0 → CCR < CCR_crit
  mass_condition: >
    Rest mass = 0: phase generator carries linear momentum P = ħk
    without a localised fixed point. No self-referential closure.
  wavelength_reading: >
    Wavelength is spatial capacity: how far the committed medium advances
    between phase cycles. λ = c/f = structural unit / phase cycles per
    Π_eff unit. Not a spacetime interval in a pre-given manifold — a
    measure of local processing capacity per phase cycle.

