---

# ─────────────────────────────────────────────
# §1  THE REFERENCE PROBLEM
# ─────────────────────────────────────────────
reference_problem:

  statement: >
    Both momentum (directional / translational character) and spin
    (orientational / chiral character) require a reference in order to
    be physically meaningful. Absolute momentum without a frame is
    empty; absolute spin without an axis or orientational relation is
    likewise empty.

  momentum:
    algebraic_home: "Primarily grade-1 (vector) character"
    reference_need: "A direction is only defined relative to other directions or to an orientational structure."

  spin_chirality:
    algebraic_home: "Primarily grade-2 (bivector / rotor) character"
    reference_need: "An oriented rotation is only defined relative to a reference direction or plane."

  consequence: >
    Treating either quantity as fully intrinsic and reference-free
    introduces a hidden absolute structure that the relational ontology
    does not permit.

---

# ─────────────────────────────────────────────
# §2  MUTUAL REFERENCE AS SOLUTION
# ─────────────────────────────────────────────
mutual_reference:

  statement: >
    Directional character (momentum / grade-1) and orientational character
    (spin / chirality / grade-2) can serve as reciprocal references for
    each other. Each supplies what the other lacks, producing a closed
    reference structure that does not rely on an external absolute frame.

  mechanism:
    - "Grade-1 supplies a reference direction against which grade-2 orientation is defined."
    - "Grade-2 supplies an oriented rotational sense that acts back on the grade-1 direction."
    - "The two are no longer independent assignments; they form a coupled reference pair."

  intrinsic_character: >
    Once the mutual reference is in place, the combined structure carries
    its own orientational and directional meaning. The reference is
    intrinsic to the coupled system rather than imposed from outside.

---

# ─────────────────────────────────────────────
# §3  TOPOLOGICAL CONSEQUENCE: MÖBIUS / DOUBLE COVER
# ─────────────────────────────────────────────
moebius_consequence:

  statement: >
    The consistent closure of a system in which direction and orientation
    serve as mutual references is double-valued. A single 360° cycle
    reverses the relative reference; a full 720° cycle is required to
    restore the original mutual configuration. This is the Möbius /
    spinor double-cover character.

  algebraic_expression: >
    In Cl(3,0) the rotor group double-covers the rotation group:
    a rotor R and its negative −R generate the same rotation on vectors,
    yet they are distinct as orientation references. The mutual
    grade-1 / grade-2 reference makes this double-valuedness physically
    obligatory rather than optional.

  process_reading: >
    A stable, directed, chiral anchoring must close under its own
    mutual reference. The only topological closure that satisfies
    this requirement without external orientation data is the
    Möbius-type (720°) closure.

  status: "STRUCTURAL — follows from the mutual-reference requirement once grade-1 and grade-2 are coupled"

---

