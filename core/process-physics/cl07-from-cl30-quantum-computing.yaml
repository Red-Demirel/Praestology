  scope: >
    This file addresses operations on committed or near-committed rotor
    configurations in η — the derivative regime. Quantum computing exploits
    R3 superposition (pre-commitment coherence) on committed physical or
    biological substrates (R5/η structures). The algebra of this boundary
    regime is Cl(0,7), derived from Cl(3,0) via the qubit correspondence
