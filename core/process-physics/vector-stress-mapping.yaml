grade_differentiation_as_first_stress:
  grade_0:
    state: "R1 pure potential — full multivector, no grade preferred"
    stress: "Zero — maximum orientational freedom"
  grade_1:
    state: "First distinction — directed potential, one grade stabilised"
    stress: "Primordial — freedom differential between stabilised grade
             and surrounding open potential"
  grade_2:
    state: "Oriented rotation plane — restricted but not saturated"
    stress: "Intermediate — residual freedom inside grade still open"
  rotor:
    state: "Stable spinning configuration — maximum commitment at grade-2"
    stress: "High — stable source of restriction for surrounding field;
             CCR cost is the quantitative measure"
  grade_3:
    state: "Full 3D committed volume — R5 closure complete"
    stress: "Maximum inward — self-dual (I²=-1 in Cl(3,0)); no external
             grade components remaining; neighbour coupling via ∇s only"

