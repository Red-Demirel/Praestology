                          in the Madelung decomposition"
      ccr_component: "Grade-1 output of Madelung decomposition; direction
                       of commitment density flow"

    - hestenes_observable: "Spin bivector S (STA)"
      cl30_expression: "S = ψ(e₁∧e₂)ψ̃/2 — grade-2 projection"
      framework_reading: "Committed rotation plane — the locked bivector
                          orientation of the rotor configuration"
