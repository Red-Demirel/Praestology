gauge_theory_as_description:
  statement: >
    Gauge theory describes the residual freedom remaining after grade
    closures and the stress produced by its spatial variation. A derivative-
    level language that correctly captures the effects without identifying
    their origin. Each gauge group is the symmetry group of the residual
    freedom at the corresponding closure depth.

  correspondence_table:
    - gauge_term: "Gauge potential A"
      framework_reading: "Residual orientational freedom surviving after
                           grade closure — what has not been restricted"
      direction_note: "A is not fundamental — derivative-level description
                        of what the closure left open"

    - gauge_term: "Field strength F = dA + A∧A"
      framework_reading: "Stress produced by spatial variation of residual
                           freedom — bivector gradient ⟨G⟩₂ from
                           ga-dynamic-theory.yaml"
      direction_note: "F correctly describes the stress pattern; does not
                        explain why the stress exists"

    - gauge_term: "U(1) symmetry"
      framework_reading: "Residual phase rotation freedom after grade-2
                           rotor phase-locking (EM commitment depth)"
      coupling: "α = CCR of the phase-locked rotor"

    - gauge_term: "SU(2) symmetry"
      framework_reading: "Residual orientation freedom — two remaining
                           orientation degrees after topology-switching closure"
      coupling: "CCR of the topology-switching transition — open"

    - gauge_term: "SU(3) symmetry"
      framework_reading: "Residual colour freedom — three orientation degrees
                           before full pseudoscalar commitment"
      coupling: "CCR of three-fold binding — open"

    - gauge_term: "Coupling constants (g, g', g_s)"
      framework_reading: "CCR ratios at each closure depth"
      direction_note: "Not free parameters — CCR instances at successive
                        closure depths"

