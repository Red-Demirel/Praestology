---

sr_bridging:
  statement: >
    Cl(3,0) has no timelike basis vector. Special relativity requires
    Lorentz invariance — physics unchanged under boosts. The apparent
    conflict is a bridging issue, not a missing parameter. Time in this
    framework is not a geometric direction in the algebra; it is the
    accumulated count of R5 closure events weighted by local process rate
    (t = ∫Π_eff dτ, gp-as-derivative-layer.yaml #t_emergence).

  lorentz_boosts_in_cl30: >
    In Cl(3,1) (spacetime algebra, Hestenes), Lorentz boosts are rotations
    into the timelike direction γ₀. In Cl(3,0), there is no γ₀ — boosts
    correspond instead to changes in the local Π_eff profile:
      A stationary observer accumulates t at rate Π_eff(local).
      A boosted observer accumulates t at a different rate — their local
      Π_eff is modified by the relative velocity (kinematic Π_eff
      suppression, distinct from gravitational Π_eff suppression from η
      density, same mechanism).
    Time dilation under a boost is the boosted frame's suppressed R5
    cycle rate relative to the stationary frame — the same inside-out
    channeling mechanism as gravitational time dilation
    (gravity-inertia-equivalence-from-r5.yaml), driven by relative
    velocity rather than by η density.

  hestenes_sta_to_cl30_substitution:
    statement: >
      Hestenes uses Cl(3,1) with timelike basis vector γ₀. The
      substitution to Cl(3,0) is:
        γ₀ → Π_eff · e_τ
      where e_τ is the intrinsic time direction — the direction of
      t = ∫Π_eff dτ accumulation. The Π_eff factor encodes the
      local process rate that γ₀ encodes as a fixed unit vector in
      Cl(3,1). Under this substitution:
        γ₀ψγ₀ (STA reversal) → Π_eff·e_τ·ψ·Π_eff·e_τ
        The Π_eff² factor encodes local time-rate — consistent with
        g₀₀ ∝ Π_eff² from emergent-classical-fields.yaml #gravity_emergence
    status: >
      Substitution stated from structural consistency. Formal derivation
      showing all Cl(3,1) Hestenes observables transform correctly under
      this substitution is open — see sta-to-cl30-substitution-formal
      (open_derivations below).
    why_not_a_problem: >
      SR is not violated because Lorentz invariance in Cl(3,0) is
      the statement that physics is independent of which Cl(3,0) frame
      you use — the three spatial directions are symmetric. The time
      direction is not a fourth spatial direction but the intrinsic
      rate variable Π_eff. Lorentz boosts change the Π_eff profile;
      spatial rotations are already handled by Cl(3,0) rotors. The
      full Lorentz group SO(3,1) acts on the (three spatial) × (one
      process-rate) structure, which is exactly what Cl(3,0) × Π_eff
      provides.

---

core_principle:
  statement: >
    Vectors and higher-grade elements, together with the degree to which
    they are locked (closed), are the elementary sources of local
    restriction — stress — in the Praesto field. What Hestenes and Dirac
    treat as energy, mass, and spin, and what Yang-Mills treats as gauge
    field strength, are derivative-level descriptions of that stress and
    of the residual freedom remaining after partial or full grade closure.
    The process generates the appearance of gauge symmetry; gauge symmetry
    does not generate the process.
  direction: >
    R1–R5 process → grade closures → freedom differentials →
    stress gradients → residual symmetries → gauge theory description.
    Never the reverse.

