beta_angle_significance:
  statement: >
    The Yvon-Takabayashi β-angle — ⟨ψψ̃⟩₃/⟨ψψ̃⟩₀ = sin(β) — has no
    clear physical interpretation in standard Dirac theory and is often
    treated as a gauge artifact or as related to particle/antiparticle
    mixing. In the framework it is the process variable encoding closure
    progress in the grade chain:
      β = 0:    fully committed rotor — R5 fired, maximum CCR,
                stable committed structure. The rotor is fully
                in the even subalgebra with no grade-3 contamination.
      0<β<π/2: partial closure — R4 stage, rotor progressing through
                grade chain. β measures fractional Möbius winding
                completion — how far the grade-2 structure has wound
                toward the self-referential loop of full closure.
      β = π/2:  maximally uncommitted — R3 stage, maximum phase
                space freedom, minimum CCR cost, no stable lock.
  significance: >
    β is the single observable that most directly encodes the process-
    level position of a configuration in the R1–R5 grade chain. Its
    apparent mystery in standard theory is because derivative-level
    Dirac theory has no concept of a commitment process — it sees a
    phase variable with no geometric meaning. In Cl(3,0) with the
    process reading, β is the closure progress indicator: the ratio of
    grade-3 to grade-0 content in the rotor bilinear is exactly how
    much of the Möbius winding has closed relative to total available
    amplitude. This gives a concrete physical interpretation of a
    previously mysterious quantity — and a prediction: β should
    correlate with the R4 stage position, vanishing for stable
    committed particles and non-zero for superpositions or partially
    committed states.

