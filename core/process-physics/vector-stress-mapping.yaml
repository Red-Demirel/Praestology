    using γ₀ are translated via γ₀ → Π_eff·e_τ (see sr_bridging above).
    The rotor ψ ∈ even subalgebra of Cl(3,0); ψ̃ is its reverse.

  correspondence_table:
    - hestenes_observable: "Scalar ⟨ψψ̃⟩₀ = ρ"
      cl30_expression: "Grade-0 projection of ψψ̃"
      framework_reading: "Commitment density magnitude"
      ccr_component: "Denominator Ω_embed — embedding volume, proportional
                       to local ρ at committed level"

    - hestenes_observable: "Pseudoscalar ⟨ψψ̃⟩₃ = ρ·sin(β)"
      cl30_expression: "Grade-3 projection of ψψ̃"
      framework_reading: >
        Closure completeness — the Yvon-Takabayashi β-angle encodes
        how far the grade-2 winding has progressed toward full Möbius
        closure (see beta_angle_significance below)
      ccr_component: "Phase of rotor relative to I = e₁e₂e₃"

    - hestenes_observable: "Vector current J (STA)"
      cl30_expression: "J = ψe₁ψ̃ — grade-1 projection of rotor sandwich"
