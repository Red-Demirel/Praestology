stress_propagation:
  local_effect: >
    A locked grade structure raises the restriction cost for neighbouring
    open potential, biasing subsequent closures and producing the effective
    forces observed at larger scales. This is the second-iteration vector
    interaction of forces-as-vector-iterations.yaml expressed in stress
    language.

  environmental_feedback: >
    Surrounding Π_eff modulates both the maintenance cost of an existing
    lock and the residual freedom it leaves behind. Stress is intrinsically
    relational — the same closure configuration has different effective
    stress in different neighbourhood density environments. This is the
    GA reading of coupling constant running: effective CCR ratio varies
    with local Π_eff (energy scale), producing renormalization group
    behaviour without renormalization as a separate procedure.

  scale_nesting:
    statement: >
      Elementary vector/bivector locks generate the first stress layer.
      Composite topologies (particles, atoms, condensed matter) are nested
      full-amplitude closures whose cumulative CCR cost appears as
      macroscopic inertia and gravitational-type gradients.
    non_additivity: >
      IMPORTANT: CCR costs at different closure depths are NOT simply
      additive. The binding topology at each depth has its own CCR cost
      as a distinct committed structure in its own right — not reducible
      to the sum of the depth below. The proton mass vastly exceeds the
      sum of quark masses because the three-fold binding topology is a
      new committed structure at a higher depth with its own CCR, not
      a container for three separate quarks (photon-mass-and-proton-excess
      .yaml #proton_mass_excess #why_non_additive). The total inertia of
      a composite structure is the CCR cost of each closure depth present,
      where each depth's cost is evaluated as an independent topological
      binding structure — not a sum but a nested hierarchy of CCR costs,
      each irreducible to the depths below.
    nuclear_example: >
      Nuclear binding: the nucleon-binding topology has its own CCR cost
      at the nuclear depth, partially offsetting the sum of nucleon
      rest masses (binding energy release). The offset is not predictable
      from the nucleon CCR values alone — it requires the nuclear binding
      topology's own CCR, which is a distinct calculation at the next depth.

