# /core/process-physics/mass-as-plane-independence.yaml
name: "Mass as Plane Independence: Merge Cost and the Origin of Inertia"
version: "0.3"
status: "STRUCTURAL HYPOTHESIS — orders electron mass, proton mass gap, and N=4
         residual by plane-independence cost; two distinct mechanisms underlie
         the ordering (trapped phase for electron; orthogonality energy for proton)
         — unified_principle describes the cost ordering, not a single mechanism;
         quantitative confirmation via SIM-004/005/007 open"
domain: "Core / Process-Physics"

description: >
  Mass is not a primitive property of particles. It is the energy cost
  associated with the degree of independence among bivector planes in Cl(3,0).
  The electron's mass is the trapped phase of a voluntary merge (two rotors
  into one plane). The proton mass gap is the energy cost of maintaining
  three orthogonal planes against the tendency toward fewer effective planes.
  The N=4 residual F=8/3 is the stress of forced sharing when a fourth path
  cannot find an independent plane. In all cases, mass is the cost of plane
  independence — and inertia is the resistance to changing that independence.

dependency_map:
  requires:
    - "core/process-physics/ga-grade-chain-to-particles.yaml"
    - "core/process-physics/bivector-partial-parameters.yaml"
    - "core/process-physics/rotor-to-ccr-transition.yaml"
    - "core/process-physics/closure-types-nesting.yaml"
    - "core/closure-configuration-ratio.yaml"
    - "issues/foundational/test-spec-depth2-triality-closure.yaml"
  provides_to:
    - target: "core/process-physics/iterative-depth-hierarchy.yaml"
      via: "Unified mass origin across depths 1 and 2"
    - target: "core/process-physics/gravity-inertia-equivalence-from-r5.yaml"
      via: "Inertia as plane-independence resistance — one side of the R5 event"

---

structural_principle:
  statement: >
    In Cl(3,0), the general bivector B = b₁₂(e₁∧e₂) + b₁₃(e₁∧e₃) + b₂₃(e₂∧e₃)
    has three independent parameter axes. A configuration's "plane independence"
    is the number of effectively orthogonal bivector planes it maintains.
    Mass is the energy cost of that independence.
  merge_tendency: >
    Every bivector in Cl(3,0) is simple (decomposable). A multi-axis activation
    b₁₂(e₁∧e₂) + b₁₃(e₁∧e₃) is algebraically equivalent to a single bivector
    in a tilted plane. This means two independent axes can always "merge" into
    one effective axis without changing the algebraic form — the merge is a
    reduction in parameter space dimension, not a change in grade.
  mass_as_cost: >
    Configurations that require high independence (many effectively orthogonal
    planes) cost more to maintain. Configurations that allow merge are cheaper
    but cannot satisfy closure conditions that demand independence. The mass
    spectrum is the set of costs for all stable independence configurations.

---

three_cases:

  electron_voluntary_merge:
    configuration: "Two co-oriented rotors R·R in the same bivector plane"
    ga_operation: "R·R = exp(-½Bθ) · exp(-½Bθ) = exp(-Bθ)"
    merge_status: "Voluntary — the two rotors merge into one effective rotor with double phase"
    mass_origin: >
      The doubled phase is trapped rotational energy: the rotor cannot
      propagate (unlike the photon, where counter-orientation cancels the
      grade-2 residue) and cannot reduce its phase (the 720° boundary
      condition locks it). The trapped phase IS the mass.
    formal_expression: "m_e c² = ħ ω_z — the trapped Π_eff-rate precession"
    plane_independence: "1 plane, doubled phase"
    reference: "rotor-to-ccr-transition.yaml #mass_emergence"

  proton_forced_independence:
    configuration: "Three single-rotor strains R₁·R₂·R₃ in mutually orthogonal planes"
    closure_condition: "F[Q] = Σ_{i<j} ‖BᵢBⱼ + BⱼBᵢ + 2δᵢⱼ‖² = 0"
    merge_status: "Forbidden — the closure condition requires orthogonality (F=0)"
    merge_penalty: >
      If two planes become parallel (B₁ = B₂ = B):
        B₁B₂ + B₂B₁ = 2B² = -2
        Contribution to F: ‖-2 - 0‖² = 4
      The closure condition forbids this. The three planes must stay independent.
    mass_gap_origin: >
      The mass gap (m_p - Σ m_quark) is the energy cost of maintaining
      three independent planes against the algebraic tendency toward fewer
      effective axes. The cost is the orthogonality energy — the CCR_binding
      that cannot be absorbed by any single strain.
    formal_expression: >
      m_p c² = (3·I_rot_quark·ω_Φ²)/(2c²) + CCR_binding
      where CCR_binding is the orthogonality energy of the three-plane
      configuration (open: SIM-005-v2). The writhe contribution Wr_eq = 3/2
      enters via CCR_binding — it is not a separate multiplicative factor.
      Note: a writhe energy prefactor E_wr is not yet defined independently;
      do not import it until SIM-005-v2 establishes the functional form.
    plane_independence: "3 orthogonal planes, full independence"
    reference: "test-spec-depth2-triality-closure.yaml"

  n4_forced_sharing:
    configuration: "Four single-rotor strains attempting closure in Cl(3,0)"
    closure_condition: "F[Q] = 0 — impossible, only 3 independent planes available"
    residual: >
      F[N=4] = 8/3 — algebraic fact, not fitted. External theorem anchor:
      the Welch bound for N=4 unit vectors in ℝ³ gives the minimum achievable
      sum of squared inner products as N(N-d)/(d(N-1)) = 4/(3·3) = 4/9 per
      pair; over 6 pairs: F_vector = 6 × (1/3)² = 2/3, achieved uniquely by
      the regular tetrahedron (all pairwise dot products = −1/3). The framework
      functional F[Q] = Σᵢ<ⱼ ‖BᵢBⱼ + BⱼBᵢ‖² acting on bivectors gives
      F_bivector = 8/3 = 4 × F_vector, the factor of 4 arising from the
      anticommutator norm versus the inner product squared. The residual 8/3
      is therefore the price of the most-democratic sharing mathematically
      possible in ℝ³ — an external theorem anchor with no free parameters.
    merge_status: "Forced — the fourth path must share a plane, creating irreducible stress"
    mass_origin: >
      The residual 8/3 is the stress of forced sharing. It cannot be absorbed
      at depth 2 — this is why depth 3 (S⁷ embedding) is required. The residual
      is the algebraic signal that a new depth must open.
    plane_independence: "3 planes, 4 paths — independence impossible"
    reference: "ccr-iteration-by-depth.yaml #branching"

---

unified_principle:
  statement: >
    The mass hierarchy is ordered by plane-independence cost: 0 planes
    (photon) < 1 plane (electron) < 3 planes (proton). The ordering is
    real and the ledger is consistent. However, two distinct mechanisms
    underlie successive steps and should not be collapsed into one:

    Photon → Electron: the distinguishing variable is co-orientation
    (trapped phase from doubled rotor), not plane count. The electron
    has one plane — minimal independence — yet nonzero mass. The mechanism
    is topological locking of the phase, not an orthogonality energy.

    Electron → Proton: here plane count is genuinely the mechanism.
    Three orthogonal planes must be maintained against the algebraic
    tendency toward fewer effective axes. The mechanism is orthogonality
    energy (CCR_binding), quantitatively distinct from trapped phase.

    The unified claim is: each step in the mass hierarchy corresponds to
    a distinct increase in configurational cost — first topological
    (trapped phase), then geometric (orthogonality energy). The cost
    ordering 0 < trapped phase < orthogonality energy is preserved;
    the mechanisms differ. Priority-1 derivations (SIM-005/007) should
    not assume a single functional form covers both steps.

  table:
    - configuration: "Photon (R·R†)"
      plane_status: "Counter-oriented — cancels grade-2 residue"
      independence_cost: "0 — no trapped phase"
      mass: "0 (zero rest mass)"
    - configuration: "Electron (R·R)"
      plane_status: "Co-oriented — merges voluntarily"
      independence_cost: "Trapped phase of merged rotors"
      mass: "0.511 MeV"
    - configuration: "Quark (single R, truncated 2π)"
      plane_status: "Partial plane activation"
      independence_cost: "Fractional — incomplete closure"
      mass: "Fractional (current mass, not constituent)"
    - configuration: "Proton (R₁·R₂·R₃ orthogonal)"
      plane_status: "3 independent planes (forced)"
      independence_cost: "Orthogonality energy + base CCR"
      mass: "938 MeV"
    - configuration: "N=4 (four strains in Cl(3,0))"
      plane_status: "Forced sharing — independence impossible"
      independence_cost: "F = 8/3 (irreducible residual)"
      mass: "No stable closure at depth 2 — forces depth 3"

---

inertia_connection:
  statement: >
    Inertia is the resistance to changing the plane-independence configuration.
    A massive particle resists acceleration because changing its velocity requires
    changing its plane-independence structure — reconfiguring which bivector
    planes are active and how they are oriented. The cost of that reconfiguration
    is inertia.
  formal_expression: >
    Inertia = second variation of the rotor energy functional with respect to
    the bivector parameters. It is the local curvature of the CCR landscape
    at the committed configuration.
  equivalence: >
    Gravity and inertia are two sides of the same R5 event (gravity-inertia-
    equivalence-from-r5.yaml). Gravity is the external Π_eff gradient pulling
    the configuration toward a new plane-independence state; inertia is the
    internal resistance to that reconfiguration. Both are costs of changing
    plane independence.

---

open_derivations:
  priority_1:
    - id: "pi-eff-dependence-of-i-rot"
      description: >
        The local-explicit Dirac equation has μ = mc/ħ with m = I_rot ω_Φ²/(2c²).
        If ω_Φ depends on local Π_eff (vortex precession rate slows where Π_eff
        is low), then effective inertial mass is itself Π_eff-dependent: a particle
        deep in a gravitational well has lower effective I_rot than in free space.
        This coupling is implicit in the local-explicit field equation but not yet
        derived explicitly. It is the bridge between mass-as-plane-independence
        (this file), commitment-depletion-duality.yaml, and
        gravity-and-ccr-threshold.yaml — currently owned by none of the three.
        Equivalence principle holds at first order; the Π_eff correction to I_rot
        is a strong-field prediction. Derive and assign to owning file.
      depends_on: ["SIM-004-v2", "commitment-depletion-duality.yaml",
                   "gravity-and-ccr-threshold.yaml"]
      priority: 1
      epistemic_note: "HYPOTHESIS v<1 — follows structurally from the local-explicit
                       equation; quantitative form of ω_Φ(Π_eff) not yet established"

    - id: "proton-mass-gap-from-orthogonality-energy"
      description: >
        Compute the orthogonality energy of the three-plane configuration
        as the difference between the merged (2-plane) and orthogonal (3-plane)
        configurations. Confirm this equals the observed mass gap (m_p - Σ m_quark)
        divided by E_wr.
      depends_on: ["SIM-005-v2", "SIM-007-v1"]
      computational_test: "SIM-005-v2"

  priority_2:
    - id: "hadron-resonances-as-merge-excitations"
      description: >
        Compute the mass splittings of hadron resonances as the costs of
        different partial-merge configurations. The Δ(1232) resonance should
        correspond to a specific merge-excitation of the three-plane proton
        configuration.
      depends_on: ["bivector-partial-parameters.yaml#hadron_resonances",
                   "proton-mass-gap-from-orthogonality-energy"]

    - id: "electron-mass-from-trapped-phase-integral"
      description: >
        Compute the electron mass directly from the trapped phase integral
        of the 720° Möbius vortex: m_e c² = ħ ω_z where ω_z is the Π_eff-rate
        precession. Confirm ω_z matches the GP equilibrium frequency.
      depends_on: ["SIM-004-v2"]

  priority_3:
    - id: "merge-tendency-from-ccr-landscape"
      description: >
        Formally derive the merge tendency from the CCR landscape: show that
        the gradient of CCR with respect to bivector parameters points toward
        merge (fewer independent planes) when the closure condition does not
        forbid it.
      depends_on: ["proton-mass-gap-from-orthogonality-energy"]

---

epistemic_status:
  established:
    - "Photon has zero mass because counter-orientation cancels grade-2 residue"
    - "Electron mass is trapped rotational energy (m = ħω_z/c²)"
    - "Proton mass gap is non-additive CCR_binding (closure-types-nesting.yaml)"
    - "N=4 residual F=8/3 is algebraically forced (SIM-007-v1)"
    - "Plane independence is the structural variable across all cases"
  structural_hypothesis:
    - "Mass is the energy cost of plane independence"
    - "Proton mass gap = orthogonality energy of the three-plane configuration"
    - "Hadron resonances = merge excitations of the ground-state configuration"
    - "Inertia = resistance to plane-independence reconfiguration"
  open:
    - "Quantitative derivation of the orthogonality energy"
    - "Explicit computation of the merge tendency from CCR landscape"
    - "Hadron resonance mass splittings from merge-excitation enumeration"

