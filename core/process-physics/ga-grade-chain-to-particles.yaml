    description: >
      Explicit calculation of writhe Wr of the R·R double-rotor
      Möbius configuration using CWF, recovering α = (Wr·Ω_rotor)/Ω_embed.
      This is the same as ccr-electron-explicit in vortex-stability.yaml —
      the GA and GP formulations should converge on the same answer.
    depends_on: ["vortex-stability.yaml#ccr-electron-explicit"]
    priority: 1

  - id: "quark-fractional-writhe"
    description: >
      Fractional charge values (1/3, 2/3) as fractional writhe of
      incomplete single-rotor closure in Cl(3,0).
    depends_on: ["electron-ccr-from-double-rotor-writhe"]
    priority: 2

  - id: "proton-grade3-mass-from-binding-ccr"
    description: >
      Explicit calculation of three-fold binding CCR from R₁·R₂·R₃
      pseudoscalar product, recovering proton mass excess (~929 MeV).
      Same as proton-mass-from-su3-binding-ccr in photon-mass-and-
      proton-excess.yaml — the GA route to the same result.
    depends_on: ["quark-fractional-writhe", "su3-from-triality"]
    priority: 2

  - id: "neutron-isospin-from-rotor-configuration"
    description: >
      Neutron as distinct three-fold rotor configuration — same orthogonal
      planes, different orientation assignment — recovering mass difference
      and isospin from GA. Connects to nuclear-binding-energy-from-depth-ccr
      in photon-mass-and-proton-excess.yaml.
    depends_on: ["proton-grade3-mass-from-binding-ccr"]
    priority: 3

