photon:
  description: >
    A dipole pair of two counter-oriented partial rotors in the same
    bivector plane — one left-handed (L), one right-handed (R) referencing
    each other. The geometric product R·R† cancels grade-2 character,
    leaving a pure grade-1 propagating residual.
  ga_expression: >
    ψ_γ = R · R†  (geometric product, not additive superposition)
    where R = exp(-½ B̂θ) and R† = exp(+½ B̂θ) — same plane B, opposite
    phase orientation. The grade-2 bivector components cancel; the
    product collapses to a scalar + grade-1 phase gradient residual.
    See ga-grade-chain-to-particles.yaml #photon for the full derivation.
  notation_note: >
    The additive notation ψ_γ = ψ_L + ψ_R is an approximation that
    loses the GA structure. The geometric product R·R† is the correct
    expression — it is what produces the grade-2 cancellation and the
    grade-1 residual. These are not the same operation.
  properties:
    net_zero_chirality: >
      The L and R components have exactly opposite bivector orientation:
      χ_L = -χ_R. Grade-2 cancels in the geometric product.
      Net charge = 0 because net chirality = 0.
    massless: >
      Zero inward Praegress closure — the counter-orientation prevents
      the self-referential loop from forming. The photon cannot reach
      CCR = 1 because its two components cancel any tendency toward
      self-coupling. Zero rest mass is structurally guaranteed, not
      empirically assumed.
    polarisation: >
      Left circular: R · R† (R leads — left component dominant)
      Right circular: R† · R (R† leads — right component dominant)
      Linear: superposition of both orderings.
      All three follow from the same GA operation and its orderings.
  decoherence_of_photon: >
    When a photon is measured (polariser, detector), the external
    interaction (3rd body R5 event) commits the system to a specific
    relative orientation of the L/R pair — a specific polarisation state.
    This is not mass-lock: the photon after measurement remains a
    grade-1 propagating structure with zero rest mass. It commits to a
    polarisation (grade-2 orientation of the pair) but does not acquire
    inward self-closure. CCR remains below CCR_crit.
    What commits is the phase relationship between L and R, not the
    overall loop structure.

