---

solo_vortex:
  description: >
    A partial closure — grade-1/2 configuration with net chirality but
    sub-threshold commitment. CCR < CCR_crit: the phase plane has acquired
    orientational structure (grade-2 bivector) but has not completed a
    self-referential 720° loop. No stable mass-lock; propagates as a
    partially wound rotor.
  ga_expression: >
    R_partial(x,t) = exp(-½ B̂(ωt - kx)) with net chirality ≠ 0
    (single-handed rotation, unlike the photon's counter-oriented pair)
  properties:
    weak_em_field: >
      The bivector phase flow of the partial closure — a wave of unresolved
      potential. Not a committed EM field but the substrate expression of
      a partially wound rotor propagating through the commitment landscape.
    chirality_oscillation: >
      The partial closure can oscillate between chiral states when CCR
      fluctuates near the closure threshold — the process-level account
      of flavour oscillation. Not a discrete particle switching between
      species but a partial rotor winding shifting its orientation.
    low_interaction: >
      Near-zero CCR → minimal coupling to the commitment landscape.
      The partially wound rotor passes through potential wells without
      significant interference because it has insufficient self-coupling
      to trigger R5 commitment under standard environmental conditions.
    no_intrinsic_chirality: >
      The solo-vortex has no absolute up/down/left/right. Its handedness
      is relational — defined only by interaction with an external structure
      (local commitment density η, magnetic field, matter distribution).
      The apparent observation that neutrinos are exclusively left-handed
      on Earth is, in this framework, an environmental selection effect:
      the local commitment density of ordinary matter selects which
      chirality state the partial closure commits to when forced to
      interact. This is a structural prediction, not a claim that
      handedness is purely an illusion.

  neutrino_hypothesis:
    status: "STRUCTURAL HYPOTHESIS — not established identification"
    statement: >
      The neutrino is a candidate for the solo-vortex structure. However,
      the neutrino has nonzero rest mass (established from oscillation
      experiments) and therefore nonzero CCR. This places it above
      the massless propagation regime (CCR = 0) but potentially below
      the full 720° mass-lock (CCR = 1). The neutrino may be a partial
      self-integral topology — some inward Praegress closure, between
      zero (photon) and full (electron) — as described in
      friedmann-emergence.yaml #probe_epistemics and
      photon-mass-and-proton-excess.yaml #neutrino_comparison.
    what_needs_derivation: >
      Whether the solo-vortex (modification_1/2, sub-threshold CCR,
      net chirality) and the neutrino (partial self-integral, small but
      nonzero rest mass, three generations) are the same structure
      requires the neutrino-ccr-characterisation open derivation —
      establishing the degree of partial inward closure and whether it
      maps to the solo-vortex topology. Three neutrino generations would
      then be three degrees of partial inward closure, each with its own
      CCR value above zero but below CCR_crit.
    open_derivation: "neutrino-ccr-characterisation (friedmann-emergence.yaml)"

