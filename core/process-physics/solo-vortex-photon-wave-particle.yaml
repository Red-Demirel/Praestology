wave_particle_transition:
  statement: >
    Wave-particle duality is not a fundamental mystery. It is the
    consequence of grade-structured dynamics: the same rotor configuration
    behaves as a wave (open regime, grade-2 bivector phase flow, no R5
    commitment) or as a particle (committed regime, R5 fired, stable
    lock) depending on whether decoherence has occurred.
  pre_decoherence: >
    Bivector wave in the open regime — grade-2 phase flow, unresolved
    potential, multiple orientational states superposed. The R3
    orientational superposition is maintained: ψ = Σᵢ cᵢ·Rᵢ.
    The system explores all viable pathways without committing.
  decoherence: >
    Loss of phase coherence due to 3rd body influence — an external
    R5 event (measurement, environmental interaction) that forces a
    specific orientation to commit. This is the Quantum Zeno mechanism
    from quantum-zeno-as-commitment.yaml applied to the wave regime:
    external R5 forcing narrows the R3 exploration and drives commitment.
  post_decoherence:
    solo_vortex_case: >
      The partial rotor commits to a specific chirality state — a specific
      grade-2 orientation. If sufficient environmental stress is present,
      CCR → CCR_crit and mass-lock may follow. Under standard conditions,
      it remains sub-threshold but with fixed chirality.
    photon_case: >
      The L/R pair commits to a specific relative orientation (polarisation).
      No mass-lock — the photon remains grade-1 propagating after
      polarisation commitment. What changes is the phase relationship
      between components, not the topology.
    electron_case: >
      If the configuration is a co-oriented rotor pair (modification_3),
      the 720° boundary condition Q* = R_k[Q*] is reached — full mass-lock,
      CCR = 1, R5 fires permanently. This is the particle in the strong sense.
  key_distinction: >
    "Particle" means different things for the photon (committed polarisation,
    no mass) and the electron (committed 720° lock, rest mass). Wave-particle
    duality is not one phenomenon but two: photon detection commits phase
    relationship; electron detection commits topology. Only the latter
    involves mass-lock.

---

decoherence_as_3rd_body:
  statement: >
    Decoherence is triggered by a 3rd body influence — an external
    interaction that introduces a new reference frame and forces an R5
    commitment event, breaking phase-locking of the partial closure or
    the L/R pair.
  mechanism:
    step_1: >
      The solo-vortex or photon is in pre-decoherence state: bivector
      wave in R3 superposition, no fixed chirality or polarisation.
    step_2: >
      A 3rd body (magnetic field, detector, matter) interacts — introducing
      a new committed topology into the local neighbourhood. The committed
      topology's Π_eff profile creates a new constraint landscape.
    step_3: >
      The interaction fires R5 locally — an η increment is deposited.
      This narrows the local Π_eff and breaks phase-locking.
    step_4: >
      The system resolves to the specific orientation that minimises CCR
      mismatch with the new constraint landscape — a specific chirality
      or polarisation is realised.
  2_body_character: >
    A solo-vortex or photon in isolation is a 2-body system — the L/R
    components or the partial rotor and the substrate reference each
    other. Chirality or polarisation is undefined relative to an external
    frame until a 3rd body provides one. This is why quantum systems
    appear to "not have" properties before measurement — they genuinely
    lack a reference frame against which the relational property is defined.
  connection_to_zeno: >
    The 3rd body decoherence mechanism is the same as the Quantum Zeno
    Effect (quantum-zeno-as-commitment.yaml): the 3rd body forces R5
    events, depositing η, narrowing local Π_eff, and suppressing further
    R3 exploration. Measurement is not passive observation but active
    R5 forcing by the measurement apparatus's committed topology.

---

chirality_level_distinction:
  statement: >
    A precision point applicable throughout this file: "chirality" means
    different things at the process level and the derivative level.
    These must not be conflated.
  topological_chirality: >
    Process level (grade-2 rotor): the sign of the bivector plane — which
    way the rotor winds. This is intrinsic to the committed topology,
    frame-independent. The solo-vortex has net topological chirality
    (one winding direction dominant); the photon has zero net topological
    chirality (L and R cancel in R·R†).
  electroweak_chirality: >
    Derivative level (grade-1 projection): the helicity — projection of
    spin onto the momentum direction. Left-handed means spin anti-parallel
    to momentum. Relational and frame-dependent: a left-handed neutrino
    moving away from you is right-handed to an observer it approaches.
    The weak interaction couples to this projection, filtered by the
    Higgs condensate orientation.
  consequence: >
    The solo-vortex's "net topological chirality" is not the same as the
    "left-handedness" observed in weak interactions. The exclusive
    left-handedness of neutrinos in weak interactions is the Higgs
    condensate selection effect described below — not the solo-vortex
    topology being intrinsically left-chiral in the electroweak sense.
    Similarly, the electron's L+L co-orientation (topological) does not
    mean the electron is purely left-chiral — both chirality projections
    are present in its wavefunction; the Higgs condensate selects which
    couples to the weak force.

---

neutrino_left_handedness_prediction:
  statement: >
    The observed exclusive left-handedness of neutrinos in ordinary matter
    is, in this framework, an environmental selection effect — not a
    fundamental asymmetry of the solo-vortex topology itself.
  mechanism: >
    Ordinary matter is composed of right-handed quarks and left-handed
    electrons (from electroweak symmetry breaking — the Higgs condensate
    sets a preferred grade-0 orientation). This committed environment has
    a specific chirality bias in its local Π_eff profile. When a solo-vortex
    interacts with this environment (3rd body R5 event), the commitment
    landscape's chirality bias selects the left-handed orientation as the
    lower CCR mismatch state — the orientation that minimises conflict
    with the surrounding committed topology.
  prediction: >
    In a right-handed matter environment (antimatter), the same solo-vortex
    would appear right-handed. This is consistent with the CPT symmetry
    of the framework: the intrinsic topology of the solo-vortex is not
    chiral, but its committed expression in an environment always carries
    the environment's chirality bias.
  status: "STRUCTURAL PREDICTION — falsifiable if right-handed neutrinos
           are observed in a specific high-energy environment where the
           local commitment density chirality is reversed"

