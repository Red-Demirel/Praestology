# /core/process-physics/ccr-iteration-by-depth.yaml
spec_id: "CCR-ITERATION-v1"
title: "Depth-Iterated Closure: Recursive CCR with Branching"
type: "CORE_PROCESS_PHYSICS_SPECIFICATION"
status: "DRAFT — procedure established at d=1; higher depths marked by tier"
domain: "core/process-physics/"
changes_from_source: >
  Corrected depth-1 Tw value: Tw = 1/2 (Möbius non-orientability, algebraic fact),
  not Tw = 1. Therefore Wr = Lk - Tw = 2 - 1/2 = 3/2, consistent with
  magic-numbers-logical-argument.yaml and CWF decomposition.
  Added depth-2 simulation result: N=4 residual F=8/3 provides concrete numerical
  instance of the branching condition — the precise residual tension that cannot
  be absorbed by Cl(3,0) linear sequence, confirming the S⁷ jump is structural.
depends_on:
  - "core/closure-configuration-ratio.yaml"
  - "core/process-physics/closure-types-nesting.yaml"
  - "core/process-physics/baum-connes-assembly-map-correspondence.yaml"

terminology_note: >
  "Fork" was the working term; the specification uses "branching"
  (graph-theoretic) and "polymorphism" (crystallographic) instead, since
  the framework requires a constrained branching relation, not concurrency.
  "Bifurcation" is reserved for the dynamical-systems case where the solution
  set changes qualitatively at a threshold.

epistemic_status:
  statement: >
    The recursion below is a procedure, not a derivation. The procedure is
    fully specified at depth 1, where the equilibrium shape and its invariant
    are known. At depth 2 the equilibrium shape is the open item. At depth 3
    and above both the shape and the invariant are open. Nothing here should
    be read as a computed result.

---

# ─────────────────────────────────────────────
# THE OPERATOR / VALUE SPLIT
# ─────────────────────────────────────────────

recursion:
  statement: >
    The depth recursion is a fixed-point iteration. The closure map Φ_d acts
    on configurations at depth d and returns configurations at depth d.
    The ratio CCR^d is the value Φ_d computes at each step, not the map itself.
    Separating the two is what makes D_{d+1} = Fix(Φ_d(D_d)) well-defined.

  closure_map:
    symbol: "Φ_d"
    signature: "Configurations(D_d) → Configurations(D_d)"
    definition: >
      Φ_d is the gradient descent of the closure functional appropriate to
      depth d, followed by projection onto the closure constraint. The
      functional is determined by the equilibrium shape supported at that
      depth (see shape_equilibrium below).

  closure_ratio:
    symbol: "CCR^d"
    form: "CCR^d = (Wr_d · Ω_rotor(T_d)) / Ω_embed(d)"
    role: >
      The value Φ_d computes at each iteration step. Closure is achieved when
      the ratio stabilises — the configuration is invariant under its own
      closure map: Φ_d(Q*) = Q*.

  depth_recursion:
    equation: "D_{d+1} = Fix(Φ_d(D_d))"
    reading: >
      The fixed points of the closure map at depth d constitute the domain
      available at depth d+1. Each depth's fixed points become the next
      depth's embedding substrate Ω_embed(d+1).

---

# ─────────────────────────────────────────────
# SHAPE EQUILIBRIUM
# ─────────────────────────────────────────────

shape_equilibrium:
  statement: >
    The invariant entering CCR^d is not the same quantity at every depth.
    It is whatever invariant the equilibrium shape at that depth supports,
    computed by the same procedure. The scale-invariance is procedural:
    find the equilibrium shape under the closure functional, compute its
    invariants, test whether the ratio closes. The procedure is identical
    at every depth; the invariant is not.

  per_depth:
    d_1:
      tier: "ESTABLISHED"
      equilibrium_shape: "720° Möbius centerline"
      invariant: "Centerline writhe Wr (CWF theorem)"
      value: >
        Tw = 1/2 (Möbius non-orientability — algebraic fact, not assumption)
        Lk = 2 (two-fold winding — 720° closure)
        Wr = Lk - Tw = 2 - 1/2 = 3/2
      closure_value: "CCR¹ = 1 (at the equilibrium shape)"
      note: >
        This is the reference case. The shape is the electron's Möbius vortex;
        the invariant is the writhe of its centerline; the closure value is unity.
        See vortex-stability.yaml #ccr_derivation_path and SIM-004-v2 for the
        full computation.

    d_2:
      tier: "OPEN (equilibrium shape) / CANDIDATE (invariant kind)"
      equilibrium_shape: "Not yet computed — minimiser of F[Q] is the open item"
      closure_functional: >
        Anticommutator deviation:
          F[Q] = Σ_{i<j} ‖BᵢBⱼ + BⱼBᵢ‖²
        Vanishes at orthonormal Clifford closure in Cl(3,0).
        Verified: F[e12, e13, e23] = 0 exactly (SIM-007-v1).
        N=3 ceiling confirmed: F→0 for N≤3; F→8/3 for N=4 (structural, not fitted).
      n4_residual: >
        The residual F=8/3 for N=4 is the precise non-additive binding cost that
        cannot be absorbed by Cl(3,0)'s three independent bivector planes.
        This is the branching condition trigger: CCR_binding(d1,d2) > closure
        capacity → S⁷ embedding required for depth-3. The number 8/3 is
        the concrete numerical instance of what branching_constraint describes.
      candidate_invariant: >
        A linking matrix over the three bivector planes, or a Spin(7)-invariant
        of the triality configuration. Not yet determined. The minimiser of F
        is the open item.
      closure_value: "Open — whether CCR² = 1 or a different fixed value"

    d_3_and_above:
      tier: "OPEN"
      equilibrium_shape: "Not yet specified"
      candidate_embedding: "S⁷ (next Hopf level after S³)"
      note: >
        The invariant that the equilibrium shape supports at this depth is not
        known, and the closure condition on S⁷ is not yet written down.
        The N=4 residual from SIM-007 confirms that the jump to S⁷ is
        structurally forced at N=4, not a modelling choice.

---

# ─────────────────────────────────────────────
# BRANCHING
# ─────────────────────────────────────────────

branching:
  statement: >
    A single chain cannot account for the observed diversity of closures at
    a given depth. Depth 3 hosts many isotopes; depth 4 hosts 118 elements;
    depth 5 is effectively unbounded. The recursion admits constrained
    branching: a closure at depth d+1 may inherit from more than one closure
    at depth d, or from closures at non-adjacent earlier depths.

  constraint:
    statement: >
      Branching is permitted only when it resolves a residual tension that
      the linear recursion cannot absorb. The residual is CCR_binding(d_i, d_j)
      from closure-types-nesting.yaml — irreducible to the sum of lower depths.
      A branch is exactly the configuration where that irreducibility appears
      as an additional degree of freedom.
    numerical_instance: >
      At depth 2: F[N=4]=8/3 is the residual that triggers the depth-3 branch.
      At depth 3: the nuclear isotopes are DAG branches from the proton/neutron
      fixed points, each resolving a different portion of the depth-3 residual
      by accessing the S⁷ linking geometry at different nucleon counts.

  structure:
    type: "Directed Acyclic Graph"
    nodes: "Closures indexed by (depth, branch)"
    edges: >
      Parent relation: closure at (d+1, b) inherits from one or more closures
      at depths ≤ d.
    accessibility: >
      Which prior depths a closure at depth d may inherit from is an open item.
      Candidates: adjacent-only (d, d+1); adjacent-plus-distant for cases where
      CCR_binding requires it.

  open_items:
    - id: "branching-conditions"
      description: >
        Formal specification of when a configuration at depth d+1 must branch
        rather than continue linearly. Candidate condition: when residual closure
        tension at depth d exceeds the closure capacity of the equilibrium shape.
    - id: "accessibility-relation"
      description: >
        Formal specification of which prior depths are accessible to a closure
        at depth d. Requires the depth-2 equilibrium shape to be known.
    - id: "polymorphism-counts"
      description: >
        Predicted number of stable closures at each depth: period lengths at d=4,
        stable molecule count at d=5. Whether these follow from branching or from
        the closure condition alone is open.

---

# ─────────────────────────────────────────────
# K₀ BRANCHING AND BAUM-CONNES CONNECTION
# ─────────────────────────────────────────────

k0_dag_connection:
  statement: >
    The branching DAG structure is the geometric-potential-side expression of
    K₀ branching in the Baum-Connes assembly map. Each branch at depth d+1
    is a new K₀ class — a new stable isomorphism class of projections in
    the C*-algebra K-theory at that depth.

  iterated_assembly_map: >
    The assembly map μ is not applied separately at each depth — it is the
    same map iterated over its own fixed-point output:
      μ₁: K^top(D₀) → K(C*_r(D₁))   [potential → depth-1 closures]
      μ₂: K^top(D₁) → K(C*_r(D₂))   [depth-1 → depth-2 closures]
      μ_d: K^top(D_{d-1}) → K(C*_r(D_d))
    The input geometric-potential side at each depth is exactly the K-homology
    of the previous depth's committed output — D_{d+1} = Fix(Φ_d(D_d)).
    The closure map Φ_d is the process-level expression of what μ_d computes
    algebraically. The two formalisms describe the same recursion from
    complementary sides.

  k0_branching_counts:
    depth_1: "K₀ has two generators (electron, photon) — binary"
    depth_2: "K₀ gains the proton/neutron branch — small count"
    depth_3: "K₀ branches corresponding to nuclear magic numbers"
    depth_4: "K₀ branches corresponding to 118 elements"
    depth_5_plus: "K₀ effectively unbounded branching"
    prediction: >
      The Steiner enumeration (iterative-depth-hierarchy.yaml) is the
      combinatorial side of the same computation K-theory performs
      algebraically. Agreement between the two would confirm that the
      branching structure is determined by the closure condition rather
      than by additional assumptions.

  non_coincidence: >
    The appearance of the same closure structure at every depth is not
    coincidental. It is the fixed-point structure of a single iterated
    operator applied to its own output. Given:
      (a) Initial input: D₀ = full Cl(3,0) multivector (null space of
          the commitment operator, maximum grade freedom)
      (b) Closure map: Φ_d (same procedure at every depth, different invariant)
      (c) Recursion: D_{d+1} = Fix(Φ_d(D_d))
    The hierarchy is not one of many possible outcomes — it is the unique
    sequence of fixed-point sets generated by this operator from this initial
    condition. The diversity within each depth (branching) arises from the
    residual CCR_binding tension, not from additional freedom in the operator.

  connection_to_vector_hyperspace: >
    D₀ (the full multivector, maximum grade freedom) → Fix(Φ₁) = D₁
    D₁ (electrons, photons, quarks) → Fix(Φ₂) = D₂
    D₂ (proton, neutron) → Fix(Φ₃) = D₃
    D₃ (nuclei, magic numbers) → Fix(Φ₄) = D₄
    ...
    Each depth extracts from its input domain exactly those configurations
    that satisfy the closure condition. The residual — configurations that
    don't satisfy the condition — either dissolve back into lower-depth
    potential (Regress) or wait as incomplete configurations (quarks at d=1,
    radicals at d=4) until a branching event provides the missing partner.
    The hierarchy from D₀ to consciousness is one integral, iterated.

