# /core/process-physics/relational-effects-extra-dof.yaml
name: "Relational Effects and Extra Degrees of Freedom:
       Gravity, Ampère Longitudinal Force, and Entanglement"
version: "1.0"
status: "STRUCTURAL CORRESPONDENCE — parallel established; longitudinal
         Ampère force as testable prediction of extra DoF; formal
         derivation of all three from the same projection mechanism open"
domain: "Core / Process-Physics"
description: >
  Three phenomena — gravitational time dilation, the Ampère longitudinal
  force, and the extra entanglement DoF beyond -cos θ — are identified as
  different expressions of the same structural gap: the relational component
  of the commitment landscape that standard formalisms project out. Each
  involves a degree of freedom along the gradient direction (longitudinal)
  rather than perpendicular to it (transverse), and each has a corresponding
  extra DoF that the standard formalism discards as gauge redundancy or
  global phase. All three are relational effects — consequences of how
  committed closures affect the surrounding Praegress flow — rather than
  field propagation effects.

---

gravity_as_relational_effect:
  statement: >
    Gravitational time dilation is not a field propagating through space.
    It is the suppression of local R5 firing rate (Π_eff depression) by
    accumulated committed topology — a relational effect between the
    committed structure and the surrounding Praegress flow. The gravitational
    "field" is the gradient of this suppression; the time dilation is the
    integral of the suppression along the observer's path.
  what_standard_gtr_projects_out: >
    General relativity encodes this as spacetime curvature — a geometric
    description of how the metric varies. The metric is the derivative-level
    description of the Π_eff suppression landscape. What GR projects out is
    the absolute process rate: it tracks the ratio of rates (time dilation)
    but not the absolute Π_eff value, which would require access to the
    process level. The absolute Π_eff value is the extra DoF — the relational
    connection between committed topology and surrounding Praegress that
    determines not just differential dilation but the absolute rate of
    R5 closure events.
  connection_to_inside_out: >
    Inside-out-channeling.yaml establishes that committed topology narrows
    Praegress pathways and suppresses Π_eff locally. The gravitational effect
    is this suppression experienced by any R5 process in the vicinity.
    Time dilation is the observed consequence — clocks run slow because R5
    fires less frequently, not because spacetime is curved. The curvature
    description and the Π_eff suppression description are the same phenomenon
    at two levels.

---

ampere_longitudinal_force:
  statement: >
    Ampère's original force law (1820s) includes a component along the
    current direction — the longitudinal force — that accelerates or
    decelerates charges parallel to the current flow. Maxwell's formulation
    retains only the transverse (perpendicular) Lorentz force, projecting
    out the longitudinal component. The longitudinal term has been
    experimentally observed but remains outside the standard framework.
  process_physics_account: >
    The standard EM force is the grade-1/2 transverse phase-drag around
    committed topology — the second-iteration vector interaction from
    forces-as-vector-iterations.yaml. The longitudinal component is the
    grade-1 force along the gradient direction ∇s — the direct scalar
    overlap gradient driving Praegress along the current, not deflecting
    it away from it. This is the first-order ∇s gradient that gravity
    also represents — at the EM field commitment depth rather than the
    large-scale η gradient depth.
  what_standard_em_projects_out: >
    Maxwell's formulation uses only the grade-2 bivector F for EM.
    The grade-1 component along ∇s — the longitudinal force — is
    projected out by the requirement that EM forces be gauge-invariant
    under local U(1) phase rotation. The longitudinal component is not
    gauge-invariant in this sense; it depends on the absolute gradient
    magnitude, not just the phase rotation. This is the same projection
    that discards the absolute Π_eff value in gravity — both are
    absolute-gradient components that gauge/metric formulations trade away
    for covariance.
  experimental_status: >
    Ampère longitudinal forces have been observed in exploding wire
    experiments, railgun pinch effects, and some plasma confinement
    geometries. They are real but small relative to the transverse Lorentz
    force under standard conditions. The framework predicts they should
    be stronger in high-η, high-current environments where the ∇s gradient
    is steep — the same conditions where Π_eff suppression effects (gravity)
    are enhanced.

