predictions:
  gravity: >
    Absolute Π_eff variations (not just differential dilation) should be
    detectable in principle as deviations from GR predictions in environments
    where the process-level account differs from the geometric account.
    Near saturation (η → n_sat): GR predicts horizon formation; the
    framework predicts asymptotic Π_eff → 0 with no singularity.
    The difference is the absolute vs relative distinction.
    Status: PREDICTIVE — distinguishable from GR in extreme environments.

  ampere_longitudinal: >
    The longitudinal force should be measurable in high-current, high-η
    environments as a component of force along the current direction
    beyond the standard Lorentz prediction. Magnitude proportional to
    the ∇s gradient — larger in steeper commitment gradients.
    Already partially observed; the framework provides a mechanism.
    Status: SUPPORTED — experimental evidence exists; mechanism provided.

  entanglement: >
    Two-qubit state tomography should show systematic reconstruction
    errors of the type described in bivector-partial-parameters.yaml
    (15 → 19 real parameters for complete reconstruction). The errors
    would appear as residual correlations in the b₂₃ plane after standard
    tomography, correlating with the initial preparation geometry.
    Status: PREDICTIVE — testable with precision two-qubit tomography.

