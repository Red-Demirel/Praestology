unified_mechanism:
  statement: >
    All three are consequences of the same structural feature: the standard
    formalisms are transverse-only descriptions of what are actually
    longitudinal-plus-transverse processes. In each case:
      - The transverse component is gauge-covariant and is retained
      - The longitudinal component is relational (depends on absolute
        gradient magnitude or absolute orientation) and is projected out
      - The projected component carries information about the absolute
        state of the commitment landscape, not just its relative structure

  why_projected: >
    The projection is not arbitrary — it follows from the choice of
    description level. Gauge-covariant descriptions work at the derivative
    level where only relative differences between committed states are
    observable. The absolute values (absolute Π_eff, absolute gradient
    magnitude, absolute joint orientation) are process-level quantities
    that the derivative level cannot access directly. The projections are
    the derivative level acknowledging its own limitations.

  recovery_path: >
    The participant-centric re-derivation programme
    (participant-centric-rederivation-programme.yaml) would recover all
    three extra components naturally: starting from the process level
    with absolute Π_eff and the full bivector parameter space, the
    longitudinal gravity, the Ampère longitudinal force, and the
    6-way entanglement structure all appear without projection.
    Their absence from current formalisms is not a failure of experiment
    but a consequence of building the formalisms from the derivative level
    upward, inheriting the projections at each step.

  relational_character: >
    Each extra DoF is relational in the same sense that gravity is relational:
    it is not a property of a single committed structure but of the
    relationship between a committed structure and the surrounding
    Praegress flow. The longitudinal Ampère force is the relationship
    between the current's commitment direction and the surrounding
    grade-1 flow along that direction. The extra entanglement DoF is
    the relationship between two systems' joint bivector orientation
    and the commitment landscape they will eventually settle into.
    Gravity is the relationship between committed η and the R5 rate
    of everything in its vicinity.
    All three are relational effects that the derivative level, working
    from committed structures outward, cannot see directly.

