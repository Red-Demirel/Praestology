# ─────────────────────────────────────────────
# §8  OPEN DERIVATIONS
# ─────────────────────────────────────────────

open_derivations:

  priority_1:
    - id: "master-equation-linearization-for-adjustment"
      description: >
        Linearize the master equation around the equilibrium
        configuration and derive the wave equation for the adjustment
        δψ. Show that the adjustment propagates as a hyperbolic
        perturbation, and extract c_eff = c·(Π_eff/Π_eff,base)
        from the linearized equations.
      depends_on: ["core-dynamical-equation.yaml"]

    - id: "grade-composition-explicit"
      description: >
        Explicit Cl(3,0) decomposition of the propagating adjustment
        into grade-0, grade-1, and grade-2 components. Verify that
        grade-1 is leading (from longitudinal character) and grade-2
        is secondary (transversal, gauge-covariant).
      depends_on: ["master-equation-linearization-for-adjustment",
                   "geometric-algebra-bridge.yaml"]

    - id: "c_eff-from-linearization"
      description: >
        Derive c_eff = c·(Π_eff/Π_eff,base) explicitly from the
        linearized master equation. Quantify deviation from c in
        strong-field regimes and identify observational signature
        in multi-messenger GW+EM timing.
      depends_on: ["master-equation-linearization-for-adjustment"]

  priority_2:
    - id: "quadrupole-from-grade1-geometry"
      description: >
        Show that an accelerating anchoring configuration produces
        a quadrupole structure in the grade-1 adjustment, not a
        monopole or dipole. Derive the source term in terms of
        the second time-derivative of the anchoring's position.
      depends_on: ["grade-composition-explicit"]

    - id: "superposition-gravitational-suppression"
      description: >
        Quantify the gravitational effect suppression for a system
        in superposition as a function of CCR value between 1/π
        and α. Derive the scaling relation and identify the
        experimental regime where it is distinguishable from
        classical expectation.
      depends_on: ["c_eff-from-linearization", "SIM-004-v2"]

  priority_3:
    - id: "nonlinear-strong-field-adjustment"
      description: >
        Extend the linearized treatment to strong fields where the
        adjustment is mutually constitutive across sources.
      depends_on: ["quadrupole-from-grade1-geometry"]

