description: >
  A change in one region's anchoring configuration does not emit anything
  into a pre-existing space. It changes the relational structure between
  the field vectors in the phase configuration space, and this change
  propagates as a reconfiguration of that structure. This file describes
  the process-level phenomenon first: what the affected vectors are, how
  a local change alters their relational configuration, and how the
  alteration propagates through the multispace. The derivative-level
  readout — what a detector observes as "gravitational wave" — is a
  subsequent projection onto a coordinate representation, and is noted
  only briefly at the end.

