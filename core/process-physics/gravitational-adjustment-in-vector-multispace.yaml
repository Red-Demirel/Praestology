---

# ─────────────────────────────────────────────
# §1  ONTOLOGICAL PREMISE
# ─────────────────────────────────────────────

ontological_premise:

  statement: >
    There is no pre-existing spatial container. The primitive is the
    multivector field ψ in the phase configuration space C_Φ = Cl(3,0),
    together with the local process rate Π_eff that encodes the
    substrate's free potential at each configuration. Committed
    anchorings (grade-3 pseudoscalars in Cl(3,0), corresponding to
    proton-scale closures) deplete Π_eff locally. The aggregate
    depletion landscape is what other configurations respond to.

  what_is_primary:
    - "The field vectors: the multivector ψ at each configuration point, with grades 0 through 3."
    - "The process rate field: Π_eff(x), a grade-0 scalar at each configuration point."
    - "The relational structure: how the field vectors and their gradients are coupled through Π_eff."

  what_is_derivative:
    - "3D spatial representation: a coordinate projection of the configuration space."
    - "Metric tensor: a derivative-level description of the Π_eff landscape's shape."
    - "Gravitational wave: the derivative-level readout of a propagating relational adjustment."

  consequence_for_this_file: >
    The account proceeds at the process level. Terms like "propagates
    through space" are deferred; the language is "reconfiguration
    propagates through the vector-multispace." Only in §6 is the
    derivative-level reading introduced, and only as a projection.

---

# ─────────────────────────────────────────────
# §2  THE AFFECTED VECTORS
# ─────────────────────────────────────────────

affected_vectors:

  statement: >
    The vectors affected by a relational adjustment are the field
    configurations at each point of the multispace. Their grade
    decomposition determines which aspects of the adjustment they
    carry.

  grade_decomposition:
    grade_0_scalar:
      content: "ρ(x) = |ψ(x)|² — commitment density at each configuration point"
      role: "Encodes how much committed structure is present locally. Changes when anchoring changes."
    grade_1_vector:
      content: "∇ψ(x) — spatial (configuration-space) gradient of the field"
      role: >
        Carries the directed flow of the field. The projection of ∇ψ
        along the Π_eff gradient is the coupling that produces the
        gravitational response. This is where the "field direction"
        lives — and where the longitudinal component of the adjustment
        is encoded.
    grade_2_bivector:
      content: "Phase bivector B̂(x) — orientation of the field's internal rotation"
      role: >
        Encodes the field's orientational structure (spin, EM-like
        phase gradients, chirality). Adjusts when the Π_eff gradient
        changes because the master equation couples amplitude and phase.
        Carries the transversal (gauge-covariant) component.
    grade_3_pseudoscalar:
      content: "Volumetric commitment I(x) — the topological content"
      role: >
        Encodes committed closures (proton-scale anchorings). This is
        the source of Π_eff depletion. Not directly affected by the
        adjustment — it is what causes it, not what carries it.

  the_relational_vectors:
    statement: >
      The "vectors" that carry the adjustment are not individual
      field components but the relational structure among them. In
      particular:

      (a) The gradient of Π_eff — this is itself a grade-1 vector
          field, ∇Π_eff(x). It is the "field direction" of the
          substrate's processing capacity. This is the longitudinal
          component — it points along the gradient direction, not
          perpendicular to it.

      (b) The gradient of ψ — ∇ψ(x), also grade-1. The coupling between
          ∇Π_eff and ∇ψ in the master equation's kinetic term is the
          structural locus of the gravitational interaction.

      (c) The phase bivector B̂(x) — grade-2. Adjusts in response to
          changes in the Π_eff landscape, because the master equation
          couples amplitude (grade-0) and phase (grade-2). This is
          the transversal component — it is gauge-covariant and is
          retained by standard GR as the metric perturbation.

  affected_by_a_local_change:
    - "∇Π_eff — directly. The anchoring's contribution to the Π_eff landscape changes."
    - "∇ψ — through the coupling term (∇Π_eff)·(∇ψ) in the master equation."
    - "B̂ — through the amplitude-phase coupling in the master equation."
    - "ρ — the local commitment density, which adjusts as the field responds."

  grade_composition_of_the_adjustment: >
    The adjustment is therefore a multi-grade reconfiguration: primarily
    a grade-1 change (∇Π_eff and ∇ψ), with secondary grade-2 and grade-0
    adjustments through the master equation's couplings. It is not
    purely grade-0 scalar, and it is not purely grade-1 vector — it is
    a coupled adjustment whose leading component is grade-1.

---

# ─────────────────────────────────────────────
# §2b  WHY GRADE-1 IS THE LEADING COMPONENT
# (derived, not observed)
# ─────────────────────────────────────────────

why_grade_1_leads:

  statement: >
    The Grade-1 leadership of the propagating adjustment is not an
    empirical observation — it is a structural consequence of the
    longitudinal/transversal projection distinction established in
    relational-effects-extra-dof.yaml.

  longitudinal_vs_transversal: >
    Every relational effect in the framework has two components:
      Longitudinal: along the gradient direction ∇Π_eff — grade-1 vector.
                    This is the absolute gradient magnitude — the extra DoF
                    that standard formalisms project out as gauge redundancy.
      Transversal:  perpendicular to the gradient — grade-2 bivector.
                    This is gauge-covariant and is retained by standard
                    formalisms (GR metric perturbation, Maxwell F bivector).

  gravity_is_longitudinal: >
    Gravity is the first-order ∇s gradient — the longitudinal component
    of the Π_eff depletion field. This is established in
    forces-as-vector-iterations.yaml and confirmed in
    relational-effects-extra-dof.yaml. Because gravity is longitudinal,
    the propagating adjustment that carries gravitational information
    must be grade-1 as its leading component. Grade-2 (transversal) is
    secondary — it is the metric perturbation that GR describes, the
    derivative-level shadow of the grade-1 process-level adjustment.

  consequence_for_polarization: >
    The two transverse polarizations of gravitational waves (plus and
    cross) are the two independent perpendicular components of the
    grade-2 secondary adjustment — the transversal part that GR retains.
    The quadrupole pattern arises from the geometry of the grade-1
    adjustment around an accelerating source projected onto the
    transversal plane. Both are consequences of the grade-1 leading
    component, not independent phenomena.

  what_gtr_misses: >
    GR describes only the grade-2 transversal component — the metric
    perturbation. The grade-1 longitudinal component — the absolute
    Π_eff change — is projected out by the choice of gauge-covariant
    description. This is not a failure of GR within its domain; it is
    the derivative level correctly describing what it can access. The
    absolute Π_eff value is a process-level quantity.

  correction_of_earlier_reading: >
    Earlier drafts described the GW as "grade-0 scalar propagation."
    That was a category confusion: a grade-0 scalar has one component
    and cannot carry transverse polarization or quadrupole signature.
    The correct process-level reading is that the adjustment is
    primarily grade-1 (longitudinal), with secondary grade-2
    (transversal) and grade-0 components coupled through the master
    equation. The grade-1 leadership follows from gravity being a
    longitudinal effect — not from observation.

---

# ─────────────────────────────────────────────
# §3  HOW A LOCAL CHANGE ALTERS THE RELATIONS
# ─────────────────────────────────────────────

local_alteration:

  statement: >
    When an anchoring configuration changes (accelerates, reorients,
    or reconfigures), its depletion contribution to the local Π_eff
    landscape changes. The change is local at the source but alters
    the relational structure of the surrounding field because the
    field's gradients are coupled through Π_eff.

  mechanism:
    step_1_anchoring_change:
      statement: >
        The anchoring's position in the configuration space shifts.
        This means its grade-3 pseudoscalar content relocates or
        reorients.
      consequence: "The depletion contribution to Π_eff at the old and new positions changes."

    step_2_landscape_adjusts:
      statement: >
        The local Π_eff must adjust to the new configuration. The
        adjustment is local at the source — Π_eff itself is a scalar
        and adjusts pointwise.
      consequence: "∇Π_eff changes in the neighbourhood of the source."

    step_3_coupling:
      statement: >
        Through the master equation's kinetic term, ∇Π_eff is coupled
        to ∇ψ. A change in ∇Π_eff forces a change in ∇ψ to maintain
        the field's consistency.
      consequence: "The field's directed structure adjusts, propagating outward from the source."

    step_4_phase_adjustment:
      statement: >
        The amplitude-phase coupling in the master equation means the
        phase bivector B̂ adjusts in response to the amplitude change.
      consequence: "Secondary grade-2 adjustment follows the primary grade-1 change."

---

# ─────────────────────────────────────────────
# §4  PROPAGATION THROUGH THE MULTISPACE
# ─────────────────────────────────────────────

propagation:

  statement: >
    The relational adjustment propagates through the vector-multispace
    as a coupled grade-1/grade-2 reconfiguration. It is not a wave
    in a medium — there is no medium. It is a change in the relational
    structure of the field itself, propagating at the rate set by the
    local process capacity.

  effective_speed:
    formula: "c_eff = c · (Π_eff / Π_eff,base)"
    reading: >
      In near-vacuum (Π_eff ≈ Π_eff,base), c_eff ≈ c — consistent
      with observed gravitational wave speed. In high-commitment
      environments (Π_eff < Π_eff,base), c_eff < c — a prediction
      for strong-field regimes.
    note: >
      c_eff is derived from the linearized master equation. It is
      not a postulate.

  multilinear_coupling: >
    When two committed structures are in mutual adjustment — each
    changing the Π_eff landscape the other experiences — the
    adjustment is not additive. The shared landscape updates itself
    as each structure responds. This is the nonlinear regime,
    relevant for binary mergers and strong-field dynamics.

---

# ─────────────────────────────────────────────
# §5  GRADE COMPOSITION OF THE ADJUSTMENT
# ─────────────────────────────────────────────

grade_composition:

  primary_grade_1:
    description: >
      The leading component of the propagating adjustment. It is the
      longitudinal gradient ∇Π_eff change propagating outward from
      the source. Grade-1 because gravity is a longitudinal effect
      (see §2b). This component carries the absolute Π_eff information
      — the extra DoF that GR projects out.
    note: >
      This is the component that forces-as-vector-iterations.yaml
      identifies as the first-order ∇s gradient — the same grade as
      gravity itself. The GW is a propagating change in this gradient.

  secondary_grade_2:
    description: >
      The phase bivector B̂ adjusts as the amplitude field responds,
      through the amplitude-phase coupling in the master equation.
      This is the transversal component — gauge-covariant, retained
      by GR as the metric perturbation h_μν. The two polarizations
      (plus, cross) are its two independent perpendicular components.

  tertiary_grade_0:
    description: >
      The local commitment density ρ adjusts as the field magnitude
      responds. Also secondary to grade-1, but present as a scalar
      density change accompanying the gradient change.

  why_this_matters: >
    A grade-1 leading component means the propagating adjustment has
    directional structure. This is what makes it possible for the
    derivative-level readout to show a quadrupole pattern and two
    transverse polarizations — those arise from the geometry of the
    grade-1 field projected onto the transversal plane, not from a
    scalar's isotropic adjustment.

---

# ─────────────────────────────────────────────
# §6  DERIVATIVE-LEVEL READOUT (DEFERRED)
# ─────────────────────────────────────────────

derivative_readout:

  statement: >
    Only after the process-level account is established does the
    derivative-level readout become meaningful. What a gravitational-
    wave detector observes is the projection of the propagating
    relational adjustment onto a 3D coordinate representation.

  what_projects:
    - "The grade-1 longitudinal component projects as a strain-like pattern in the coordinate frame."
    - "The quadrupole structure follows from the geometry of the grade-1 adjustment around an accelerating source."
    - "The two polarization states (plus and cross) are the two independent components of the grade-2 transversal projection perpendicular to the propagation direction."

  what_gtr_retains_and_discards:
    retains: >
      The grade-2 transversal component — the metric perturbation h_μν.
      This correctly describes differential time dilation, spatial strain,
      and the two polarization states.
    discards: >
      The grade-1 longitudinal component — the absolute Π_eff change.
      GR tracks only the ratio of rates (differential dilation) not
      the absolute process rate. This is the extra DoF identified in
      relational-effects-extra-dof.yaml: the absolute clock rate
      suppression, not just the relative comparison between clocks.

  status_of_this_section: >
    The derivative-level interpretation is a subsequent step. Detailed
    treatment belongs in gravitational-waves-as-derivative-readout.yaml
    (to be drafted), which works out the projection explicitly.

---

# ─────────────────────────────────────────────
# §6b  c_eff AS THE ABSOLUTE Π_EFF VALUE
# ─────────────────────────────────────────────

c_eff_as_absolute_pi_eff:

  statement: >
    The effective propagation speed c_eff = c · (Π_eff / Π_eff,base)
    is not merely a correction factor. It is the observable expression
    of the absolute Π_eff value — the extra DoF that GR projects out.

  what_this_means: >
    GR predicts gravitational waves propagate at exactly c in vacuum.
    This is correct at the derivative level where only differential
    metric perturbations are tracked. At the process level, the
    propagation speed depends on the absolute Π_eff — which varies
    with local commitment density.

  testable_distinction: >
    In near-vacuum (void environments, far from mass concentrations):
      Π_eff ≈ Π_eff,base → c_eff ≈ c. GR and process account agree.
    In strong-field environments (near neutron stars, black hole
    approach, high-density regions):
      Π_eff < Π_eff,base → c_eff < c. Process account predicts
      sub-luminal gravitational wave propagation. GR predicts c.
    This is in principle distinguishable — a deviation from c in
    multi-messenger observations (GW + EM signal timing) from
    high-density source environments would be the signal.

  connection_to_alpha_gap: >
    The same mechanism produces the 2.2 ppm gap between geometric
    and measured α: the commitment-dense lab environment compresses
    Ω_embed. The c_eff deviation is the gravitational-wave analogue
    — the absolute Π_eff value imprinting on the propagation speed
    in commitment-dense environments. Both are expressions of the
    same extra DoF at different scales.

---

# ─────────────────────────────────────────────
# §7  CONNECTION TO CCR WAVE STATE
# ─────────────────────────────────────────────

ccr_wave_state_connection:

  statement: >
    The CCR framework distinguishes two states of the electron:
      CCR_wave = 1/π  — primary state, full phase dynamics, not localised
      CCR_particle = α — localised state after R5 selection by interaction

    This distinction has direct consequences for gravitational adjustment.

  unanchored_rotor_produces_no_coherent_signal: >
    An electron in the wave state (CCR = 1/π) has no localised commitment
    density η. Its Π_eff depletion is distributed over the full Möbius
    trajectory — not localised, no persistent ∇Π_eff, no coherent
    gravitational adjustment signal. The depletion exists but is
    phase-averaged to near-zero over the 720° cycle.

    This is not because the wave-state electron has no mass — it has
    I_rot as trapped rotational inertia. It is because I_rot without
    localisation does not produce a directed ∇Π_eff that other
    structures can respond to coherently.

  localisation_produces_signal: >
    After R5 selection (CCR = α), the commitment density is localised.
    A persistent, directed ∇Π_eff exists. The electron now participates
    in gravitational adjustment — its anchoring has a price that the
    surrounding substrate experiences.

  superposition_consequence: >
    A system in genuine quantum superposition (CCR near 1/π, multiple
    Möbius trajectories coherently active) produces no coherent
    gravitational adjustment signal — the depletion contributions
    from different trajectory components interfere destructively.
    Gravitational effect scales with localisation degree — with
    the CCR value between 1/π and α.

    This is a testable prediction: quantum systems in superposition
    should show reduced gravitational effect proportional to their
    degree of coherence, measurable in principle as deviation from
    the classical mass expectation in precision experiments.

  referencing_requirement: >
    Local anchoring — and therefore gravitational effect — requires
    a reference structure. A single unanchored 720°-Möbius rotor in
    complete vacuum has no orientation reference against which to
    define "oben/unten, links/rechts." R5 localisation requires
    either an existing Π_eff gradient (mass field) or a second
    structure providing mutual reference (minimum two-body condition).
    This is why gravitational coupling is always relational — never
    a property of a single isolated structure.

