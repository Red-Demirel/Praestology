# ─────────────────────────────────────────────
# §6  EPISTEMIC STATUS SUMMARY
# ─────────────────────────────────────────────

epistemic_status:

  established:
    - "Regress (R_diss) dissolves weakly-protected topology at rates proportional to Π_eff (existing framework)."
    - "Hawking radiation is compatible with Regress at the horizon (closure-configuration-ratio.yaml)."
    - "Π_eff suppression by committed topology is the mechanism of local compression (inside-out-channeling.yaml)."
    - "Quanta are the indivisible units of CCR cost per R3→R5 event (quanta-as-ccr-cost.yaml)."

  hypothesis:
    - "CCR > 1 is the over-committed regime; δ = CCR − 1 is a real excess that must dissipate."
    - "The dissipation is thermal because δ is scalar, not orientational."
    - "Hawking radiation, Unruh effect, unstable decay, Λ, zitterbewegung, and Planck foam are parallel instances of excess dissipation at different scales."
    - "Dissipation rate scales with boundary area, not volume."

  prerequisite:
    - "The boundary-condition clarification: is CCR = 1 the uncommitted limit (Reading A) or the saturation limit (Reading B)?"

  what_would_upgrade_the_hypothesis_to_derivation:
    - "Reading B adopted in closure-configuration-ratio.yaml."
    - "Explicit derivation of dE/dt from the master equation with δ as source."
    - "Recovery of T_H and S ∝ A from the derived rate."
    - "Correlation of unstable-particle lifetimes with derived CCR-excess values."

  what_would_falsify_the_hypothesis:
    - "Black hole evaporation independent of local Π_eff."
    - "Volumetric black hole entropy."
    - "No correlation between unstable-particle lifetime and derived CCR-excess."
    - "Boundary-condition clarification resolved in favour of Reading A."

