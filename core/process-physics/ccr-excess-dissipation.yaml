# ─────────────────────────────────────────────
# §5  WHAT NEEDS TO BE ESTABLISHED
# ─────────────────────────────────────────────

open_items:

  - id: "boundary-condition-clarification"
    description: >
      Resolve whether CCR = 1 is the uncommitted limit (Reading A) or
      the saturation limit (Reading B). This is the prerequisite.
      If Reading A is correct, this file is empty. If Reading B, the
      hypothesis is live.
    priority: 1
    depends_on: ["closure-configuration-ratio.yaml internal consistency"]

  - id: "excess-dissipation-rate-derivation"
    description: >
      Derive the dissipation rate dE/dt from the master equation
      with the CCR-excess as a source term. The current estimate
      (dE/dt ∝ Π_eff · δ · A) is dimensional analysis, not derivation.
    priority: 2
    depends_on: ["boundary-condition-clarification"]

  - id: "hawking-temperature-from-delta"
    description: >
      Show that the Hawking temperature is derivable from the local
      Π_eff and the excess fraction δ at the horizon. Should recover
      T_H = ℏc³/(8πGMk_B) in the appropriate limit. If the derived
      formula differs from the standard one, quantify the difference.
    priority: 2
    depends_on: ["excess-dissipation-rate-derivation"]

  - id: "area-scaling-from-boundary-delta"
    description: >
      Show that the Bekenstein-Hawking entropy (S ∝ A) follows from
      δ being a boundary phenomenon. If the framework predicts area
      scaling for black holes, this is a strong internal consistency
      check. If it predicts volume scaling, the hypothesis is wrong.
    priority: 2
    depends_on: ["excess-dissipation-rate-derivation"]

  - id: "particle-lifetime-from-ccr-excess"
    description: >
      Once SIM-001 and SIM-005 provide CCR values for unstable particles,
      check whether decay lifetimes correlate with δ = CCR − 1. If not,
      the hypothesis fails at the particle scale.
    priority: 3
    depends_on: ["SIM-001-v3", "SIM-005-v2"]

