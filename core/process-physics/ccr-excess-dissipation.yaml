# ─────────────────────────────────────────────
# §3  PARALLEL CANDIDATES
# ─────────────────────────────────────────────

parallel_candidates:

  statement: >
    Under the excess-dissipation hypothesis, several phenomena the
    framework currently treats separately become instances of the
    same mechanism at different scales. This is offered as a
    structural convergence, not as a claim that the mechanism has
    been derived.

  hawking_radiation:
    over_commitment_source: "Infalling matter pushing local CCR above 1 near the horizon"
    dissipation_signature: "Thermal flux at the horizon"
    framework_alignment: >
      Compatible with closure-configuration-ratio.yaml's claim that
      Hawking radiation is Regress at the horizon. The new content is
      the *trigger*: Regress activates because δ > 0, not because of
      a separate horizon condition.
    standard_reading_mapping:
      event_horizon: "Surface where infalling matter pushes local CCR above 1"
      hawking_temperature: "Set by local Π_eff times the excess fraction δ at the horizon"
      bekenstein_hawking_entropy: "Measure of the phase space the over-committed configuration *would* need — see §4 on area scaling"
      evaporation: "Continuous dissipation of δ as thermal flux, shrinking the configuration back toward CCR = 1"

  unruh_effect:
    over_commitment_source: "Accelerated frame locally compresses phase space"
    dissipation_signature: "Thermal bath in the accelerated frame"
    framework_alignment: >
      Acceleration changes the local Π_eff seen by the configuration.
      In a sufficiently accelerated frame, the effective phase space
      available to the configuration is compressed, and the intrinsic
      CCR exceeds the local viable range. The excess dissipates as
      thermal flux — the Unruh bath.
    relationship_to_hawking: "The Unruh effect is the local-frame version of the horizon phenomenon."

  unstable_particle_decay:
    over_commitment_source: "Unstable particles have intrinsic CCR marginally above 1"
    dissipation_signature: "Decay to products with CCR ≤ 1"
    framework_alignment: >
      Some committed configurations may have CCR values that place
      them marginally above the saturation boundary even in vacuum.
      These are unstable — they cannot persist because their intrinsic
      cost exceeds what the environment can sustain. They decay to
      products whose combined CCR ≤ 1.
    prediction: >
      Decay lifetimes should correlate with the excess δ = CCR − 1
      of the decaying particle. Higher excess → faster decay. This is
      testable against the existing particle spectrum once CCR values
      are computed from topology (SIM-001, SIM-005).

  vacuum_energy:
    over_commitment_source: "Global CCR of the universe near 1"
    dissipation_signature: "Slow dissipation at cosmic scales (R_diss)"
    framework_alignment: >
      The cosmological constant (Λ) is already identified in the
      framework as R_diss at cosmic scales. Under the excess hypothesis,
      the global CCR of the universe sits marginally above 1, and the
      excess dissipates as the observed cosmic acceleration. This is
      consistent with the framework's existing claim that Λ is not a
      constant but an environment-dependent dissolution rate.
    prediction: >
      The dark energy equation of state should show a small deviation
      from w = −1 that traces the excess δ. The size of the deviation
      scales with the current over-commitment fraction — testable in
      principle, likely below current sensitivity.

  zitterbewegung:
    over_commitment_source: "Electron CCR marginally close to 1"
    dissipation_signature: "Local fluctuation of the excess"
    framework_alignment: >
      The electron is at CCR¹ = 1 — the saturation boundary. Small
      fluctuations in local Π_eff will momentarily push the electron
      either below 1 (under-committed, marginal) or above 1 (excess,
      which immediately dissipates). Zitterbewegung would then be the
      observable signature of this boundary-layer fluctuation.
    status: "SPECULATIVE — offered as a candidate connection, not asserted"

  planck_scale_foam:
    over_commitment_source: "Local CCR approaches 1 at the Planck scale"
    dissipation_signature: "Virtual pair production as excess dissipation"
    framework_alignment: >
      At the Planck scale, the healing length ξ and the saturation
      density n_sat approach the same scale. Every local attempt to
      commit exceeds the phase space locally available. The excess
      dissipates immediately as virtual pair production. This is
      compatible with the framework's existing account of pre-R5
      fluctuations as the vacuum carpet.
    status: "SPECULATIVE — noted for completeness, not developed"

---

# ─────────────────────────────────────────────
# §4  FALSIFICATION CONDITIONS
# ─────────────────────────────────────────────

falsification:

  statement: >
    The excess-dissipation hypothesis is falsified if any of the
    following hold. Each condition is specific enough to be checked
    against observation or derivation once the prerequisite
    clarification is resolved.

  conditions:
    - condition: >
        Black hole evaporation rate is independent of the local Π_eff
        (contrary to the CCR-excess scaling dE/dt ∝ Π_eff · δ · A).
      what_would_show_it: >
        Precise measurements of Hawking-like radiation from analogue
        systems (BEC horizons, optical horizons) where Π_eff can be
        varied independently of the geometric horizon.
      current_status: "Not yet tested; analogue systems are the near-term test bed."

    - condition: >
        Black hole entropy scales volumetrically rather than with
        boundary area, contradicting the excess hypothesis's
        prediction that δ is a boundary phenomenon.
      what_would_show_it: >
        Any confirmed volumetric entropy law for black holes. Current
        theory and observation (Bekenstein-Hawking) favour area scaling,
        which supports the hypothesis. A volumetric result would falsify it.
      current_status: "Area scaling is well-established; hypothesis is consistent."

    - condition: >
        Unstable particle decay lifetimes show no correlation with any
        topologically-derived excess δ once SIM-001 and SIM-005 close.
      what_would_show_it: >
        Comparison of derived CCR values for unstable particles against
        their measured lifetimes. If no correlation appears, the
        hypothesis fails at the particle scale.
      current_status: >
        Pending SIM-001 and SIM-005 results — this is a downstream
        test that will become available once the quantitative CCR
        values are computed.

    - condition: >
        The boundary-condition clarification is resolved in favour of
        Reading A (CCR = 1 is the uncommitted limit), which would close
        the range (1, ∞) and preclude over-commitment entirely.
      what_would_show_it: >
        Internal consistency checks in closure-configuration-ratio.yaml
        and ccr-iteration-by-depth.yaml. If Reading A turns out to be
        the only consistent reading, this hypothesis is empty.
      current_status: "Open — the clarification is the prerequisite."

    - condition: >
        The Unruh effect is measured to be independent of acceleration-
        induced Π_eff compression in a regime where the hypothesis
        predicts a specific correction.
      what_would_show_it: >
        Precision tests of the Unruh effect in analogue systems
        (accelerated mirrors, BEC analogues) at sensitivity sufficient
        to detect deviations from the standard linear-in-acceleration
        temperature formula.
      current_status: "Not yet tested at required sensitivity."

