# /core/process-physics/ccr-excess-dissipation.yaml
name: "CCR Excess Dissipation: Over-Commitment and the Origin of Thermal Flux"
version: "0.1"
status: "SOPHISTICATED HYPOTHESIS — structurally consistent with the framework;
         requires the boundary-condition clarification (open item 1) before
         becoming a derivation. Hawking radiation, Unruh effect, particle
         decay, and vacuum-energy dissipation identified as parallel
         candidates for the same mechanism. Falsification conditions stated."
domain: "Core / Process-Physics"

description: >
  The framework currently admits CCR in (0, 1) — the viable band for
  committed topology. This file explores whether the upper boundary is
  actually CCR = 1 (saturation) rather than CCR = 1 (uncommitted limit),
  which would open the range (1, ∞) as an over-committed regime. Any
  configuration pushed above CCR = 1 by environmental compression would
  then carry an excess δ = CCR − 1 that cannot be held as topological
  lock and must dissipate. The hypothesis: this excess dissipation is
  the common mechanism underlying Hawking radiation, the Unruh effect,
  unstable-particle decay, and several related phenomena that the
  framework currently treats separately.

  This is a candidate, not a derivation. The prerequisite structural
  clarification — whether CCR = 1 denotes the uncommitted limit or the
  saturation limit — must be resolved first.

dependency_map:
  requires:
    - "core/closure-configuration-ratio.yaml"
    - "core/process-physics/gravity-and-ccr-threshold.yaml"
    - "core/inside-out-channeling.yaml"
    - "core/process-physics/quanta-as-ccr-cost.yaml"
    - "core/process-physics/relational-effects-extra-dof.yaml"
    - "core/process-physics/commitment-depletion-duality.yaml"
  relationship_to_existing_files: >
    The framework already states that Regress (R_diss) dissolves
    weakly-protected topology at rates proportional to Π_eff. This
    file proposes that the *trigger* for Regress at compressed
    boundaries is the CCR-excess δ, and that the dissipation
    signature is thermal. The mechanism is compatible with existing
    files; the specific trigger condition is new.

---

# ─────────────────────────────────────────────
# §1  PREREQUISITE: BOUNDARY-CONDITION CLARIFICATION
# ─────────────────────────────────────────────

prerequisite_clarification:
  statement: >
    Before the excess-dissipation hypothesis can be evaluated, the
    framework must clarify the meaning of CCR = 1 in
    closure-configuration-ratio.yaml. The file currently states:

      CCR = 1  →  topology occupies full phase space = uncommitted field
                  (impossible for realized committed topology)

    But elsewhere (ccr-iteration-by-depth.yaml) CCR¹ = 1 is used as the
    reference unit for the electron's equilibrium. These are two
    different claims about the same value:

      Reading A: CCR = 1 means "uncommitted" — no realized topology
      Reading B: CCR = 1 means "saturated" — full occupancy of the viable phase space

    The two readings are compatible only if "uncommitted" and "saturated"
    are the same limit — which they may not be.

  proposed_clarification: >
    Adopt Reading B: CCR = 1 is the *saturation* boundary. The
    uncommitted limit is a higher value — call it the phase-space
    capacity of the embedding, which is ≥ 1 and generally > 1. Under
    this reading:

      0 < CCR < 1   Under-committed — partial occupancy
      CCR = 1       Saturated — full occupancy of viable phase space
      CCR > 1       Over-committed — exceeds viable phase space

    The electron's equilibrium at CCR¹ = 1 becomes "saturated,"
    which is consistent with the electron being topologically
    protected (a saturated closure).

  consequence: >
    If Reading B is adopted, the range (1, ∞) opens as an
    over-committed regime. Any configuration pushed above 1 by
    environmental compression carries an excess δ = CCR − 1 which
    cannot be held as topological lock. The excess must dissipate.

  status: >
    OPEN — this is the prerequisite structural clarification. Until
    it is resolved, the excess-dissipation hypothesis is a candidate
    conditional on Reading B being adopted. The framework should
    decide between Reading A and Reading B on independent grounds
    (consistency with the rest of the closure conditions) before
    evaluating the hypothesis.

---

# ─────────────────────────────────────────────
# §2  THE EXCESS-DISSIPATION HYPOTHESIS
# ─────────────────────────────────────────────

hypothesis:

  statement: >
    When environmental compression (high P_env, high local η) pushes
    the local CCR above 1, the excess δ = CCR − 1 cannot be stored as
    committed topology. It dissipates through whatever channels are
    available at the boundary of the over-committed region. The
    dissipation is thermal because δ is a scalar over-commitment —
    no specific orientation is being radiated, only magnitude excess.

  mechanism:
    trigger: >
      Local CCR exceeds 1 due to compression. The configuration's
      writhe-weighted phase-space volume exceeds the locally available
      embedding capacity.
    what_the_excess_is: >
      δ = CCR − 1 is the fraction of the configuration's topological
      cost that cannot be held by the current embedding. It is a
      real-valued quantity with units of CCR — dimensionless, but
      not physically meaningless: it is the magnitude of the mismatch
      between the intrinsic configuration and the local environment.
    dissipation_channels:
      thermal_radiation: >
        The excess couples to the surrounding Π_eff field and radiates
        as phase-space quanta (quanta-as-ccr-cost.yaml). The radiation
        is thermal because δ has no orientational structure — it is a
        scalar magnitude of over-commitment, radiating equally into
        whatever channels are open at the boundary.
      regress: >
        R_diss (Regress) dissolves weakly-protected committed topology
        at a rate proportional to Π_eff. Under the excess hypothesis,
        the trigger for Regress at the boundary is precisely δ > 0 —
        the local CCR exceeding the viable range.
      geometry_dependent_coupling: >
        The relative weight of thermal radiation vs. Regress depends on
        the geometry of the over-committed region. Small regions
        dissipate primarily as radiation; large regions dissipate
        primarily as Regress. The transition scale is the healing
        length ξ.

  rate_estimate:
    order_of_magnitude: >
      Dissipation rate scales as
        dE/dt  ∝  Π_eff · δ · A_boundary
      where A_boundary is the area of the over-committed region's
      boundary. The area scaling (not volume) is a structural
      prediction of the hypothesis — see §4 on falsification.
    why_area: >
      The excess δ is a boundary phenomenon, not a volume phenomenon.
      The interior of an over-committed region is fully saturated
      (CCR = 1 at the boundary layer); the excess exists only where
      CCR transitions from 1 to the interior value. It is the surface
      where the mismatch between configuration and environment is
      expressed.

  epistemic_status: >
    HYPOTHESIS — the mechanism is structurally consistent with
    existing framework claims (Regress, Π_eff suppression, quanta
    as CCR cost). The specific trigger condition (δ > 0 at the
    compressed boundary) is new. The rate formula is an estimate,
    not a derivation.

