---

foundational_vocabulary:
  statement: >
    Resonance, dissonance, and interference are the fundamental vector
    interaction vocabulary from which forces emerge as higher-iteration
    expressions. All derivable from the scalar overlap s = ⟨L₁L₂⟩₀
    and bivector gradient ⟨G⟩₂ = ⟨L₁L₂⁻¹⟩₂ (ga-dynamic-theory.yaml).

  resonance:
    definition: >
      High scalar overlap (s → maximum), zero bivector gradient (⟨G⟩₂ → 0).
      Lock configurations aligned — geometric products reinforce in grade-0.
      Phase relationships constructively add; no mismatch to resolve;
      maximum mutual stability.
    wave_regime: "Constructive interference — amplitude reinforcement"
    committed_regime: "Binding — stable coupled lock configurations
                       (electron pairs, three-fold proton binding)"
    same_condition: "Both are s → maximum at different closure states"

  dissonance:
    definition: >
      Low scalar overlap (s → 0 or negative), high bivector gradient
      (⟨G⟩₂ large). Configurations misaligned — geometric products
      produce predominantly grade-2 output, minimal grade-0 component.
      Maximum neighbourhood stress; shear_resolution strongly driven.
    wave_regime: "Destructive interference — amplitude cancellation"
    committed_regime: "Repulsion — like-charge configurations;
                       Pauli exclusion between identical lock states"
    same_condition: "Both are s → 0 at different closure states"

  interference:
    definition: >
      Superposition of multiple lock configurations in the open regime
      before closure. Scalar overlaps and bivector gradients of all
      contributing configurations sum across the neighbourhood.
    constructive: >
      Where s values add: local configuration space deepens toward
      closure — higher R5 firing probability. Bright fringe.
    destructive: >
      Where s values cancel: local phase space flattens — R5 suppressed.
      Dark fringe.
    pattern: >
      The interference pattern IS the gradient field ∇s across the
      neighbourhood before any R5 event fires. The spatial map of
      scalar overlap variation is the interference pattern — the direct
      expression of the relational configuration state in the open regime.
      Not a derived consequence; the ∇s field is the interference pattern.

---

gravity_inertia_as_one_r5_event:
  statement: >
    Gravity and inertia are the same R5 commitment depth read from
    two different positions: the neighbourhood reads it as ∇s (gravity);
    the structure reads it as rank(M) (inertia). Their equality —
    the equivalence principle — is the algebraic statement that one
    R5 event produces the same quantity from both sides.

  gravity_first_order:
    statement: >
      Gravity is the first-order scalar gradient ∇s operating directly
      on committed grade-3 lock density. No carrier configuration —
      the gradient propagates through the open neighbourhood as the
      direct expression of scalar overlap variation between committed
      structures. The neighbourhood is pulled toward higher s.
    what_it_is_not: >
      Gravity is NOT a second-iteration force with a carrier (graviton).
      Attempting to quantize gravity as a second-iteration interaction
      fails because it treats the first-order ∇s as if it were a
      second-order bivector gradient ⟨G⟩₂ — applying the iteration
      logic of EM/weak/strong to an interaction that operates at one
      level below. This is the category error that produces
      non-renormalizable infinities: second-order quantization machinery
      applied to a first-order gradient produces divergences that have
      no process-level regulator because the regulator (finite Π_eff)
      operates at the process level, not at the derivative-level
      perturbative expansion around a fixed background ∇s.
    connection: "gravity-inertia-equivalence-from-r5.yaml — full mechanism"

  inertia_inside_reading:
    statement: >
      Inertia is the resistance of a committed structure's own lock state
      to reconfiguration — rank(M) of the closure matrix (ga-dynamic-theory.yaml
      #inertia_measure) resisting change. When an external ∇s gradient
      acts on a committed structure, the structure's own inward closure
      resists the implied reconfiguration. The resistance is proportional
      to how many degrees of freedom have already been locked — how deep
      the R5 commitment was.
    equality_with_gravity: >
      Gravitational mass (how strongly a structure generates ∇s in its
      neighbourhood, proportional to its grade-3 lock density) and
      inertial mass (how strongly it resists external ∇s gradients,
      proportional to rank(M)) are equal because:
        Grade-3 lock density ∝ rank(M) — the same committed degrees
        of freedom that generate the gradient also resist being changed.
        One R5 event, one commitment depth, two readings.
      The equivalence principle is not a coincidence requiring explanation —
      it is the algebraic identity between the outside-reading and the
      inside-reading of the same closure depth.

---

iteration_principle:
  statement: >
    Forces are second-order vector interactions: open-regime mismatch
    propagation (grade-1/2) between configurations that have already
    undergone one round of closure (grade-2/3 locks). The force is
    the open-regime echo of closed-regime mismatch.

  first_iteration: >
    Grade-1 flows producing grade-2 bivector structure through
    orientational intersection. The R3 vorticity interface — first
    closure round producing locked orientational planes. No forces yet;
    this is the wave/pre-particle regime.

  second_iteration: >
    Mismatch between already-closed grade-2/3 configurations generates
    a propagating open-regime gradient. The closed configurations cannot
    simply realign (high inertia_measure); instead their mismatch drives
    a grade-1/2 propagation through the surrounding open neighbourhood.
    This propagating mismatch gradient is the force. The force carrier
    is the propagating pattern itself — an open-regime vector interaction
    between closed-regime structures.

  why_em_is_the_template: >
    EM is the second-iteration vector interaction at the lowest closure
    grade (grade-2 rotors), with the simplest carrier (photon: fully open,
    massless — counter-oriented rotors cancel all grade-2 character,
    leaving pure grade-1 propagation). EM was described first and most
    completely in vector/field terms because it is the most direct
    translation of second-iteration GA structure into committed-level
    observables. Other forces required QFT because their carriers have
    closure costs (mass) or self-interactions — not failures of the
    vector approach but consequences of operating at higher closure grades.

