      self-coupling automatically.
    residual_freedom: "SU(3) — three orientation degrees of freedom
                       before full pseudoscalar commitment"
    rotor_expression: "forces-as-rotor-consequences.yaml #strong_force_emergence"

---

resonance_to_force_chain:
  statement: >
    The complete chain from fundamental vector interactions to forces:

      Scalar overlap s = ⟨L₁L₂⟩₀
           ↓ variation across neighbourhood
      Gradient g = ∇s                →  GRAVITY (first order)
      Bivector gradient ⟨G⟩₂         →  RESONANCE / DISSONANCE
           ↓ between grade-2 closed configurations
      Grade-1 open carrier           →  EM (second order)
           ↓ topology-switching mismatch, grade-2 partial carrier
      Grade-2 partial-closure carrier →  WEAK (second order, higher)
           ↓ three-fold binding mismatch, self-interacting carrier
      Grade-2/3 self-interacting     →  STRONG (second order, maximum)

    Resonance and dissonance are the open-regime expressions of the
    same scalar overlap and bivector gradient that produce forces
    in the closed-regime. Wave behaviour and forces are not categorically
    different — they are the same vector interaction algebra at different
    closure states.

  inertia_position: >
    Inertia sits outside this chain — it is not a force but the
    resistance of closed configurations to being moved through the
    chain by external ∇s (gravity). The chain describes forces between
    committed structures; inertia describes why those structures resist
    being affected by forces. Inertia is rank(M); force is ∇s or ⟨G⟩₂;
    the equivalence principle is rank(M) ∝ grade-3 lock density.

