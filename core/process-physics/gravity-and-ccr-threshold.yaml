    priority: 2

  - id: "monotonicity-from-band"
    description: >
      Determine whether the viability-balance hypothesis forces a Goldilocks
      band on V_c(P_env), or whether the band is an additional assumption.
      The frozen-regime account suggests the band but the derivation is open.
    priority: 2

  - id: "8-over-3-as-vc-calibration"
    description: >
      If V_c can be derived from Π_eff (vc-from-pi-eff), check whether the
      stellar core Π_eff suppression is quantitatively consistent with
      V_c dropping below 8/3 — i.e., whether the SIM-007 residual provides
      a numerical calibration of the V_c(P_env) curve.
    priority: 3
    depends_on: ["vc-from-pi-eff", "SIM-007-v1"]

