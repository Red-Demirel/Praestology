             of committed topologies, not a background container.
             The two-body coupling is a primary constitutive relation."
    - file: "computation/sim004_v2_integrated.py"
      note: "Two-stage α structure: f_geom=1/π (EM, pre-R5 wave) and
             f_eq=ξ/R_core (closure correction). EM parallel to gravity
             framing: both fields intrinsically relational, different grades."
    - file: "core/commitment-depletion-duality.yaml → shared_landscape_anchoring_coupling"
      note: "Full derivation status, two-effects table, relational_coupling
             block (mutual constitution of Π_eff landscape by multiple
