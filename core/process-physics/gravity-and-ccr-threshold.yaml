---

framing_note:
  name: "Inertia as Anchoring, Gravity as Its Price"
  status: "STRUCTURAL CLARIFICATION — establishes the causal order
           between inertia and gravity within the framework. Prevents
           conflation of the two into a single mechanism."

  core_distinction:
    inertia:
      what_it_is: "The anchoring itself"
      description: >
        A committed topology maintains its relational position in
        the phase configuration space by continuously sustaining
        its CCR closure. This self-maintenance IS inertia: the
        resistance to change of state is the resistance to
        disrupting the self-anchoring process. The committed
        topology is its own center — not located in a background
        space but defining its relational position through the
        anchoring process itself.
      framework_terms: >
        I_rot (trapped rotational inertia), plane-independence
        cost (mass-as-plane-independence.yaml), CCR commitment
        cost of the closure topology.
      ontological_note: >
        The object as its own center: the locus of maximum
        commitment density is self-generated, not assigned by
        an external reference frame. There is no container;
        the committed topology defines its own relational
        position by anchoring to itself — drawing free potential
        from its surroundings and committing it continuously.

    gravity:
      what_it_is: "The price of that anchoring"
      description: >
        The Π_eff depletion field extending outward from the
        anchor into the surrounding relational environment.
        Other committed structures are drawn toward the depletion
        zone because their own propagation capacity (Π_eff) is
        lower in that direction — the variable kinetic term
        −∇·(Π_eff∇) biases their evolution toward the depletion.
        Gravity is not the anchoring; it is the spatial cost
        paid by the surrounding substrate for the existence of
        the anchor.
      framework_terms: >
        ∇Π_eff gradient in the local-explicit master equation;
        the 1/Π_eff prefactor on the time derivative (time
        dilation at the anchor); commitment-depletion-duality.yaml.

  causal_order:
    sequence: >
      (1) Committed topology sustains CCR closure  [inertia — anchoring]
          ↓
      (2) Π_eff depletion extends outward from anchor
          ↓
      (3) ∇Π_eff gradient in surrounding substrate  [gravity — price]
          ↓
      (4) Other structures biased toward depletion zone
    note: >
      The two-step structure is essential. Collapsing (1) and (3)
      into one thing loses the explanatory structure: without the
      distinction, the equivalence principle requires a separate
      derivation. With it, the equivalence principle is structurally
      transparent.

  equivalence_principle:
    statement: >
      Inertial mass = gravitational mass because the price is
      always proportional to the anchoring cost. A stronger
      anchor (higher I_rot, deeper CCR commitment) depletes
      more Π_eff — larger price. The proportionality is
      structural, not coincidental: the same CCR cost that
      makes a topology resist displacement (inertia) also
      determines the depth of Π_eff depletion it maintains
      (gravity). One cost, two observable faces.
    contrast_with_GR: >
      General Relativity postulates the equivalence principle
      as a foundation and builds the geometric machinery around
      it. Here the equivalence principle is a consequence, not
      a postulate — it follows from the single-cost structure
      of the CCR framework without additional assumptions.

  gravitational_waves:
    statement: >
      Changes in the anchoring process (accelerating masses,
      merging topologies) produce changes in the Π_eff depletion
      field that propagate outward at c_eff = c·Π_eff. These
      are gravitational waves — ripples in the price field of
      the anchoring process, not ripples in spacetime geometry.
      The wave carries information about changes in the anchor's
      CCR cost, not about geometry.
    speed: >
      Propagation at c_eff = c·Π_eff in the local substrate.
      In the near-vacuum Π_eff ≈ 1, so c_eff ≈ c — consistent
      with observed gravitational wave speed. Deviation from c
      is a prediction for strong-field regimes.

  newtonian_limit:
    statement: >
      The 1/r² falloff of Newtonian gravity is the spatial
      geometry of the Π_eff depletion field from a spherically
      symmetric anchor in the weak-field limit. The point-mass
      abstraction is valid because the depletion field of a
      spherically symmetric committed topology has point-source
      symmetry at large r — not because there is a physical
      point at the center, but because the committed topology's
      own center (the locus of maximum commitment density)
      acts as the effective source of the field at r >> R_core.

  cross_references:
    - file: "core/commitment-depletion-duality.yaml"
      note: "Π_eff depletion as the mechanism — this file adds
             the inertia/gravity distinction to that mechanism"
    - file: "core/process-physics/mass-as-plane-independence.yaml"
      note: "I_rot as the anchoring cost — the inertia side"
    - file: "core/process-physics/dirac-as-grade-chain-closure.yaml"
      note: "Π_eff dependence of I_rot — anchoring cost varies
             with local substrate conditions (strong-field correction)"
    - file: "core/process-physics/vortex-stability.yaml"
      note: "The committed topology whose anchoring produces gravity"
    - file: "core/emergent-relational-manifold.yaml"
      note: "The relational environment into which the price radiates —
             the manifold is constituted by the connectivity of
             committed topologies, not a background container"


gravity_role:
  statement: >
    Gravity does not adjust the ratio. It adjusts the threshold. The
    distinction matters because a ratio-level coupling would introduce a
    free parameter per depth, while a threshold-level dependence leaves the
    geometric content of CCR untouched.

  local_scale:
    character: "Reinforcement, not balance"
    mechanism: >
      Commitment raises η, lowers Π_eff, narrows the available R3 pathways.
      A narrower field commits more readily — fewer alternatives for the
      configuration to resolve among. This is why compression catalyzes
      closure rather than damping it.
    reference: "core/inside-out-channeling.yaml"

  global_scale:
    character: "Conservation, not correction"
    mechanism: >
      The assembly map holds K₀ and K₁ commensurate. The balance is what
      the local reinforcement looks like when read at the scale where
      reinforcement and its counterweight become one fact under two
      resolutions — not an opposing force but the same process seen globally.
    reference: "core/process-physics/baum-connes-assembly-map-correspondence.yaml"

  what_gravity_is_not:
    - "Not a force pushing back against closure"
    - "Not a denominator term in CCR"
    - "Not an environmental coupling constant per depth"

---

formulation:
  ccr_geometric:
    statement: >
      The Closure Configuration Ratio remains a ratio of geometric quantities.
      No environmental term enters.
    form: "CCR^d = (Wr_d · Ω_rotor(T_d)) / Ω_embed(d)"
    status: >
      Established at d=1 (Wr=3/2, CCR¹=1). Open above — the equilibrium
      shape and therefore the invariant entering the numerator are not yet
      computed for d≥2 (ccr-iteration-by-depth.yaml).

  closure_condition:
    statement: >
      Closure is achieved when the configuration is invariant under its own
      closure map, judged against a threshold that depends on ambient phase
      pressure.
    form: "Φ_d(Q*) = Q*,  judged against V_c(d, P_env)"
    status: "OPEN — functional form of V_c(P_env) is not derived"

  what_changes_with_pressure:
    statement: >
      Pressure does not widen the numerator or narrow the denominator. It
      lowers the bar the numerator must clear — because pressure removes
      alternatives rather than adding capacity.
    high_pressure: >
      Stellar core, planetary interior: V_c lowered → closure more probable
      at the same geometric ratio. Stellar nucleosynthesis is the canonical
      case: the residual phase tension of partial closures (quarks, partial
      bivector activations) can exceed V_c in stellar conditions even when
      it cannot in free space.
    low_pressure: >
      Voids, galactic outskirts: V_c raised → closure less forced, structures
      more easily dissolved. Consistent with void-dominant dissolution in
      friedmann-emergence.yaml and regional-bias-and-age-estimates.yaml.

---

nucleosynthesis_as_vc_crossing:
  statement: >
    The N=4 residual F=8/3 from SIM-007-v1 (test-spec-depth2-triality-closure
    .yaml) provides the concrete example of gravitational catalysis as V_c
    crossing — without modifying the CCR ratio.
  mechanism: >
    In Cl(3,0), four partial-writhe paths (quarks) cannot achieve mutual
    Clifford orthonormal closure — the anticommutator functional F reaches
    a minimum of 8/3, not zero. This residual tension is the non-additive
    CCR_binding that requires depth-3 (S⁷ linking) to resolve.
    Whether this residual triggers depth-3 closure or dissolves back into
    Regress depends on V_c:
      Low P_env (void, free space):
        V_c is high. The residual 8/3 lies below V_c.
        The partial configuration dissolves — no depth-3 closure.
        This is why heavy elements do not form spontaneously in free space.
      High P_env (stellar core):
        V_c is lowered by the compressed Π_eff environment.
        The same residual 8/3 now exceeds V_c.
        Depth-3 closure proceeds — S⁷ linking triggers nuclear binding.
        This is stellar nucleosynthesis: not that gravity makes the ratio
        favorable, but that it lowers V_c enough for the existing geometric
        tension to trigger the next depth's branch.
  precision: >
    The CCR ratio is the same in both environments. The geometry of the
    partial-writhe paths is unchanged by the stellar environment. What
    changes is V_c — the threshold the geometric tension must exceed to
    trigger commitment. Gravity catalyzes nucleosynthesis by lowering the
    bar, not by enhancing the signal.

---

goldilocks_question:
  statement: >
    Whether V_c(P_env) is monotone or has a minimum is open. The viability-
    balance hypothesis predicts a band: both too little and too much pressure
    destabilize closure.
  monotone_case:
    form: "V_c decreases monotonically with P_env"
    implication: >
      Compression always catalyzes. Does not explain why extreme compression
      (degenerate matter, black hole interiors) does not produce runaway closure.
  band_case:
    form: "V_c has a minimum at some P_env*, rising at both extremes"
    implication: >
      Compression catalyzes up to P_env*, then destabilizes. Matches the
      viability-balance hypothesis and the frozen-regime account: at Π_eff→0
      (extreme compression near black hole), the process rate halts — not
      because V_c is crossed but because the process itself cannot fire.
      The band case is consistent with the frozen regime as the high-P_env
      limit of rising V_c.
  discriminator: >
    The two cases make different predictions for degenerate matter:
    monotone → further closure; band → frozen regime. The framework's
    existing frozen-regime account favours the band case, but this is
    not yet derived.

---

corrections:
  - prior: "CCR^d_eff with (1 + γ_macro · P_env) in the denominator"
    reason: >
      Introduces a free parameter γ_macro per depth; changes the direction
      of the effect when configuration starts below CCR=1; duplicates the
      threshold mechanism that already exists.
    corrected: "CCR^d unchanged; P_env enters V_c only"

  - prior: "Wr_d, Ω_rotor, Ω_embed evolve along independent trajectories"
    reason: >
      Independence voids the constraint — the CCR becomes a bookkeeping
      identity any three numbers can satisfy.
    corrected: >
      Coupled rates. The equilibrium shape determines Wr_d; the shape's
      phase space is Ω_rotor; the next depth's domain is Ω_embed.
      Asynchronous, not independent.

  - prior: "Gravity as balancing feedback mechanism"
    reason: >
      Balance is correct globally (assembly map conservation) but wrong
      locally (commitment reinforces commitment, not opposes it).
    corrected: >
      Reinforcement locally; conservation globally. Balance is what the
      two look like as one fact under two resolutions.

