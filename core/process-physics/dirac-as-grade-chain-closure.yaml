# /core/process-physics/dirac-as-grade-chain-closure.yaml
name: "Dirac Equation as Grade-Chain Closure: Derivation, Not Re-Expression"
version: "0.3"
status: "STRUCTURAL DERIVATION — equation form derived from grade chain;
         particle taxonomy as solution classes; dimensional consistency
         of μ flagged open; computational confirmation via SIM-004/SIM-001
         and depth1_sat_closure.py available"
domain: "Core / Process-Physics"

description: >
  The Dirac equation in Cl(3,0) is not a re-expressed standard equation.
  It is the closure equation whose fixed points are the grade-chain particle
  structures: photon, electron, quark, proton. The equation is DERIVED from
  the requirement that the grade chain admit stable closures. The mass term
  is not an external parameter — it is the trapped rotational inertia of
  the closure, computed from the topology. The 720° boundary condition is
  not imposed — it follows from the bivector algebra.

dependency_map:
  requires:
    - "core/process-physics/ga-grade-chain-to-particles.yaml"
    - "core/process-physics/rotor-to-ccr-transition.yaml"
    - "core/process-physics/closure-types-nesting.yaml"
    - "core/closure-configuration-ratio.yaml  [repo-only]"
    - "core/process-physics/bivector-partial-parameters.yaml"
    - "core/terminology-canonical.yaml"
  provides_to:
    - target: "core/process-physics/ga-grade-chain-to-particles.yaml"
      via: "Equation whose solutions are the grade-chain structures"
    - target: "core/process-physics/forces-as-rotor-consequences.yaml"
      via: "Dirac sector as the spin-½ closure case"

---

design_choice:
  statement: >
    Two possible routes for the Cl(3,0) Dirac equation:
      (A) Strict re-expression of the standard Dirac-Hestenes equation.
      (B) Derivation from the grade chain and the closure condition.
    The framework adopts (B). Reason: (A) imports the equation as
    fundamental and leaves the mass, spin-½, and 720° structure as
    unexplained inputs. (B) derives the equation from structures that
    must already exist — the equation is a consequence, not a starting point.
  what_changes:
    mass_term: >
      (A) keeps m as an external parameter. (B) replaces m with I_rot
      (Trapped Rotational Inertia per terminology-canonical.yaml). The
      relationship m c² = I_rot ω_Φ² / 2 is derived from the closure
      condition, not fitted. Standard notation m is retained in the
      comparison_to_standard_dirac section only, with explicit translation.
    boundary_condition: >
      (A) imposes 720° periodicity by hand. (B) shows that the bivector
      Ie₃ = B₁ = e₁e₂ generates the double-cover structure automatically;
      720° is a consequence of the algebra.
    particle_taxonomy: >
      (A) treats photon, electron, quark, proton as separate cases.
      (B) shows them as solution classes of one equation with different
      boundary conditions.

---

grade_chain_structures:
  statement: >
    The grade chain establishes what structures must exist before any
    equation is written. Each structure is a configuration in Cl(3,0)
    with a specific grade content.

  entries:
    - structure: "Photon"
      ga_object: "R · R† (counter-oriented rotor pair)"
      grade_content: "Grade-1 residual only — grade-2 cancels"
      closure_status: "No closure — propagates freely"
      mass: "Zero — no trapped phase (I_rot = 0)"

    - structure: "Electron"
      ga_object: "R · R (co-oriented rotor pair)"
      grade_content: "Grade-2 deepened — doubled phase"
      closure_status: "720° closure — topologically protected"
      mass: "I_rot ω_Φ² / (2c²) — trapped rotational inertia"

    - structure: "Quark"
      ga_object: "R (single rotor, truncated at 2π)"
      grade_content: "Grade-2 fractional — partial activation"
      closure_status: "Incomplete — cannot close independently"
      mass: "Fractional (current quark mass)"

    - structure: "Proton"
      ga_object: "R₁ · R₂ · R₃ (three orthogonal rotors)"
      grade_content: "Grade-3 pseudoscalar — I² = -1"
      closure_status: "Complete — self-dual grade-3 volume"
      mass: "3 · (current quark I_rot contribution) + CCR_binding"
      mass_note: >
        The current quark I_rot contribution is small (~10 MeV total).
        CCR_binding dominates (~928 MeV) — the confined field energy
        of three orthogonal rotors at closure. The proton-electron
        mass ratio (~1836) is not derivable from this formula until
        CCR_binding is computed from the three-fold closure topology.
        Open: SIM-005.

---

derivation_of_the_equation:
  statement: >
    The equation is derived by requiring that the grade chain admit
    stable closures satisfying Q* = R_k[Q*]. The derivation proceeds
    in three steps: (1) write the closure condition, (2) identify the
    algebraic operator that has the grade-chain structures as fixed
    points, (3) express the operator in Cl(3,0) form.

  step_1_closure_condition:
    statement: >
      A stable configuration ψ is a fixed point of its own reconfiguration
      operator:
        Q* = R_k[Q*]
      At the process level, this means ψ satisfies a self-consistency
      equation whose fixed points are the grade-chain structures.

  step_2_operator_identification:
    statement: >
      The operator that has the grade-chain structures as fixed points
      must:
        (a) couple the spatial gradient to the spin bivector plane
            (so that propagation can fold into spin),
        (b) contain a term that vanishes for the photon (no trapped phase),
        (c) be non-zero for the electron (trapped phase),
        (d) be compositional for the proton (three-fold closure).
    the_operator: >
      The minimal operator with these properties is:
        ∇(·) I e₃ − μ(·)
      where:
        ∇ = e₁∂₁ + e₂∂₂ + e₃∂₃   (spatial vector derivative in Cl(3,0))
        I e₃ = e₁e₂e₃·e₃ = e₁e₂ = B₁   (spin bivector plane — the
          coupling term; derivation: I·e₃ = e₁e₂e₃·e₃ = e₁e₂(e₃²) =
          e₁e₂(+1) = e₁e₂ = B₁, using eᵢ² = +1 in Cl(3,0))
        μ   (closure cost per unit amplitude — see dimensional_note below)

  dimensional_note:
    statement: >
      The μ operator requires careful dimensional treatment. A naive
      substitution μ = I_rot ω_Φ² Π_eff / (2c² ħ) gives units:
        [kg·m²] · [s⁻²] · [1] / ([m²·s⁻²] · [kg·m²·s⁻¹]) = m⁻²
      but the equation ∇ψ Ie₃ − μψ = 0 requires μ to have units m⁻¹
      (matching the spatial gradient ∇ which has units m⁻¹).
      Resolution candidates:
        (i)  μ = I_rot ω_Φ Π_eff / (2c ħ)  — one power of ω_Φ, one of c;
             gives [kg·m²·s⁻¹] / ([m·s⁻¹]·[kg·m²·s⁻¹]) = m⁻¹ ✓
             Identification: ω_Φ/c = 1/λ_Compton (inverse Compton wavelength)
        (ii) Retain the mass parameter m explicitly:
             μ = mc/ħ = 1/λ_Compton  (standard Dirac mass term, units m⁻¹ ✓)
             with m c² = I_rot ω_Φ²/2 as a separate derived relation.
      Candidate (ii) is cleaner dimensionally and connects directly to
      the Compton wavelength as the spatial capacity threshold (issue_8).
      Candidate (i) requires showing ω_Φ/c = mc/ħ from the closure
      condition, which is an open derivation.
    current_status: >
      OPEN — the dimensional form of μ is not yet settled. Both candidates
      give μ units of m⁻¹ and recover the standard Dirac mass term in
      the appropriate limit. This file uses μ = mc/ħ for dimensional
      clarity, with the understanding that m = I_rot ω_Φ²/(2c²) is
      derived from closure, not an external parameter.
    adopted_form: "μ = mc/ħ = I_rot ω_Φ²/(2c³ħ)"

  step_3_cl30_expression:
    statement: >
      The closure equation is:
        ∇ψ I e₃ − μ ψ = 0
      expanded:
        (e₁∂₁ + e₂∂₂ + e₃∂₃) ψ (e₁e₂) − (mc/ħ) ψ = 0
      with m = I_rot ω_Φ²/(2c²) derived from the closure condition.
      Every symbol is a framework primitive or derived from one.
      Environmental dependence enters through Π_eff in the I_rot term —
      the effective mass varies with local free potential.

---

solution_classes:
  statement: >
    The equation ∇ψ Ie₃ − μψ = 0 has multiple solution classes,
    distinguished by boundary conditions and the grade content of ψ.
    The grade chain structures are these solution classes.

  photon_solution:
    boundary_condition: "No closure — ψ propagates without boundary periodicity"
    ansatz: "ψ = √ρ · exp(−½ B̂(ωt − kx)) · exp(Iβ/2)"
    substitution_result: >
      The Ie₃ term acts on the propagating bivector. The counter-orientation
      of the rotor pair cancels the grade-2 residue — the grade-2 components
      sum to zero. The μψ term vanishes because no phase is trapped (I_rot = 0
      for the unclosed configuration). The equation reduces to:
        ∇ψ Ie₃ = 0
      which is satisfied by any propagating grade-1 residual.
    mass: "Zero — I_rot = 0, consistent with grade chain"
    sat_mapping: >
      Maps to a satisfied SAT instance at depth-1 (F[Q] = 0). The grade-2
      cancellation via counter-orientation is the algebraic analogue of
      clause satisfaction via counter-literal cancellation.

  electron_solution:
    boundary_condition: "720° closure — ψ(θ + 4π) = ψ(θ)"
    ansatz: "ψ = √ρ · R_locked(θ) · exp(Iβ/2),  R_locked = exp(−θ/2 · B̂_spin)"
    substitution_result: >
      The Ie₃ term couples the gradient to the spin bivector. At the
      720° boundary, the spatial gradient ∂_x R_locked folds entirely
      into the internal precession ∂_θ R_locked. The equation becomes:
        ω_z R_locked = μ R_locked
      where ω_z is the trapped precession rate. The closure condition
      requires ω_z = μ = mc/ħ, which gives:
        m c² = ħ ω_z = I_rot ω_Φ²/2
      This is the grade-chain mass formula — derived, not fitted.
    mass: "I_rot ω_Φ²/(2c²) — derived from closure"
    sat_mapping: >
      Maps to a satisfied SAT instance at depth-1 (F[Q] = 0). The 720°
      fixed-point condition is the algebraic analogue of a satisfying
      assignment where all clause penalties cancel in the bivector sum.

  quark_solution:
    boundary_condition: "Truncated at 2π — partial closure"
    ansatz: "ψ = √ρ · R(θ) for θ ∈ [0, 2π], not closed"
    substitution_result: >
      The equation has no fixed point at 2π. The sign flip R(2π) = −1
      prevents self-consistency: the truncated solution satisfies the
      equation locally but fails the closure condition Q* = R_k[Q*].
      The solution is a partial closure — fractional writhe (Wr = 1/2
      for the single truncated rotor, consistent with Tw = 1/2 from
      ccr-iteration-by-depth.yaml), fractional charge from partial
      bivector activation.
    confinement_note: >
      The absence of a self-consistent fixed point at 2π is the algebraic
      origin of confinement: a single-rotor truncated solution cannot
      satisfy Q* = R_k[Q*] independently. Three orthogonal truncated
      solutions can — their product achieves grade-3 self-duality. This
      is why quarks appear only in colour-neutral combinations.
    mass: "Fractional — incomplete closure cost (current quark mass)"
    sat_mapping: >
      Maps to a 'lifted' result at depth-1 (F[Q] > 0, no satisfying
      assignment). The failure to achieve F[Q] = 0 independently is
      the computational signature of confinement.

  proton_solution:
    boundary_condition: "Three-fold orthogonal closure"
    ansatz: "ψ = ψ₁ ψ₂ ψ₃ — compositional product of three orthogonal rotor solutions"
    substitution_result: >
      The product solution has grade-3 pseudoscalar content. The equation
      for the product reduces to three coupled single-rotor equations,
      with the binding term CCR_binding appearing as the inter-rotor
      coupling. The grade-3 self-duality I² = −1 makes the product
      closed — no external grade components remain.
    mass: "3 · (current quark I_rot) + CCR_binding"
    mass_note: >
      Current quark I_rot contribution is small (~10 MeV total).
      CCR_binding dominates (~928 MeV). The proton-electron mass ratio
      (~1836) requires CCR_binding to be computed from three-fold closure
      topology. Open: SIM-005.
    sat_mapping: >
      Sits at the depth-1 capacity ceiling: 3 variables = 3 bivector
      planes = exactly Cl(3,0) capacity. Maps to a satisfied SAT instance
      at depth-1 with all three bivector planes activated. The CCR_binding
      term requires depth-2 lift — the inter-rotor coupling cannot be
      represented at depth-1 alone.
    depth_note: >
      The depth-1 capacity limit of 3 variables is not a computational
      constraint — it is the structural reason the proton requires exactly
      three quarks. Anything requiring more than three independent bivector
      planes at depth-1 must lift to depth-2.

---

computational_validation:
  depth1_sat_closure:
    file: "computation/derivations/depth1_sat_closure.py"
    status: "AVAILABLE — runs independently of SIM-004"
    what_it_tests: >
      The algebraic closure condition F[Q] = 0 matches boolean satisfiability
      exactly in the grade-2 sector of Cl(3,0). This validates the closure
      functional as a constraint-satisfaction mechanism before the full GP
      equilibrium solution is available. Success criterion: F[Q] = 0 iff
      the assignment satisfies all clauses.
    particle_mapping:
      photon: >
        μ = 0 case — grade-2 residual cancels via counter-orientation.
        Maps to a satisfied SAT instance. F[Q] = 0 expected.
      quark: >
        Truncated 2π case — no self-consistent fixed point.
        Maps to a 'lifted' result (no satisfying assignment at depth-1).
        F[Q] > 0 expected, consistent with confinement.
      proton: >
        Three-fold orthogonal closure — sits at depth-1 capacity ceiling.
        Maps to a satisfied SAT instance with all three bivector planes
        activated. CCR_binding requires depth-2 lift.
    grade_contamination_note: >
      The clause_penalty function builds penalties as products of
      (−sign · B_var) for violated literals. For multi-literal violated
      clauses this produces a grade-2 or higher product, which when
      multiplied may generate grade-0 (scalar) components alongside
      the grade-2 residual. The norm_sq functional F[Q] therefore
      includes grade-0 contributions from violated multi-literal clauses.
      This is computationally correct for the SAT validation purpose,
      but the structural interpretation requires care: if grade-0
      cancellation is needed for the particle taxonomy mapping, a
      grade-2 projection should be applied before computing F[Q].
      Open question: whether grade-0 contamination in F[Q] is
      intentional (encoding the scalar part of the closure residual)
      or should be projected out (pure grade-2 closure condition).

---

comparison_to_standard_dirac:
  statement: >
    The framework's equation reduces to the standard Dirac equation in
    the appropriate limit, but is NOT imported from it.

  mapping:
    standard_dirac: "∇ψ I σ₃ − m ψ γ₀ = 0  (Dirac-Hestenes, Cl(3,1))"
    framework:      "∇ψ I e₃ − (mc/ħ) ψ = 0  (Cl(3,0), m derived from I_rot)"

  correspondence:
    - standard: "γ₀ (timelike basis vector in Cl(3,1))"
      framework: "Π_eff carries the timelike role in Cl(3,0)"
      note: >
        The e₀ timelike basis vector is a Cl(3,1) residue (issue_8).
        In Cl(3,0), the local Π_eff encodes the process rate and
        replaces the need for a separate timelike direction.
        λ_Compton = ħ/mc is a spatial capacity threshold, not a
        spacetime interval.
    - standard: "m (external mass parameter)"
      framework: "I_rot ω_Φ²/(2c²) — derived trapped rotational inertia"
      note: "Mass is a consequence of closure, not an input"
    - standard: "σ₃ (spin quantization axis)"
      framework: "e₃ (same role in Cl(3,0))"
      note: "Identical algebraic role, appropriate algebra"
    - standard: "I (pseudoscalar, I² = −1)"
      framework: "I = e₁e₂e₃ (pseudoscalar in Cl(3,0), I² = −1)"
      note: "Same algebraic role"

  what_is_gained:
    - "Mass derived from closure topology, not fitted"
    - "720° periodicity as algebraic consequence, not imposed"
    - "Particle taxonomy as solution classes of one equation"
    - "Environmental dependence through Π_eff in I_rot — mass varies with local free potential"
    - "Confinement as algebraic consequence of no fixed point at 2π"
    - "Equation connects to the full NCH, not just the Dirac sector"
    - "Computational validation pathway via depth1_sat_closure.py before GP equilibrium is solved"

  what_is_lost:
    - "Standard Dirac form recognisability (m → I_rot notation)"
    - "Immediate connection to Cl(3,1) literature"
    - "Convenience of treating m as a single parameter"
    - note: >
        These are presentational losses, not structural losses.
        The equation is equivalent where it overlaps with standard Dirac;
        it extends further where standard Dirac stops.

---

open_derivations:
  priority_1:
    - id: "mu-dimensional-form"
      description: >
        Settle the dimensional form of μ. Show either that
        ω_Φ/c = mc/ħ follows from the closure condition (supporting
        candidate (i): μ = I_rot ω_Φ Π_eff / (2cħ)), or confirm
        that candidate (ii) (μ = mc/ħ with m derived separately) is
        the cleaner structural choice. This is prerequisite to the
        electron GP equilibrium solution.
      depends_on: ["ccr-writhe-from-cwf"]

    - id: "electron-solution-from-gp-equilibrium"
      description: >
        Explicitly solve ∇ψ Ie₃ − μψ = 0 with the 720° boundary
        condition, using the GP equilibrium shape from SIM-004. Show
        that the solution has the grade-2 deepened structure of the
        electron, and that ω_z = μ gives the correct electron mass.
      depends_on: ["mu-dimensional-form", "SIM-004-v2", "ccr-electron-explicit"]
      computational_test: "SIM-004-v2"

    - id: "photon-limit-from-mu-to-zero"
      description: >
        Show that the photon solution emerges as μ → 0 limit of the
        general solution, with the grade-2 residue cancelling via
        counter-orientation. Confirms one equation covers both massless
        and massive cases.
      depends_on: ["electron-solution-from-gp-equilibrium"]

  priority_2:
    - id: "grade-contamination-in-F-Q"
      description: >
        Determine whether grade-0 contamination in the depth1_sat_closure.py
        F[Q] functional should be projected out for the particle taxonomy
        mapping, or whether the scalar part of the closure residual carries
        structural information. Update depth1_sat_closure.py accordingly.
      depends_on: ["depth1_sat_closure.py validation"]

    - id: "quark-partial-closure-from-truncation"
      description: >
        Derive the fractional writhe (Wr = 1/2 for single truncated rotor,
        Tw = 1/2 per ccr-iteration-by-depth.yaml) and fractional charge
        from the truncated 2π solution. Show that partial bivector activation
        (bivector-partial-parameters.yaml) is the correct interpretation.
      depends_on: ["SIM-001-v3"]

    - id: "proton-product-solution-from-three-orthogonal"
      description: >
        Solve the compositional equation ψ = ψ₁ψ₂ψ₃ for three orthogonal
        single-rotor solutions. Derive CCR_binding and proton mass from
        three-fold closure topology.
      depends_on: ["SIM-005-v2", "SIM-007-v1"]

