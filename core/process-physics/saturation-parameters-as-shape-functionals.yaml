    depends_on: ["SIM-004-v2", "ccr-electron-explicit"]
    priority: 2

  - id: "shape-parameter-self-consistency"
    description: >
      Show that the fixed-point condition (g, Λ, κ) = (g[ρ*], Λ[ρ*], κ[ρ*])
      has a unique solution for the 720° Möbius vortex. Establishes that
      the shape-functional reading is not merely consistent but uniquely
      determines the parameters.
    depends_on: ["saturation-parameters-from-equilibrium-profile"]
    priority: 2

  - id: "phi-fingerprint-through-saturation"
    description: >
      Test the speculative claim that φ-scaling of the D₋₁ → D₀
      trajectory seeds the saturation curve in a way that surfaces
      √5 in f_closure. If confirmed, provides a mechanism for the
      pivotal CCR⁰ → f_closure link.
    depends_on: ["saturation-parameters-from-equilibrium-profile",
                 "SIM-004-v2"]
    priority: 3
    epistemic_note: "Speculative — offered as a candidate mechanism"

  - id: "delta-vc-from-shape-functional"
    description: >
      If the saturation parameters are shape-functionals, then V_c
      (whose P_env dependence was open) may also be a shape-functional.
      Check whether V_c = V_c[ρ*, B*] gives the functional form
      required for the D₂ → D₃ threshold shift.
    depends_on: ["saturation-parameters-from-equilibrium-profile"]
    priority: 3

