Newton's gravitational constant G is not a fundamental force parameter. 
It is the Closure-Configuration Ratio (CCR) of the grade-0 (scalar) 
depletion volume at the cosmic scale. This file maps the geometric 
distinction between localized grade-2 coupling (EM, α) and integrated 
grade-0 coupling (Gravity, G), resolving the hierarchy problem, and 
establishes the weak-field Poisson equation as a derived limit of the 
master equation, not a postulate.
