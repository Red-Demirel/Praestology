# ─────────────────────────────────────────────
# §3  THE DEPTH-LEVEL BUNDLING ISSUE
# ─────────────────────────────────────────────

depth_bundling:

  statement: >
    The depth levels in the cascade document are closure thresholds, not
    atomic construction steps. Each depth bundles multiple structural
    facts that co-emerge because they share the same closure condition.
    Reading the depth index as a fine-grained step counter misleads about
    what is derived at each depth.

  examples:
    d_minus_1_to_0:
      bundles:
        - "The recurrence v_{k+2} = v_{k+1} + v_k"
        - "The eigenvalues φ and φ⁻¹"
        - "Selection of φ⁻¹ as band-compatible"
        - "Emergence of the three-basis {e₁, e₂, e₃}"
        - "Π_eff baseline establishment"
        - "Viability filtering onset (V_c operative)"
      note: >
        The recurrence does not come first and then produce the eigenvalues
        and then produce the basis. All of these are co-established by the
        same closure condition. The depth index labels the threshold, not
        a sequence of atomic steps.

    d0_to_1:
      bundles:
        - "Cross-basis pairing eᵢ ∧ eⱼ"
        - "B² = −1 boundary condition"
        - "720° Möbius closure"
        - "Wr_eq = 3/2 via CWF"
        - "f_closure via S² integration"
        - "α as the CCR value"
        - "I_rot, E_Φ, χ_Φ, V_c, E_scale"
      note: >
        Same structure: multiple facts co-emerge at the same closure
        threshold. The π-structure of f_closure is one of these facts,
        and it is the least well-characterized of them.

  consequence_for_pi_structure: >
    The π-series candidate sits inside the D₀ → D₁ bundle. Its derivation
    is not "step 3 of the D₀ → D₁ transition" — it is one aspect of the
    closure condition that must be derived simultaneously with Wr_eq,
    the Möbius framing, and the cross-basis pairing. The derivation is
    holistic, not sequential.

  recommendation: >
    Where the cascade document or other files present depths as sequences
    of steps, add a note that depth labels index closure thresholds and
    that multiple facts co-emerge at each. This prevents readers from
    expecting a step-by-step derivation when the structure is holistic.

