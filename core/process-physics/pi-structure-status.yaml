# ─────────────────────────────────────────────
# §2  THE SPHERICAL-ORGANIZATION ASSUMPTION
# ─────────────────────────────────────────────

spherical_assumption:

  statement: >
    The π-series presupposes that the closure's orientation space
    organizes as nested spheres: S³ for the rotor space, S² for the
    bivector directions, S¹ for the phase residual. This organization
    is not derived — it is assumed in the construction of the candidate
    expression.

  what_makes_it_plausible:
    - "Rotors in Cl(3,0) are isomorphic to unit quaternions, whose space is S³."
    - "Unit bivectors in Cl(3,0) form a 2-sphere of directions."
    - "The phase factor exp(iθ) lives on S¹."
    - "So spheres are available in the framework's algebra."

  what_makes_it_a_non_sequitur: >
    Availability is not necessity. The closure condition (720° periodicity,
    B² = −1, Wr = 3/2, F = 8/3) does not by itself force the phase-space
    integration to run over these spheres in a way that produces the
    specific coefficients (4, 1, 1) on π³, π², π. Different measures on
    the same spaces would give different coefficients. The candidate
    expression is one of many possible spherical decompositions, and no
    derivation selects it over the alternatives.

  why_the_terms_dont_match_standard_volumes:
    - "Unit S³ volume is 2π², not 4π³."
    - "Unit S² area is 4π, not π²."
    - "The coefficient 4 on π³ would require a radius R ≈ 1.85 (from 2π²R³ = 4π³), which is not a natural geometric scale."
    - "The coefficient 1 on π² does not correspond to any standard spherical area for unit radius."

  consequence: >
    The three terms are not, as written, the standard volumes of nested
    spheres. The geometric gloss ("S³ volume, S² interface, self-intersection
    residual") is retroactive labelling, not derivation. This is exactly the
    direction of derivation the framework's own methodology warns against.

