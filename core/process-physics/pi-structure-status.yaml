# ─────────────────────────────────────────────
# §9  COMPOSITION NOTE (v0.2 addition)
# ─────────────────────────────────────────────

composition_note:
  statement: >
    The CCR integral is a composition from the start. The initial integral
    is not a simple integration over a single pre-chosen space. It is the
    composition of two co-dependent factors:

      Factor A: The rotor Haar measure on SU(2), restricted by the 720°
                closure condition (θ ∈ [0,4π]) and the Möbius self-
                consistency filter on the bivector direction B̂.

      Factor B: The coupling of the rotor action to local Π_eff modulation —
                how the rotor's phase step depletes or preserves free potential
                at each point along the closure path.

    Neither factor is independently derivable without the other: the
    measure restriction depends on which B̂ directions support a stable
    closure, and stability is determined by the Π_eff coupling. They
    co-emerge at the D₀ → D₁ closure threshold.

  implication: >
    Any derivation that treats the π-structure as arising from a single
    integration over a pre-chosen geometric space (spheres, tori, or
    any other manifold selected before the closure condition is applied)
    is repeating the spherical-decomposition error in a different form.
    The composition must be solved jointly, not factored into two
    independent steps.

  connection_to_zeno: >
    The discrete Zeno solve in discrete_zeno_core.py approximates Factor B
    (the Π_eff depletion per R5 firing cycle, with φ⁻¹ retention) but
    leaves Factor A (the Haar measure restriction) implicit in the radial
    lattice geometry. A complete derivation requires both factors to be
    made explicit and solved simultaneously. The Zeno solve's f_eq result
    is therefore an approximation whose accuracy depends on how well the
    radial lattice captures the Haar measure restriction.

  what_a_complete_derivation_looks_like: >
    1. Parametrise the closure path R(θ,B̂) for θ ∈ [0,4π], B̂ ∈ S².
    2. Apply the Möbius self-consistency filter: retain only B̂ directions
       for which R(4π,B̂) = R(0,B̂) (identity closure).
    3. Compute the Π_eff depletion along each path R(·,B̂) using the
       master equation's rotor-potential coupling.
    4. Integrate the depletion cost over the Haar-weighted filtered space.
    5. The result is f_closure. Its π-structure is the derivation.
    This is open: rotor-measure-from-closure-condition (priority 1).
