# ─────────────────────────────────────────────
# §4  THE EXPECTED RESOLUTION PATH: GA ROTOR CONSTRUCTIONS
# ─────────────────────────────────────────────

resolution_direction:

  statement: >
    The π-structure is expected to be derived from the geometric algebra
    of the closure itself. Rotor constructions in Cl(3,0) determine the
    phase-space measure on the closure's orientation space, and the measure
    determines which π-factors appear. The derivation path is:

      closure condition in Cl(3,0)
        → rotor parametrization of the closure's orientation space
        → measure on that space (determined by the rotor geometry)
        → phase-space integration over the measure
        → π-structure of the result
        → CCR value

  haar_measure_entry_point: >
    The natural measure on the rotor space is the Haar measure on SU(2),
    induced by the group structure of Cl(3,0) rotors — not a separately
    chosen geometric decomposition. Its total volume for unit radius is
    2π² (not 4π³). This is why the naive spherical-decomposition reading
    of 4π³+π²+π fails: unit S³ volume is 2π², not 4π³; the discrepancy
    requires a non-unit radius with no geometric justification.

    Starting point:
      dμ_Haar = (1/2π²) · sin²(θ/2) · sin(φ) · dθ dφ dψ
    where (θ, φ, ψ) are Euler angles on SU(2) ≅ S³.
    The sin²(θ/2) weighting is a group-structure consequence,
    not the naive uniform measure on S³.

    The 720° closure condition imposes θ ∈ [0, 4π] (not [0, 2π]).
    The Möbius framing imposes a self-consistency filter on the
    bivector direction B̂ — not all of S² is accessible; only
    directions supporting a stable 720° closure are allowed.

    The π-structure of f_closure emerges from integrating the
    Haar measure over the θ ∈ [0,4π] domain with the Möbius
    filter applied to B̂. The specific coefficients that result
    are what must be computed — they may or may not match the
    candidate 4π³+π²+π. Either outcome is derivation, not fitting.

  what_the_derivation_must_show:
    - >
      The rotor R(θ) = exp(−½B̂θ) for θ ∈ [0, 4π] traces a specific
      curve in the rotor space S³. The measure on S³ is not the naive
      uniform measure — it is the measure induced by the closure path
      and the boundary conditions at θ = 2π (sign flip) and θ = 4π
      (self-identity).
    - >
      The bivector B̂ = b₁₂(e₁∧e₂) + b₁₃(e₁∧e₃) + b₂₃(e₂∧e₃) lives in
      a two-parameter space (the unit sphere in the bivector parameter
      space). The measure on this space is determined by the closure's
      self-consistency — which parameter combinations support a stable
      720° closure.
    - >
      The integration of these measures, weighted by the closure condition,
      produces the π-factors. The specific coefficients depend on the
      measure, and the measure is what the derivation must determine.

  why_GA_is_expected_to_supply_the_answer:
    - >
      GA provides the natural parametrization of the rotor space: rotors
      are exponentials of bivectors, and the parametrization (B̂, θ) is
      canonical in the algebra.
    - >
      GA makes the boundary conditions algebraically explicit: the sign
      flip at 2π and the self-identity at 4π are properties of the rotor
      algebra, not extra postulates.
    - >
      GA naturally couples the rotor construction to the potential:
      the rotor's action on the substrate field determines the local
      Π_eff modulation, which determines the cost of the closure. The
      π-structure should emerge from this coupling rather than from a
      separately chosen geometric decomposition.
    - >
      The connection between rotor construction and Π_eff cost is the
      bridge that the earlier GP-based derivations were missing. GP
      treated the closure as a scalar field configuration; GA treats it
      as a rotor configuration whose action on the potential is the
      source of the closure cost.

  what_this_changes:
    prior_direction: >
      Assume spherical decomposition → construct π-series → retroactively
      label terms → compare to 137.036. Wrong direction.

    correct_direction: >
      Derive the rotor measure from the closure condition → integrate →
      extract π-structure → compare to 137.036. The comparison is a test,
      not a fit.

