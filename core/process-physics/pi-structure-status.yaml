# §6  OPEN DERIVATIONS
# ─────────────────────────────────────────────

open_derivations:

  priority_1:
    - id: "rotor-measure-from-closure-condition"
      description: >
        Derive the measure on the rotor phase space (S³ and its bivector
        sub-spaces) directly from the closure condition: 720° periodicity,
        sign flip at 2π, B² = −1, and the Möbius framing. The measure is
        what determines the π-structure; deriving it is the prerequisite
        for deriving the CCR value from first principles.
      depends_on: ["ccr-electron-explicit", "ga-grade-chain-to-particles.yaml"]
      priority: 1

    - id: "pi-structure-from-rotor-measure"
      description: >
        Integrate over the rotor measure derived above and extract the
        π-structure of the result. Check whether the result matches the
        candidate 4π³ + π² + π, or whether a different π-structure emerges.
        Either outcome is informative — matching confirms the candidate;
        not matching falsifies the spherical-organization assumption.
      depends_on: ["rotor-measure-from-closure-condition"]
      priority: 1

    - id: "rotor-potential-coupling"
      description: >
        Derive the coupling between the rotor construction and the local
        Π_eff modulation. The closure cost should emerge from the rotor's
        action on the potential, not from a separately chosen geometric
        factor. This is the missing bridge between the GA rotor framework
        and the CCR cost formula.
      depends_on: ["rotor-measure-from-closure-condition"]
      priority: 1

  priority_2:
    - id: "spherical-decomposition-justification"
      description: >
        If the rotor-measure derivation supports a spherical decomposition,
        show why the specific organization is S³ ⊃ S² ⊃ S¹ rather than
        some other nesting. If it does not, replace the spherical picture
        with the correct measure structure.
      depends_on: ["pi-structure-from-rotor-measure"]
      priority: 2

    - id: "depth-bundle-clarification"
      description: >
        Revise the cascade document and other files to state explicitly
        that depth levels are closure thresholds, not atomic steps, and
        that multiple structural facts co-emerge at each depth.
      priority: 2

  priority_3:
    - id: "coincidence-vs-confirmation"
      description: >
        If the rotor-measure derivation produces a π-structure different
        from 4π³ + π² + π, determine whether the difference matters for
        the numerical value of α. A close-but-not-equal result would
        indicate the candidate is approximate rather than exact.
      depends_on: ["pi-structure-from-rotor-measure"]
      priority: 3

