# ─────────────────────────────────────────────
# §1  CURRENT STATUS OF THE π-SERIES
# ─────────────────────────────────────────────

pi_series_status:

  candidate:
    expression: "Ω_rotor⁻¹ ≈ 4π³ + π² + π = 137.036304"
    role: "Illustrative geometric candidate for the electron's CCR in the void limit"

  epistemic_status: "EXAMPLE ONLY — not derived, not required by the framework"

  what_is_established:
    - "The D₀ → D₁ closure is a grade-2 rotor configuration in Cl(3,0)."
    - "The 720° closure fixes the topological class: Lk = 2, Tw = 1/2, Wr = 3/2."
    - "The phase-space integration over the closure's orientation space is the CCR numerator."
    - "The integration produces some dimensionless factor times Wr_eq — the specific value depends on the measure on the phase space."

  what_is_not_established:
    - "That the measure factorizes as 4π³ + π² + π."
    - "That the three terms correspond to S³ volume, S² interface, and S¹ residual."
    - "That the spherical decomposition (S³ inside S² inside S¹) is the correct organization of the phase space."
    - "That the numerical agreement with 137.036304 is confirmation rather than coincidence."

  why_the_flag_matters: >
    If the π-series appears as settled in some files and as "EXAMPLE ONLY"
    in others, readers will form inconsistent beliefs about its status.
    The framework's own methodological commitment (ccr_first_derivation_discipline)
    requires that candidate expressions be marked as candidates everywhere
    they appear, not just in the file where they were first introduced.

