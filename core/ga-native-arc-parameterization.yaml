# /core/ga-native-arc-parameterization.yaml
name: "GA-Native Arc-Length Parameterization: Box-Less Rotor Kinematics"
version: "1.0"
status: "SPECIFICATION — Replaces scalar velocity rescalings with intrinsic Spin(3) manifold parameterization."
domain: "Core /"

description: >
  Defines the intrinsic arc-length parameterization for the operative bivector trajectory
  on the Spin(3) manifold. Eliminates Euclidean coordinate rescalings and avoids artificial
  asymptotic background adjustments (psi_inf != 1) by anchoring the 720° double-cover
  invariant directly within the Cl(3,0) rotor line element.

dependency_map:
  requires:
    - "core/process-physics/ga-dynamic-theory.yaml"
    - "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
  provides_to:
    - target: "issues/foundational/SIM-004-v3-DualScale-Refined.yaml"
      via: "Box-less native evaluation of omega_flip^2 and f_geom"

---

# ─────────────────────────────────────────────
# §1  BOX-LESS PRINCIPLE (NO PREMATURE EUCLIDEAN MAPPING)
# ─────────────────────────────────────────────

box_less_principle:
  statement: >
    The Spin(3) manifold is a relational vector-multispace, not a field residing
    inside a pre-existing 3D Euclidean box (R^3). Spatial distance and background
    metric ds^2 are scalar projections <M^\dagger M>_0 generated by multivector
    interactions, not containers holding the interaction.
  
  operational_rules:
    - rule: "Do not scale asymptotic vacuum boundary conditions (psi_inf)."
      rationale: >
        The background scalar field far from the core is the unperturbed vacuum (psi_inf = 1).
        Scaling psi_inf > 1 forces the core flip to artificially inflate the global Euclidean
        container, dilating the healing length xi and destroying the topological saturation floor.
    
    - rule: "Do not apply ad-hoc scalar velocity rescalings over discrete time."
      rationale: >
        Dividing phase velocities by discrete array sums (dt * sum(omega)) imposes a flat,
        Euclidean clock onto the non-commutative rotor trajectory. The 4pi topological
        closure must emerge as an intrinsic property of the rotor arc length.

---

# ─────────────────────────────────────────────
# §2  NATIVE Spin(3) ARC-LENGTH FORMALISM
# ─────────────────────────────────────────────

rotor_kinematics:
  rotor_element: "R(s) in Spin(3) / Cl+(3,0)"
  
  bivector_velocity:
    definition: "Omega(s) = -2 * R^\dagger(s) * (dR/ds)"
    grade: 2
    meaning: "Native bivector phase velocity along the Spin(3) trajectory."

  intrinsic_arc_element:
    formula: "ds = ||Omega(tau)|| dtau"
    property: "Coordinate-free line element swept across the multivector manifold."

  topological_closure_invariant:
    formula: "oint_{720°} ds = oint_{0}^{4pi} ||Omega(s)|| ds = 4pi"
    meaning: >
      The total arc length of the 720° Möbius path is invariant (4pi). Parameterizing
      by arc length s in [0, 4pi] guarantees topological closure without altering local
      bivector phase acceleration variations.

---

# ─────────────────────────────────────────────
# §3  BARRIER AND GEOMETRIC INVARIANTS
# ─────────────────────────────────────────────

topological_barrier:
  formula: "Omega_flip^2 = || d^2 R / ds^2 ||^2_{saddle} approx 1.41418"
  interpretation: >
    The centrifugal barrier is the peak bivector phase acceleration at the intermediate-axis
    saddle point. In native arc-length s, it is topologically regulated near sqrt(2), slightly
    depressed (~1.41418) by the logarithmic saturation capacity (kappa) of the potential.

operative_ratio_f_geom:
  formula: "f_geom = (int_0^{4pi} Omega(s) * sn^2(s) ds) / (int_0^{4pi} sn^2(s) ds)"
  execution: "Evaluated natively in s in [0, 4pi] without Euclidean time projections."

---

# ─────────────────────────────────────────────
# §4  OPEN TRANSFORMATION QUESTION
# ─────────────────────────────────────────────

transformation_to_euclidean:
  status: "OPEN FOUNDATIONAL ASPECT"
  statement: >
    The exact mapping from native Spin(3) rotor dynamics to observed Euclidean 3D space
    (R^3) is itself a generative process (the R5 commitment projection). Because the transformation
    mechanism from multivector relational space to Euclidean metric space is a foundational
    subject of active derivation, all native calculations (Omega_flip, f_geom) MUST remain
    strictly box-less to avoid pre-judging or quenching the emergent spatial metric.


# ─────────────────────────────────────────────
# §5  CROSS-REFERENCES AND CONTEXT
# ─────────────────────────────────────────────

cross_references:
  directly_implements:
    - file: "issues/foundational/SIM-004-v3-DualScale-Refined.yaml"
      via: "Box-less operative_solver using arc-length s ∈ [0,4π]"
    - file: "computation/SIM-004-v3-DualScale-v2.py"
      via: "Python implementation: arc reparametrisation, acceleration-weighted f_geom"

  ontological_grounding:
    - file: "core/process-physics/euler-to-cl30-translation.yaml (v0.2)"
      note: "Identifies the level-mixing problem this file resolves. The
             'derivative-level vs process-level' distinction is reframed here
             as 'Euclidean box vs native Spin(3) arc' — same structural concern."
    - file: "core/SIM-004-v3-DualScale-Refined.yaml → box_less_principle"
      note: "The operational rules in §1 here directly implement the
             box_less_principle from the spec file."

  dual_aspect_connection:
    - file: "core/SIM-004-v3-DualScale-Refined.yaml → envelope_aspect / operative_aspect"
      note: "This file provides the native parametrisation for the OPERATIVE
             aspect. The ENVELOPE aspect (GP envelope, ψ*(r)) is unaffected —
             it lives in radial bivector space and is already coordinate-free."
    - file: "core/process-physics/dzhanibekov-as-moebius-integration.yaml"
      note: "The Ω_flip² ≈ √2 result from §3 is the composition point c₂
             (second-order coefficient = barrier height) identified in
             dzhanibekov-as-moebius-integration.yaml → second_order_coefficient."

  reference_state_connection:
    - file: "core/process-physics/reference-and-expression.yaml §8"
      note: "The flip phase (acceleration peak, Ω_flip²) corresponds to the
             R4→R5 boundary in the reference_state_model — the moment of
             potential reference-establishment. The dwell phase corresponds to
             the enabled state (R4 running, reference not yet established).
             Arc-length parametrisation ensures these phases are identified
             by topology (acceleration peak) not by arbitrary clock scale."

  what_remains_open:
    - id: "sn-at-arc-interpolation"
      description: >
        In the current implementation, sn(s) is approximated by sampling sn(t)
        uniformly in t (which approximates uniform sampling in s for smooth paths).
        A more precise implementation would interpolate sn at the actual arc-length
        positions. The error is small for k << 1 but grows near k → 1 (the
        critical modulus where the flip becomes slow). Worth revisiting if the
        self-consistency loop converges to k near 1.
    - id: "omega_flip_kappa_dependence"
      description: >
        The spec states Ω_flip² ≈ 1.41418, slightly depressed from √2 by
        logarithmic saturation κ. The current implementation computes it
        numerically from the Jacobi trajectory (which does not yet include
        the κ-dependent saturation). The κ-dependence of Ω_flip² is an open
        derivation — it requires coupling the envelope κ back into the
        operative trajectory, which the outer self-consistency loop does only
        for the GP equation, not yet for the Jacobi modulus k.
      depends_on: ["outer self-consistency loop fully coupling k ↔ κ"]
