    levinthal_connection: >
      The funnel is steep because the CCR gradient is strong — not a flat
      search space but a directed one. Folding speed ∝ CCR gradient magnitude.

---

simulation_protocol:

  step_1_initialise: >
    Sample N random unit bivectors B₁,...,Bₙ in Cl(3,0):
      Bᵢ = (c₁e₁₂ + c₂e₂₃ + c₃e₃₁) / ‖·‖   (three real coefficients, normalised)

  step_2_compute_f: >
    F[Q] = Σᵢ<ⱼ ‖BᵢBⱼ + BⱼBᵢ + 2δᵢⱼ‖²
    using Cl(3,0) geometric product via clifford library

  step_3_gradient_descent: >
    ∂F/∂cᵢₖ — numerical gradient (finite difference or autograd)
    Update: cᵢₖ ← cᵢₖ - η · ∂F/∂cᵢₖ
    Normalise each Bᵢ after each step

  step_4_detect_closure: >
    Closure achieved when F[Q] < ε (e.g. ε = 1e-10)
    Record: N, number of gradient steps to closure, final F value,
    final bivector configuration (orthonormality check)

  step_5_scan_N: >
    Run for N = 1, 2, 3, 4, 5, 6, 7 paths
    For each N: 100 random initialisations
    Record: convergence rate, mean steps to closure, F_min distribution
    Look for: sharp changes in convergence behaviour as N increases —
    N values where F_min cannot reach zero = closure impossible at that N

  step_6_record_gaps: >
    The N values where convergence fails or F_min > ε constitute the
    "impossible closure" sequence. Compare to magic numbers.
    Note: Cl(3,0) has only 3 independent bivector planes — for N > 3,
    paths must share planes, making F[Q] = 0 impossible. The sequence
    in Cl(3,0) is therefore limited to N ≤ 3, which is depth-2 only.
    Depth-3 (N > 3) requires the S⁷ embedding — confirming that
    SIM-006 is the correct next computation, not an extension of this one.

---

expected_output:
  n_leq_3: >
    For N ≤ 3: closure achievable (F → 0). Convergence fastest for N=3
    (three orthogonal planes are the natural Cl(3,0) closure).
  n_greater_3: >
    For N > 3: F[Q] cannot reach zero in Cl(3,0) — more paths than
    independent bivector planes. This is not a failure of the simulation;
    it is the correct result: depth-3 nuclear linking cannot be described
    in Cl(3,0) and requires the S⁷ embedding. The simulation confirms
    that the Cl(3,0) maximum is N=3 (the proton/neutron), exactly as claimed.

interpretive_constraint: >
  The output of this simulation CANNOT be presented as:
    - A derivation of the proton from first principles
    - A proof that triality requires exactly N=3
    - A computation of the proton mass
  It CAN be presented as:
    - Confirmation that the anticommutator functional correctly detects
      Clifford orthonormal closure in Cl(3,0)
    - Confirmation that Cl(3,0) admits closure for N ≤ 3 but not N > 3
    - Motivation for S⁷ as the depth-3 embedding (the limit of Cl(3,0)
      is exactly the boundary between depth-2 and depth-3)
    - An ansatz for what CCR_binding(d1,d2) minimisation looks like

