---

ccr_at_depth_2:
  structure: >
    At depth 2, CCR = (mutual phase stress of N stalled paths) / (grade-3 embedding volume frequency)
    Numerator: the anticommutator deviation F[Q] — the residual phase mismatch
                among N partial-writhe paths when they attempt mutual closure
    Denominator: the natural frequency of the pseudoscalar volume (grade-3 embedding)
    This is CCR_binding(d1,d2) from closure-types-nesting.yaml, with F[Q] providing
    the explicit form of the numerator.
  why_anticommutator: >
    In Cl(3,0): BᵢBⱼ + BⱼBᵢ = -2δᵢⱼ at orthonormal closure.
    The anticommutator deviation F[Q] = Σᵢ<ⱼ ‖BᵢBⱼ + BⱼBᵢ + 2δᵢⱼ‖² 
    vanishes exactly when the N paths achieve mutually orthonormal Clifford closure —
    the depth-2 analogue of Q*=R_k[Q*]. Verified numerically (see verification below).
    The commutator functional does NOT vanish at this point (gives 12, not 0).
  why_not_commutator: >
    In Cl(3,0), [Bᵢ,Bⱼ] = BᵢBⱼ - BⱼBᵢ = -2εᵢⱼₖBₖ, which is non-zero between
    different bivectors at orthonormal closure. A functional built on the commutator
    would detect rotation away from the fixed point it is meant to find.

algebra_verification:
  confirmed: >
    python3 verification shows:
      B1*B1 = B2*B2 = B3*B3 = -1  (correct for Cl(3,0))
      Commutator [B1,B2] = -2*B3   (matches -2*eps_123*B3)
      Anticommutator {B1,B2} = 0   (correct for i≠j)
      Anticommutator {B1,B1} = -2  (correct: 2*B1² = -2)
      F[B1,B2,B3] = 0.0            (functional vanishes at closure)
      Commutator functional = 12.0 (non-zero: confirms anticommutator is correct choice)

---

functional:
  definition: >
    F[Q] = Σᵢ<ⱼ ‖BᵢBⱼ + BⱼBᵢ + 2δᵢⱼ‖²
    where Bᵢ = Σₖ cᵢₖ·eₖₗ (grade-2 elements in Cl(3,0))
    and ‖·‖² = ⟨A·Ã⟩₀ (scalar part of A times its reverse)
  parameters: >
    Optimise over the real generator coefficients (cᵢₖ) for each path i,
    NOT over the angles θ. The angle parameterisation carries gauge redundancy
    and drifts during gradient descent.
  normalisation: >
    After each gradient descent step: divide each Bᵢ by √⟨BᵢB̃ᵢ⟩₀
    to maintain the unit constraint ‖Bᵢ‖ = 1.
  initialisation: >
    Begin from random unit bivectors in Cl(3,0). Run from multiple
    random starts to check that the convergence is robust.

---

depth_ccr_iteration_map:
  statement: >
    At each depth, CCR has the same ratio structure but different physical content:

  depth_1_electron:
    numerator: "Writhe Wr of grade-2 rotor path in S³ (phase integration cost)"
    denominator: "Substrate oscillation frequency Ω_embed"
