    closure_condition: "Q*(4π) = R_k[Q*] — 720° self-identity"

  depth_2_nucleon:
    numerator: "Mutual phase stress F[Q] among N stalled partial-writhe paths"
    denominator: "Grade-3 pseudoscalar volume natural frequency"
    functional: "Anticommutator deviation F[Q] = Σᵢ<ⱼ ‖BᵢBⱼ+BⱼBᵢ+2δᵢⱼ‖²"
    closure_condition: "Mutually orthonormal Clifford closure: F[Q]=0"
    note: "N=3 is motivated (three orthogonal planes in Cl(3,0)); not derived"

  depth_3_nucleus:
