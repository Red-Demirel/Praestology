# /issues/foundational/test-spec-electron-ccr-gp-equilibrium.yaml
issue_id: "SIM-004"
title: "Electron CCR: Solve GP Equilibrium for 720° Möbius Vortex & Extract α⁻¹"
type: "COMPUTATIONAL_DERIVATION"
status: "OPEN_FOR_CONTRIBUTORS"
difficulty: "EXPERT — Nonlinear PDE (Gross-Pitaevskii) + CWF Writhe on S³"
target_script: "derivations/electron_ccr_gp_solver.py"
supersedes: "N/A"

description: >
  Derive the fine-structure constant α from the equilibrium shape of the
  720° Möbius vortex solution of the saturating Gross-Pitaevskii (GP)
  equation in Cl(3,0). The CCR is defined as (Wr · Ω_rotor) / Ω_embed.
  This test computes Wr (writhe) and Ω_rotor (phase-space volume) from
  the numerically obtained equilibrium rotor configuration, and checks
  whether the resulting α⁻¹ equals 137.035999... (CODATA) to within
  the predicted environmental shift (2.2 ppm).

prerequisite: >
  This test assumes the rotor-to-ccr-transition.yaml result that the
  720° closure is the stable mass-lock solution of the GP equation.
  The GP equation is the high-V_eff limit of the master equation.

partial_parameter_note:
  statement: >
    The Möbius boundary condition ψ(r, φ+2π) = -ψ(r, φ) does not
    enforce single-plane bivector activation. A mixed-plane rotor
    R = exp(-½Bθ) with B = b₁₂(e₁∧e₂) + b₁₃(e₁∧e₃), |B|=1
    satisfies the same boundary condition as a single-plane rotor.
  energy_minimum_degeneracy: >
    By the rotational symmetry of Cl(3,0), the GP energy functional
    with the Möbius BC is degenerate across the full unit sphere in
    bivector parameter space (b₁₂, b₁₃, b₂₃). All points on this
    sphere give the same energy — the specific plane selected is a
    spontaneous symmetry breaking, not a physical distinction.
  consequence_for_writhe: >
    The writhe Wr of the equilibrium centreline is rotationally invariant:
    it depends on the geometric shape of the centreline in the embedding
    space, not on which specific bivector plane is activated. The single-
    plane assumption (b₁₂=1, b₁₃=b₂₃=0) is therefore valid for the
    numerics without affecting the Wr result. SIM-004 can proceed with
    the single-plane assumption.
  action: "No change to simulation spec required — single-plane assumption valid."

inputs:
  equation: >
    ( -∇² + g|ψ|² + Λ·ln(1+κ|ψ|²) ) ψ = μ ψ
    with ψ(r,θ) = √ρ(r) · exp(-½ B̂ θ) · exp(i S(r))
    in Cl(3,0) using the Madelung decomposition.
  boundary_conditions:
    - "ψ(r→0) regular (no singularity)"
    - "ψ(r→∞) → 0 (localised vortex)"
    - "S(θ+4π) = S(θ) (720° self-identity)"
    - "ρ(r) saturates at n_sat (finite density ceiling)"
  parameters_to_vary:
    - g: self-interaction strength (to be determined by the solution)
    - Λ, κ: saturation parameters (linked to n_sat and ξ)
    - B̂: unit bivector (fixed by chirality)

mathematical_formulation:
  writhe_extraction: >
    From the equilibrium ψ(r,θ), extract the rotor R(θ) = exp(-½ B̂ θ)
    along the centerline (r=0). The writhe Wr of the full 4π path
    is given by the Calugareanu-White-Fuller integral:
      Wr = (1/4π) ∫∫ (dγ₁ × dγ₂) · (γ₁ - γ₂) / |γ₁ - γ₂|³
    evaluated on the curve γ(θ) = (cos θ/2, sin θ/2 · B̂) in S³.
    This is the same as the full 4π path in SIM-001-v3.
  rotor_phase_volume: >
    Ω_rotor = ∫_{S³} d³q · |ψ(q)|² / |ψ_max|²
    where q ∈ S³ is the quaternion coordinate of the rotor.
    This measures the effective phase-space volume occupied by the
    equilibrium rotor distribution.
  embedding_volume: >
    Ω_embed = ∫_{S³} d³q = 2π² (volume of unit S³).
    However, in the presence of local commitment density η, Ω_embed
    is compressed: Ω_embed(η) = Ω_embed(0) · exp(-η/η_sat).
    The test must compute the bare (η=0) CCR first, then the
    terrestrial (η>0) CCR to check the 2.2 ppm shift.
  ccr_definition: >
    CCR = (Wr · Ω_rotor) / Ω_embed(η)
    α⁻¹ = 1 / CCR   (by definition of α as the electron's CCR)

success_condition: >
  The numerical equilibrium solution yields a bare (η=0) CCR such that:
    α⁻¹_bare = 1/CCR_bare = 137.036304 ± 1e-6
  (the geometric candidate value).
  The terrestrial (η>0) CCR yields:
    α⁻¹_terr = 137.035999 ± 1e-6  (CODATA within 2.2 ppm shift).
  The difference α⁻¹_bare - α⁻¹_terr = 2.2 ppm × 137 ≈ 0.000305
  is quantitatively reproduced by the η-compression formula.

falsification_condition: >
  1. No stable 720° vortex solution exists for any g, Λ, κ within
     physically reasonable ranges (i.e., the GP equation only admits
     360° or 1080° closures).
  2. The extracted Wr from the equilibrium shape differs significantly
     from the CWF-expected value of 3/2 (or whatever the correct
     equilibrium Tw turns out to be).
  3. The computed α⁻¹_bare differs from 137.036304 by more than 10 ppm,
     indicating the geometric S³ volume ansatz (4π³+π²+π) is incorrect.
  4. The environmental compression formula does not produce the correct
     shift direction and magnitude (i.e., α⁻¹_terr > α⁻¹_bare).

implementation_protocol:
  software:
    - language: "Python 3.10+ / Julia 1.9+"
    - libraries: "FEniCS or deal.II for PDE solver; clifford for GA"
  steps:
    - "1. Discretise the GP equation in 2D (r, θ) with periodic θ."
    - "2. Use Newton-Raphson or imaginary-time propagation to find the ground-state solution with 720° periodicity."
    - "3. Extract the rotor phase R(θ) along the centerline (r=0)."
    - "4. Compute Wr using the Gauss integral on the curve γ(θ)."
    - "5. Compute Ω_rotor by integrating |ψ|² over the quaternion coordinate q (mapped from r, θ)."
    - "6. Compute CCR and α⁻¹; check against target values."
    - "7. Vary η (via boundary density) to compute the shift."

