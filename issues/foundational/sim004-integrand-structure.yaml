open_items:

  - id: "explicit-chi-from-gp"
    description: >
      Compute χ(B) explicitly by solving the GP equation for each
      bivector orientation B on S². Requires the PDE solver from
      SIM-004-v2. Priority: 1.

  - id: "writhe-extraction-from-equilibrium"
    description: >
      Extract Wr_eq from the equilibrium Möbius centreline at B*.
      Verify that Wr_eq = 3/2 (per CWF: Lk = 2, Tw = 1/2). Priority: 1.

  - id: "f-closure-numeric"
    description: >
      Compute f_closure = ∫χ(B)dB / (4π) from the GP solution.
      This is the geometric factor in α⁻¹. Priority: 1.

  - id: "heat-entropy-mapping"
    description: >
      Establish the functional relationship H₀(Π_eff) between the
      entropy of ρ₀ and the substrate's free potential. Priority: 2.

  - id: "terrestrial-rho0-from-local-eta"
    description: >
      Model ρ₀^terr as a narrowed distribution under terrestrial
      commitment density. Compute the corresponding α⁻¹ and check
      against CODATA. Priority: 2.

  - id: "psi-from-rho1-verification"
    description: >
      Verify that the position-space image ψ = √ρ · exp(IS) of
      ρ₁ satisfies the standard Schrödinger equation in the
      non-relativistic limit. Priority: 3.

