correction_notes:
  problem_1_circular_energy_scale: >
    v1 set E_wr = m_e·c²/α = 70.0 MeV as the "energy per unit writhe,"
    then required CCR_binding = m_p/E_wr - 1 ≈ 12.4. This is circular:
    E_wr encodes both m_e and α as empirical inputs, so CCR_binding = 12.4
    is whatever value fits the known m_p, not a topological prediction.
    A genuine derivation must compute CCR_binding from the three-strain
    binding topology INDEPENDENTLY, then predict m_p. The current structure
    runs backward from the answer.

  problem_2_quark_mass_inconsistency: >
    v1 states "≈ 300 MeV per quark" in the falsification condition.
    But CCR_up × E_wr = (2/3 × 1/137) × 70 MeV ≈ 0.34 MeV — not 300 MeV.
    The 300 MeV figure is the constituent quark mass from chiral symmetry
    breaking (dynamical mass generation from the QCD vacuum condensate),
    a completely different quantity from the current quark mass derivable
    from fractional writhe. The falsification condition mixes two different
    mass concepts. The constituent quark mass requires the Higgs condensate
    CCR coupling (Yukawa), not the fractional writhe alone.

  problem_3_boundary_integral: >
    v1 proposes Wr_binding = (1/4π)∮(n·∇)I·dS where I = e₁e₂e₃.
    In Cl(3,0), I is a constant multivector — it has no spatial dependence,
    so ∇I = 0 identically. The proposed integral is zero before any
    computation. The correct quantity is the mutual linking number of the
    three rotor path centrelines — a Gauss-type double integral between
    pairs of curves in S³, the same CWF structure as SIM-001 applied to
    mutual linking rather than self-linking.

---

description: >
  Compute the non-additive CCR_binding for three single-rotor strains
  bound in mutually orthogonal bivector planes. The binding CCR comes
  from the mutual topological linking of the three rotor path centrelines
  in S³ — a Gauss linking integral between pairs of curves, not a volume
  integral of the pseudoscalar. If SIM-001 succeeds in establishing the
  fractional writhe of single strains, this computation then provides
  the additional binding cost and predicts the proton mass.

prerequisites:
  - SIM-001-v3 must successfully compute Wr(quark) and verify the ratio
    Wr(quark)/Wr(electron) = 2/3 or -1/3 from the CWF computation.
  - The energy scale must be derived from the GP field parameters
    (not retrofitted from m_e and α as empirical inputs).

---

mathematical_formulation:
  what_ccr_binding_is: >
    CCR_binding(d₁,d₂) is the writhe contribution from the mutual linking
    of two rotor path centrelines γ₁ and γ₂ in S³ — the Gauss linking
    integral between the two paths:

      Lk(γ₁, γ₂) = (1/4π) ∫∫ (dγ₁ × dγ₂) · (γ₁ - γ₂) / |γ₁ - γ₂|³

    For the three-quark proton, there are three such pairings:
      Lk(γ₁, γ₂), Lk(γ₁, γ₃), Lk(γ₂, γ₃)

    The total binding CCR is the sum of these three mutual linking numbers,
    weighted by the appropriate Ω_embed factor (as in the CCR formula).

  what_it_is_not: >
    CCR_binding is NOT computed from ∇I or any volume integral of the
    pseudoscalar — I is a constant in Cl(3,0) with ∇I = 0 identically.
    It is NOT computed from the grade-3 component of the rotor product
    alone — the grade-3 component encodes the volume element, not the
    inter-path linking.

  energy_scale_requirement: >
    The correct energy scale must come from the GP field parameters:
      E_wr = ħ·Ω_embed_characteristic
    where Ω_embed_characteristic is the natural oscillation frequency of
    the substrate at the relevant commitment depth. This is NOT determined
    by E_wr = m_e/α (which is circular — it encodes the answer via m_e).
    Until the GP field parameter derivation is complete (ccr-electron-explicit,
    vortex-stability.yaml), the energy scale is not available from first
    principles. The computation below should express m_p in terms of
    CCR values and the unknown E_wr, leaving the energy scale as a
    free parameter to be determined once the GP derivation closes.

  honest_prediction_structure: >
    Step 1: Compute Wr_self(quark) from SIM-001 (fractional writhe)
    Step 2: Compute Lk(γᵢ, γⱼ) for the three quark pair combinations
            using the Gauss linking integral on S³
    Step 3: Express CCR_binding = Σ Lk(γᵢ,γⱼ) / Ω_embed
    Step 4: Express m_p = (3·CCR_quark + CCR_binding) × E_wr
            where E_wr is left as a free parameter
    Step 5: Compute the RATIO m_p / m_e from the derived CCR values —
            this ratio is dimensionless and independent of E_wr if the
            energy scale cancels, providing a genuine testable prediction

  ratio_prediction: >
    The genuine test is:
      m_p / m_e = (3·CCR_quark + CCR_binding) / CCR_electron
    where CCR_electron = 1 (by definition — the full 4π electron path
    writhe is the reference unit). If the topology gives the right ratio
    m_p/m_e ≈ 1836 without fitting E_wr, the derivation is genuine.
    If achieving m_p/m_e = 1836 requires adjusting E_wr, it is a fit.

---

success_condition: >
  The Gauss linking integral computation of Lk(γᵢ, γⱼ) for the three
  orthogonal quark path pairs, combined with the single-quark writhes
  from SIM-001, yields:
    (3·CCR_quark + CCR_binding) / CCR_electron ≈ 1836
  without adjusting any free parameter. This would be a genuine prediction
  of the proton-to-electron mass ratio.

falsification_condition: >
  1. Lk(γᵢ, γⱼ) diverges or is path-dependent for the S³ curves —
     the linking integral is not well-defined for these paths.
  2. The mass ratio (3·CCR_quark + CCR_binding)/CCR_electron ≠ 1836
     by more than 1% — the topological model does not recover the
     proton-to-electron mass ratio.
  3. SIM-001 fails (Wr(quark)/Wr(electron) ≠ 2/3 or -1/3) —
     the prerequisite computation does not support fractional charge
     from truncated S³ paths.

